name: QuicProbe
options:
  bundleIdPrefix: com.ditchoom
  deploymentTarget:
    iOS: "17.0"

targets:
  QuicProbe:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ditchoom.quicprobe
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "2"
        DEVELOPMENT_TEAM: E8JYF6E4H9
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Info.plist
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The Kotlin/Native framework is produced by `./gradlew :ios-probe:linkDebugFrameworkIosArm64`
        # and lives outside this directory; point both the search path and the runtime loader at it.
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/../build/bin/iosArm64/debugFramework
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
    dependencies:
      - framework: ../build/bin/iosArm64/debugFramework/probe.framework
        embed: true
        codeSign: true
