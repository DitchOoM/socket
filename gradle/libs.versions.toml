
[versions]
kotlin = "2.4.0"
# liburing version for Linux io_uring async I/O - built automatically by Gradle
liburing = "2.15"
liburingSha256 = "8d052f2622dcb3678cbaee5ff582a87572672a6c0a56533cdda5b65cb636120a"
# quiche (Cloudflare QUIC) for socket-quic module - built from source via Cargo.
# NOTE: the quiche build git-clones by tag (--recursive), so quicheSha256 is currently
# ADVISORY (downloadQuicheSource suppresses it) — it pins the SHA256 of
# https://github.com/cloudflare/quiche/archive/refs/tags/<quiche>.tar.gz as documentation.
# liburingSha256 IS enforced (liburing uses a tarball download).
quiche = "0.29.3"
quicheSha256 = "c840a0d04e2406d0989a5238f6d6054aa0139872ed49a6c48395fca0cfcad75c"
# BoringSSL is no longer built here. The base :socket Linux K/N TLS (LinuxSockets.def) and the Linux
# quiche `ffi,qlog` external path now consume the CANONICAL boringssl-kmp bundle via the
# `com.ditchoom.boringssl.provision` plugin (owner: :boringssl-canonical klib). The canonical commit
# (44b3df6f — boring-sys 4.22.0 ABI) is pinned in boringssl-kmp, NOT here; socket no longer clones
# google/boringssl. quiche was bumped 0.29.2 -> 0.29.3 (#258) after the canonical pin was set against
# 0.29.2; the linuxX64 one-copy/co-link validation is the tripwire that 44b3df6f still satisfies
# quiche 0.29.3's `ffi,qlog` external BoringSSL refs at K/N final link.
# The old socket-owned pin was boringssl = "f1c75347..." (removed — mis-pinned vs quiche's ABI).
# Windows/Android/Apple/fuzz still build a self-contained libquiche via `boringssl-boring-crate`.
androidGradlePlugin = "9.2.1"
ktlint = "14.2.0"
mavenPublish = "0.37.0"
dokka = "2.2.0"
kotlinxCoroutines = "1.11.0"
kotlinWrappers = "2026.6.0"
# 6.1.0 adds the raw ByteStreamMux primitive + BufferedByteSource.peek (buffer PR #239).
# 6.5.0→6.7.2: buffer-pool use-after-release fail-fast (#261), okio interop, codec-framed
# streaming layer + typed pipe (#268), buffer-sqldelight module. Additive, drop-in.
# 6.9.1 (#238) shipped buffer #276 — the KClass-bearing codegen annotations (@ForwardCompatible,
# @DispatchOn, @FramedBy) move from BINARY to SOURCE retention so a shrinking CONSUMER's proguard
# resolves socket-http3's Http3Frame.Unknown ref. 6.11.0 supersedes it (linear on buffer main, so it
# carries #276) AND adds the datagram trichotomy (DatagramChannel/DatagramSource/DatagramSink +
# SocketAddress) under @ExperimentalDatagramApi (RFC Phase 0/1) — the substrate :socket-udp + the
# Phase 6 QUIC cutover consume. Released on Maven Central (buffer #291).
# 6.12.0->6.16.1: all additive/drop-in (no source removals/renames across the range; buffer stayed
# in 6.x so its label-derived semver confirms no break). New: crypto secureRandom (#294),
# alias-addressable KeyStore + SPKI export (#292), AES-ECB single-block (#301), deriveTlsPremasterSecret
# raw (EC)DHE (#302); codec @JvmInline value-class-over-String fields (#299); fixes: JVM21 FFM
# readString bounds-check (#295), generated wireSize growth-safe (#304).
# 6.17.2->6.22.0: still all additive/drop-in (linear on buffer main, still 6.x, no source
# removals/renames — the only deletions in the range are `internal expect` seams and KDoc).
# codec: @LengthFrom widened to deferred payloads + FrameLimits (#310), and two decode-bound
# HARDENINGS — unframable @LengthFrom peek arithmetic is rejected and decoded frame size is bounded
# (#309), wire-supplied lengths that would widen decode bounds past the enclosing limit are rejected
# (#315). Those tighten the generated-codec decode path :socket-http3 rides, so the H3/QPACK
# conformance suites are the gate on this bump. Rest is buffer-crypto hardware-key work socket does
# not consume (Android Keystore / Secure Enclave / TPM ECDH: #316, #317, #319, #320, #321, #322).
# 6.23.0 (buffer #325): datagram addressing-mode de-null — the experimental datagram surface splits
# into Connected/Addressed source/sink/channel refinements (send arity per mode; no nullable `to`),
# typed absent states (LocalAddress/HopLimit + read-side Ecn.Unknown), send-side EcnPreference, and a
# non-null typed DatagramReadResult.Closed(reason: DatagramCloseReason). Breaking only inside
# @ExperimentalDatagramApi; :socket-udp and :socket-quic-quiche migrate in lockstep in this PR.
# 6.24.0->6.25.0: additive/drop-in. 6.24.0 is hex ⇄ String conversions (#324) + a datagram-send KDoc
# clarification (#327), neither of which socket consumes. 6.25.0 (buffer #328/#330) adds ONE field,
# `DatagramCapabilities.requiresNativeMemoryBuffers`, defaulting to false — the channel-level answer to
# "does my send path need the payload backed by a raw address". :socket-udp's native channels must
# advertise it (io_uring `sendmsg` / `NWConnection` / `sendto` all take an address), because the new
# KDoc makes the default an affirmative `false` claim rather than an absent one — so leaving the Apple
# and Linux channels at their current value would be a lie a consumer acts on.
# 6.25.1->6.26.0: drop-in — every change lands in a module or surface socket does not consume. 6.25.1 is
# an Apple buffer-crypto `aesGcmOpen` leak fix (buffer #335: two ciphertext slices per record) plus a
# buffer-compression detekt cleanup (#336); socket links buffer-crypto only from :socket-quic-quiche and
# only for sha256 — QUIC's AEAD is quiche/BoringSSL, not buffer-crypto — and never depends on
# buffer-compression. 6.26.0 (buffer #337) renames buffer-crypto's PKCS#11 configuration names to be
# module-neutral; that rename is the only source-breaking item in the range, and socket references no
# PKCS#11 symbol in any source set.
# 6.27.0->6.29.0. Read the ORDERING before the content, because this range contains the one version in
# the line to never resolve to — and socket was pinned to it. 6.28.0 was tagged from buffer #342
# (`watchosDeviceArm64` across every module with Apple targets), while #343 (buffer-crypto reports
# X25519 unavailable on every Android, and it is not) merged *after* #342 and shipped as 6.27.1 — from a
# commit whose parent is #342's. So 6.27.1 ⊃ 6.28.0 by content while losing to it by number, and since
# Gradle resolves version conflicts UP, socket's POM naming 6.28.0 silently reverted #343 for every
# consumer that did not pin buffer itself. 6.28.1 re-tags #343's commit above 6.28.0 and ends the
# argument. socket references no X25519 or `KeyAgreement` symbol in any source set, so this was never a
# defect *here* — it was one socket exported.
# 6.29.0 is that escape plus one functional change socket does consume: #349 reclaims wasmJs linear
# memory on release, and socket publishes wasmJs from root :socket and :socket-quic. The rest of the
# range is buffer's own CI and dependency bumps. #341 (buffer-crypto `UserVerification`) is not
# consumed — socket links buffer-crypto only from :socket-quic-quiche and only for sha256.
# #342 matters here beyond the ordering trap: it is the UPSTREAM HALF of watchosDeviceArm64 for this
# repo, so `socket-udp/build.gradle.kts`'s "buffer publishes no klib for it" is stale from 6.28.0 on.
# 6.29.0->6.30.0: drop-in. The new text (writeText/readText/TextPolicy) and codec-processor
# FrameDetector surfaces are additive with defaults; #360's E5 rule (framing uniform across a dispatch
# family) accepts socket-http3's Http3Frame — @FramedBy sits on the @DispatchOn parent, no variant.
# 6.30.1 (buffer #361) is the UPSTREAM HALF of this branch's partial-write fix: it lands
# `ByteSink.writeFully` + `ByteSinkStalledException` in buffer-flow, behaviourally identical to the
# copies added here, and fixes `writeGathered`/`CodecSink.send` — neither of which socket calls. So
# socket deletes its duplicates and imports buffer's; see the cleanup commit.
buffer = "6.30.1"
ksp = "2.3.9"
# held at 1.18.0: androidx-core 1.19.0 requires compileSdk 37 (we compile against 36)
androidxCore = "1.19.0"
# androidx.startup — App Startup's InitializationProvider is how :network-monitor gets the application
# Context on Android without the app remembering to call NetworkMonitor.installAndroidContext().
# minSdk 21 (matches ours); its consumer proguard.txt already keeps `* extends Initializer`.
androidxStartup = "1.2.0"
# Robolectric — host-JVM Android framework for :network-monitor's androidUnitTest. The Android monitor
# (ConnectivityManager callbacks, the App Startup initializer, the ACCESS_NETWORK_STATE failure) is
# otherwise testable only on the emulator lane, which is one API-29 job that also boots an AVD and
# builds the quiche NDK libs — far too slow to be the sole signal, and blind to the API<23 branch.
robolectric = "4.16.1"
# Jazzer — coverage-guided fuzzing driver; runtime-only on the quicHeaderFuzz task, never a test dep
jazzer = "0.30.0"
# R8 — JVM-only offline retrace lib for :socket-quic-trace-tools (deobfuscate captured QUIC traces
# against an Android-release mapping.txt). Isolated in that module's classpath, NOT the Gradle
# plugin/buildSrc classpath (would collide with AGP's bundled R8). 9.1.x matches AGP 9.x.
r8 = "9.1.31"

