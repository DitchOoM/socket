# compileSdk is 37, but Robolectric 4.16.1 (the newest STABLE release as of 2026-08 — 4.17 exists only
# as beta-1/beta-2 on Maven Central) ships no SDK 37 android-all jar. Left to its default SDK picker,
# Robolectric derives the target SDK from targetSdk/compileSdk and every test class fails with
# "initializationError" / IllegalArgumentException out of DefaultSdkPicker before a single test runs.
# Pin to the newest SDK Robolectric 4.16.1 actually ships (36) instead. Remove this file once the
# pinned Robolectric version supports SDK 37 (gradle/libs.versions.toml `robolectric`).
sdk=36
