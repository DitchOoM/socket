kotlin.code.style=official
android.useAndroidX=true
# AGP 9.0 makes `com.android.library` incompatible with the Kotlin Multiplatform
# plugin and pushes the new `com.android.kotlin.multiplatform.library` plugin.
# Stay on the classic android {} DSL via AGP 9's official transitional opt-out.
android.builtInKotlin=false
android.newDsl=false
org.gradle.jvmargs=-XX:MaxMetaspaceSize=4g
org.gradle.parallel=true
org.gradle.caching=true
kotlin.mpp.stability.nowarn=true
libraryName=Socket
libraryDescription=Simple multiplatform kotlin coroutines based socket.
publishedGroupId=com.ditchoom
artifactName=socket
siteUrl=https://github.com/DitchOoM/socket
gitUrl=git://github.com/DitchOOM/socket.git
developerId=thebehera
developerOrg=Ditchoom
developerName=Rahul Behera
developerEmail=rbehera+ditchoom@gmail.com
licenseName=The Apache Software License, Version 2.0
licenseUrl=https://www.apache.org/licenses/LICENSE-2.0.txt
allLicenses=["Apache-2.0"]
kotlin.mpp.enableCInteropCommonization=true
# Yarn for the Kotlin/JS + Wasm npm installs. Pinned (it was the Kotlin plugin's default) because CI
# provisions this exact version itself rather than download it from GitHub: see the KOTLIN_JS_YARN
# block at the end of build.gradle.kts and .github/scripts/provision-kotlin-js-yarn.sh.
kotlinJsYarnVersion=1.22.22
