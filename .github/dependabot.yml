# Dependabot keeps GitHub Actions and the Gradle libraries current, the Gradle
# wrapper included. The Kotlin toolchain (Kotlin, KSP, kotlin-wrappers) moves as
# one grouped PR so a Kotlin bump never lands without its matching KSP, and the
# full PR matrix validates it. The native deps built from source (quiche/BoringSSL,
# liburing) are plain version strings in gradle/libs.versions.toml, not Maven
# modules, so Dependabot never sees them: native-deps-freshness.yaml surfaces
# those daily as an issue, and they are bumped by hand.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # AGP majors change the Android build model and are taken by hand.
    ignore:
      - dependency-name: "com.android.*"
        update-types: ["version-update:semver-major"]
    groups:
      kotlin-toolchain:
        # Kotlin, KSP and kotlin-wrappers in one PR: a Kotlin release and the KSP
        # build that supports it must land together.
        patterns:
          - "org.jetbrains.kotlin:*"
          - "org.jetbrains.kotlin.*"
          - "com.google.devtools.ksp*"
          - "org.jetbrains.kotlin-wrappers:*"
      gradle-minor-patch:
        # One PR for all non-major bumps to keep noise down; majors stay separate.
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
