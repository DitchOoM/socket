name: "Wait for an artifact of this run"
description: >-
  Waits until this workflow run holds the named artifact, so a job can start beside the job that uploads it
  and take it as soon as it exists, instead of waiting (through `needs:`) for a whole reusable workflow
  around that job. Fails at once when the producing job ends without it, and after timeout-minutes.
inputs:
  name:
    description: "The artifact's name."
    required: true
  producer:
    description: "The producing job's name, or a unique part of it (a reusable workflow prefixes its caller's job name)."
    required: true
  timeout-minutes:
    description: "How long to wait."
    required: false
    default: "45"
  github-token:
    description: "A token that can read this run's artifacts and jobs (actions: read)."
    required: true
runs:
  using: "composite"
  steps:
    - name: Wait for ${{ inputs.name }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        NAME: ${{ inputs.name }}
        PRODUCER: ${{ inputs.producer }}
        TIMEOUT_MIN: ${{ inputs.timeout-minutes }}
      run: bash "${GITHUB_WORKSPACE}/.github/scripts/await-artifact.sh" "$NAME" "$PRODUCER" "$TIMEOUT_MIN"
