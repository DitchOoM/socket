name: "Apple quiche build environment"
description: >-
  JDK + Konan/Gradle cache restore + the prebuilt Apple quiche natives, for every job that fans out
  of build-apple.yaml's `natives` job. Exists so the six consumer jobs cannot drift apart in how
  they restore state — the failure mode of copy-pasting this block six times is one shard silently
  rebuilding quiche from source for ~15 minutes while the others don't.

inputs:
  konan:
    description: "Restore the ~/.konan cache. Only the Kotlin/Native jobs need it; the JVM-only jobs skip it (it is ~450MB)."
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # ⚠️ Guards a SILENT failure mode. build-apple.yaml sets ORG_GRADLE_PROJECT_version once at
    # WORKFLOW level from `inputs.version`, so it covers all six fanned-out jobs without repeating
    # itself. If that expression ever stopped resolving (a rename, or an `env:` block moved under a
    # context where `inputs` is unavailable), the variable would simply be empty — and
    # build.gradle.kts falls back to querying Maven Central live when no version is supplied. That
    # is exactly the per-job version split #329 removed, and it would come back INVISIBLY: every
    # job still produces a plausible version, just not necessarily the same one. Fail loudly here
    # instead, before any Gradle call.
    - name: Assert the run's version is pinned
      shell: bash
      run: |
        if [ -z "${ORG_GRADLE_PROJECT_version:-}" ]; then
          echo "::error::ORG_GRADLE_PROJECT_version is empty in this job. The workflow-level env in"
          echo "::error::build-apple.yaml did not resolve inputs.version, so every Gradle call here"
          echo "::error::would fetch its own version from Maven Central — the #329 split, silently."
          exit 1
        fi
        echo "version pinned for this job: ${ORG_GRADLE_PROJECT_version}"

    # No `cache: gradle` — the caches are restored explicitly below, and setup-java's gradle cache
    # points at the same ~/.gradle/caches directory. See the build-apple.yaml cache steps.
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '21'

    # RESTORE-ONLY (actions/cache/restore, not actions/cache) in every fanned-out job, on purpose.
    # The full action also SAVES at post-step, so with six parallel consumers a cache miss would have
    # all six racing to upload the same key — five of them losing, all six paying the upload. The
    # `natives` job is the single writer for these keys.
    - name: Restore Konan cache
      if: inputs.konan == 'true'
      uses: actions/cache/restore@v5
      with:
        path: ~/.konan
        key: konan-macos-${{ hashFiles('gradle/libs.versions.toml') }}
        restore-keys: konan-macos-

    # Prefers the `gradle-macos-kn-*` entry, which is saved by the widest K/N test shard and so
    # actually contains build-cache-1 klib output. The plain `gradle-macos-*` entry is written by
    # `natives`, which only runs cargo and a Gradle configure — it holds no klibs (measured: 258MB
    # vs 1088MB for a pre-fan-out entry), so restoring only that would make every shard recompile
    # Kotlin/Native cold on every run. Ordered fallbacks: exact klib cache, newest klib cache,
    # then the natives-only cache, which is still better than nothing for dependency resolution.
    - name: Restore Gradle build outputs
      uses: actions/cache/restore@v5
      with:
        path: ~/.gradle/caches
        key: gradle-macos-kn-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-macos-kn-
          gradle-macos-

    - name: Restore Gradle wrapper distribution
      uses: actions/cache/restore@v5
      with:
        path: ~/.gradle/wrapper
        key: gradle-wrapper-macos-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

    # The five Apple libquiche.a / dylib / JNI shim sets built once by `natives`. Restored to the
    # exact paths the Gradle build and the K/N `-force_load` link expect.
    - name: Download prebuilt Apple quiche natives
      uses: actions/download-artifact@v8
      with:
        name: quiche-apple-natives
        path: socket-quic-quiche/libs/quiche

    # ⚠️ Load-bearing, and the reason this whole fan-out works at all.
    #
    # buildQuicheAppleStaticLibs / buildJvmJniShim* skip their (10-20 minute) cargo builds via
    #   onlyIf { !markerFile.exists() || !destStatic.exists() }
    # where markerFile is a DOTFILE inside lib/ — `.built-<ver>-qlog-<digest>`,
    # `.built-<ver>-qlog-jvm-<digest>`, `.jni-built-<ver>`. Two hazards:
    #
    #  1. actions/upload-artifact excludes hidden files unless `include-hidden-files: true`. Without
    #     it the .a files arrive but the markers do NOT, so every shard re-runs cargo — a green run
    #     that costs 15 extra minutes per shard and silently deletes the entire point of the split.
    #     The upload in `natives` sets that input; this step fails loudly if it ever regresses.
    #
    #  2. buildJvmJniShim*'s guard is an MTIME COMPARISON:
    #         jniSourceFile.lastModified() > markerFile.lastModified()
    #     Checkout writes quiche_jni.c at job start; the artifact download may carry the marker's
    #     original mtime from the `natives` job, which can be EARLIER. That reads as "the source was
    #     edited after the shim was built" and rebuilds. `touch` makes the restored markers newer
    #     than the checkout, which is the true state of affairs: these natives were built from this
    #     very commit's source, by the `natives` job in this same run.
    - name: Make restored quiche markers authoritative
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        markers=(socket-quic-quiche/libs/quiche/*/lib/.built-* socket-quic-quiche/libs/quiche/*/lib/.jni-built-*)
        if [ ${#markers[@]} -eq 0 ]; then
          echo "::error::No quiche build markers restored from the quiche-apple-natives artifact."
          echo "::error::Almost certainly 'include-hidden-files: true' was dropped from the upload"
          echo "::error::in the natives job — without the markers every shard silently re-runs cargo."
          echo "--- what did arrive: ---"
          find socket-quic-quiche/libs/quiche -maxdepth 3 | head -50
          exit 1
        fi
        # Newer than the checked-out quiche_jni.c, so the mtime guard reads "shim is current".
        touch "${markers[@]}"
        printf 'restored + touched %d quiche marker(s)\n' "${#markers[@]}"
        printf '  %s\n' "${markers[@]}"

    # HARD check, mirroring the one the monolithic job ran after building: the K/N link gates
    # -force_load on each libquiche.a existing at CONFIGURATION time, so a missing archive surfaces
    # as a confusing unresolved-symbol link error many minutes later instead of a clear message here.
    - name: Verify Apple quiche static libs are present
      shell: bash
      run: |
        set -euo pipefail
        missing=0
        for d in macos-arm64 macos-x64 ios-arm64 ios-simulator-arm64 ios-x64; do
          f="socket-quic-quiche/libs/quiche/$d/lib/libquiche.a"
          if [ ! -f "$f" ]; then echo "::error::missing $f"; missing=1; else echo "ok: $f"; fi
        done
        [ "$missing" = 0 ] || { echo "::error::Apple quiche static libs missing from the artifact."; exit 1; }
