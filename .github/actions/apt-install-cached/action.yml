name: "apt-get install, from a warmed .deb + package-index cache"
description: >-
  Installs apt packages from a nightly-warmed cache of .deb files (and, since -v2, the apt package
  index that resolves them), and puts a hard, legible wall-clock budget on any path that still has
  to touch the mirror. Since 2026-08-19 it also owns its `apt-get update` (via apt-safe-update),
  run ONLY when the cache cannot fully serve — call sites must not add their own update step, or
  every job pays a mirror round-trip that a warm cache exists to avoid. Restore-only for every
  caller except the nightly warmer, which is the single writer.

inputs:
  packages:
    description: "Packages to install. Whitespace- or newline-separated."
    required: true
  purpose:
    description: "Short human-readable reason, shown in the job log so a cache miss says what it missed."
    required: false
    default: "build toolchain"
  save:
    description: >-
      "true" ONLY in .github/workflows/native-deps-freshness.yaml. Every other caller is
      restore-only. See the single-writer note in the step body.
    required: false
    default: "false"
  timeout:
    description: >-
      Hard wall-clock budget for the download+install, as a timeout(1) duration. Exceeding it fails
      the step with a diagnostic naming the mirror, instead of silently eating the job's budget.
    required: false
    default: "8m"

runs:
  using: composite
  steps:
    # ⚠️ WHY THIS ACTION EXISTS — it deleted two jobs on 2026-08-14 (issue #368).
    #
    # `setup-linux-fuzz` (PR #364) and `Consumer Smoke` (PR #361) both burned their ENTIRE job
    # budget inside `apt-get install` of the aarch64 cross-toolchain, on two unrelated PRs, in the
    # same 22:55-23:20 UTC window. Throughput on azure.archive.ubuntu.com collapsed mid-step:
    #
    #   22:56:14  Fetched 14.0 MB in 1s (18.9 MB/s)          # first 7 packages
    #   23:18:40  Get:24 g++-13-aarch64-linux-gnu  12.2 MB   # 76s, still not done
    #   23:20:51  ##[error]The operation was canceled.
    #
    # Both surfaced as a `cancelled` conclusion with the real work never started — which reads
    # like a human cancelled the run, or (on a fuzz lane) like fuzzing found something. Neither
    # was true, and both cost a full re-run to discover.
    #
    # ⚠️ `-o Acquire::Retries=` DOES NOT FIX THIS, and it is worth being precise about why, because
    # the retry option was already present at 6 of the 8 call sites while both failures happened.
    # apt's timeouts are INACTIVITY timeouts. A transfer crawling along at 40 KB/s is active, so
    # neither Acquire::http::Timeout nor Retries ever fires — apt waits, correctly and forever, for
    # a mirror that is technically still talking to it. There is no "minimum throughput" knob.
    #
    # So the fix is to not be on the mirror's critical path at all: the same ~100 MB of .debs, on
    # every run of every Linux lane, is cached. The timeout below is the backstop for the residual
    # case (cold cache AND slow mirror), and its job is to fail FAST and SAY WHY rather than to
    # prevent the stall.
    #
    # ⚠️ 2026-08-18 EXTENSION — six jobs across four runs instead died one step EARLIER, at
    # apt-safe-update's own `apt-get update` (now budgeted too, see that action). This action's own
    # cache picked up the apt package INDEX (`/var/lib/apt/lists`, not just the .debs) so that, on a
    # full hit, the Install step below never has to reach the mirror either — see the `--no-download`
    # path. Two independent mitigations for the same root cause (an inactivity-timeout blind spot on
    # a crawling mirror), because each protects a different step.
    #
    # ⚠️ 2026-08-19 EXTENSION — the `apt-get update` itself moved INSIDE this action (the step after
    # the cache seed), gated so it runs only when the cache cannot fully serve. Call sites used to
    # run apt-safe-update unconditionally before this composite, so even a full cache hit still paid
    # one mirror round-trip for an index the seed step was about to overwrite with the cached copy
    # anyway — the exact small fetch that died mirror-wide on 2026-08-18. Now a full hit contacts no
    # mirror at all, and the miss paths get a FRESH index instead of last night's (a ≤24h-stale
    # index against a live archive risks 404s on any package version that rotated since the warm).

    - name: Keep downloaded .debs (so there is something to cache)
      shell: bash
      run: |
        set -euo pipefail
        # apt-get already keeps /var/cache/apt/archives by default, but the runner image is free to
        # ship a DPkg::Post-Invoke cleaner (docker-clean does exactly this, and images inherit odd
        # defaults over time). Be explicit rather than depend on an unstated default: the whole
        # mechanism silently degrades to "always download" if the archives get swept.
        echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
          | sudo tee /etc/apt/apt.conf.d/99keep-downloaded-packages >/dev/null

    - name: Compute apt cache key
      id: key
      shell: bash
      run: |
        set -euo pipefail
        manifest=".github/apt-packages.txt"
        # Package versions are pinned by the runner image, not by us, so the image version belongs
        # in the key: without it a cache warmed on an older image hands back .debs (and, since -v2,
        # a package index) that describe a state apt won't just re-download — it'll REFUSE to trust,
        # or resolve incorrectly. A silent, permanent ~100% miss is safe; a silent mismatch is not.
        image="${ImageVersion:-unknown}"
        arch="$(dpkg --print-architecture)"
        manifest_hash="$(sha256sum "$manifest" | cut -c1-16)"
        # -v2: the cached entry's SHAPE changed (it now also holds a staged copy of
        # /var/lib/apt/lists under "lists/", not just *.deb files at the top level) — bump the
        # suffix so a -v1 entry from before this change is never misread as containing lists it
        # does not have.
        echo "value=apt-debs-${arch}-${image}-${manifest_hash}-v2" >>"$GITHUB_OUTPUT"
        echo "staging=${RUNNER_TEMP}/apt-deb-cache" >>"$GITHUB_OUTPUT"

    # Restore-only for every caller but the warmer. This follows the single-writer discipline the
    # rest of this repo's caches already use (see linux-quiche-env's restore-only liburing/quiche
    # keys, and setup-linux-fuzz's note on its one deliberate read-write key): exactly one job
    # writes a key, so no two jobs can race to define what it means.
    #
    # It also sidesteps a mechanism that has burned this repo before — a `pull_request_target` run
    # (merged.yaml, the RELEASE path) cannot write caches at all, and a denied save reports as a
    # green step (#351). A restore-only caller has nothing to be denied.
    - name: Restore apt cache (.debs + package index)
      id: restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.key.outputs.staging }}
        key: ${{ steps.key.outputs.value }}

    - name: Seed apt's archive + package index from the cache
      id: seed
      shell: bash
      run: |
        set -euo pipefail
        staging="${{ steps.key.outputs.staging }}"
        debs_present="false"
        lists_present="false"

        if [ -d "$staging" ] && compgen -G "$staging/*.deb" >/dev/null; then
          n=$(find "$staging" -maxdepth 1 -name '*.deb' | wc -l | tr -d ' ')
          mb=$(du -sm "$staging" | cut -f1)
          echo "::notice::apt .deb cache HIT — pre-seeding ${n} packages (${mb} MB), mirror not needed for these"
          sudo cp "$staging"/*.deb /var/cache/apt/archives/
          debs_present="true"
        else
          echo "::warning::apt .deb cache MISS for '${{ inputs.purpose }}' — downloading from the mirror."
          echo "A miss is safe but slow, and is the condition in which #368 deletes a job."
          echo "Expected key: ${{ steps.key.outputs.value }}"
          echo "If this misses on every run, the nightly warmer (native-deps-freshness.yaml) is"
          echo "not writing — check that job before assuming the mirror is at fault."
        fi

        # The package-index half of the cache, added -v2 (2026-08-18: apt-safe-update's own
        # `apt-get update` was what actually died on the mirror that day — see that action). A
        # warm index here is what lets Install below skip the mirror entirely, not just skip
        # re-downloading .debs.
        #
        # The nightly warmer (save == 'true') is deliberately excluded from seeding this onto
        # itself. It is the single writer: what it stages here IS tomorrow's cache. If it kept
        # overwriting the fresh index the update step below is about to fetch with LAST NIGHT's
        # cached copy, freshness would never advance — a silent, self-perpetuating stale loop with
        # no red step to point at. The writer's `lists=true` here only records that it needs no
        # seeding; the update step's gate below still runs a fresh `apt-get update` for it.
        #
        # compgen guarded the same way as the .deb check above: a bare unmatched glob under `set -e`
        # kills a composite step with zero output (bitten before — see apt-safe-update's header and
        # the composite-`-e` trap note in this repo's CI docs).
        if [ "${{ inputs.save }}" = "true" ]; then
          echo "::notice::writer run — a fresh apt-get update follows in the next step; not seeding the cached index onto itself (see comment above)."
          lists_present="true"
        elif [ -d "$staging/lists" ] && compgen -G "$staging/lists/*" >/dev/null; then
          n=$(find "$staging/lists" -maxdepth 1 -type f | wc -l | tr -d ' ')
          echo "::notice::apt package-index cache HIT — pre-seeding ${n} index files, no 'apt-get update' needed for the install below"
          # No --delete: the destination is the LIVE system's /var/lib/apt/lists, not a scratch
          # dir, and apt maintains files there (partial/, lock) this composite never copied into
          # the cache in the first place — leave whatever's already on disk alone, only add to it.
          sudo rsync -a "$staging/lists/" /var/lib/apt/lists/
          lists_present="true"
        else
          echo "::notice::apt package-index cache MISS for '${{ inputs.purpose }}' — a fresh index will be fetched in the next step (budgeted apt-safe-update)."
        fi

        echo "debs=${debs_present}" >>"$GITHUB_OUTPUT"
        echo "lists=${lists_present}" >>"$GITHUB_OUTPUT"

    # The `apt-get update`, now owned by this action and CONDITIONAL — this is what makes a warm
    # cache mean zero mirror contact (call sites used to run apt-safe-update unconditionally before
    # this composite; none do anymore, so nothing else supplies an index). It runs when:
    #   - the writer is running (`save`): what it resolves and stages IS tomorrow's cache, so it
    #     must never ride its own previous night's index — freshness would silently freeze;
    #   - either half of the cache MISSED: something below is about to touch the mirror anyway, and
    #     resolving against a ≤24h-stale cached index risks a 404 on any package version the
    #     archive rotated since the warm — one small budgeted index fetch buys correct resolution;
    #   - full hit (everyone else): SKIPPED. The fast --no-download install below needs no mirror,
    #     and the cached .debs were staged against the very index sitting next to them in the cache.
    # apt-safe-update also still drops the runner image's broken third-party sources first and
    # carries the archive.ubuntu.com failover — see that action for both war stories.
    - name: apt-get update (only when the cache cannot fully serve)
      if: inputs.save == 'true' || steps.seed.outputs.debs != 'true' || steps.seed.outputs.lists != 'true'
      uses: ./.github/actions/apt-safe-update

    # Only the warmer runs this: it downloads the FULL manifest, not just the packages this job
    # happens to need, so that the single cached entry serves every call site. Without it the
    # warmer would cache only its own subset and every other lane would still hit the mirror for
    # the difference — which is precisely the state this repo was in (the warmer installed neither
    # libclang-dev nor the mingw pair).
    - name: Warm the full manifest (writer only)
      if: inputs.save == 'true'
      shell: bash
      run: |
        set -euo pipefail
        mapfile -t pkgs < <(grep -vE '^[[:space:]]*(#|$)' .github/apt-packages.txt)
        # An empty manifest would make this step a silent no-op and publish an empty cache that
        # every other lane would then "hit" while downloading everything anyway — the exact
        # false-green shape a warmer must not have.
        if [ "${#pkgs[@]}" -eq 0 ]; then
          echo "::error::.github/apt-packages.txt parsed to zero packages — refusing to warm an empty cache."
          exit 1
        fi
        echo "Pre-downloading the full manifest (${#pkgs[@]} packages) so PR lanes can restore it."
        sudo apt-get install -y --download-only \
          -o Acquire::Retries=3 \
          -o Acquire::http::Timeout=30 \
          -o Acquire::https::Timeout=30 \
          "${pkgs[@]}"

    - name: Warn about packages missing from the manifest
      shell: bash
      run: |
        set -euo pipefail
        # Not fatal: an unlisted package still installs, it is just uncached — and an uncached
        # package is the next candidate to stall a job, so it should be visible rather than
        # discovered the hard way.
        manifest=".github/apt-packages.txt"
        for p in ${{ inputs.packages }}; do
          if ! grep -qxF "$p" "$manifest"; then
            echo "::warning::'$p' is not in ${manifest}, so it is NOT covered by the .deb/index cache."
            echo "  Add it there if it is a real dependency — see the header of that file for why."
          fi
        done

    # The fast path: BOTH halves of the cache hit, so apt has everything it needs already on disk
    # and can be told, hard, not to reach for the mirror at all. continue-on-error is deliberate —
    # a miss here (e.g. the manifest doesn't cover a transitive dependency of one of these packages)
    # is expected to happen occasionally and must fall through to the normal budgeted path below,
    # not fail the job. `steps.fast-install.outcome` (unlike `.conclusion`) still reports the real
    # pass/fail through continue-on-error, which is what the two steps after this one key off.
    - name: Install (full cache hit — mirror untouched)
      id: fast-install
      if: steps.seed.outputs.debs == 'true' && steps.seed.outputs.lists == 'true'
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        echo "apt cache FULL HIT (.debs + index) for '${{ inputs.purpose }}' — installing with --no-download; mirror untouched."
        sudo apt-get install --no-download -y ${{ inputs.packages }}

    # Only reached if the fast path above actually ran and failed. Getting here means the cache
    # fully hit, so the conditional update step above was SKIPPED and the index on disk is the
    # (possibly-stale, nightly-warmed) cached copy — re-fetch a fresh one before the networked
    # fallback below tries to resolve anything against it.
    - name: Refresh package index before falling back (full-hit install failed)
      if: steps.fast-install.outcome == 'failure'
      uses: ./.github/actions/apt-safe-update

    - name: Install
      if: steps.fast-install.outcome != 'success'
      shell: bash
      run: |
        set -uo pipefail

        if [ "${{ steps.fast-install.outcome }}" = "failure" ]; then
          echo "::warning::--no-download install failed despite a full cache hit for '${{ inputs.purpose }}'."
          echo "Likely cause: a package (or a transitive dependency of one) that .github/apt-packages.txt"
          echo "does not list, so the nightly warmer never downloaded it. Falling back to a networked,"
          echo "budgeted install after refreshing the package index."
        fi

        # NOTE: `timeout --foreground`, not a bare `timeout`. Composite-action steps do not support
        # `timeout-minutes` (a GitHub limitation), so the budget has to come from inside the shell,
        # and --foreground keeps apt attached to the job's TTY so its progress still streams.
        set +e
        timeout --foreground "${{ inputs.timeout }}" \
          sudo apt-get install -y \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            ${{ inputs.packages }}
        rc=$?
        set -e

        # Budget blown -> fail over to the canonical archive and retry ONCE, exactly like
        # apt-safe-update's update path. A DEGRADED-but-alive Azure mirror is the case that gets
        # here: the package-index fetch is small enough to pass the update budget, and then the
        # multi-hundred-MB toolchain download crawls into this one (2026-08-19: the JDK17/JNI lane
        # died at 8m on this budget AFTER its apt-get update had succeeded). The mirrorlist rewrite
        # is what apt actually reads on this runner image (ubuntu.sources points at
        # mirror+file:/etc/apt/apt-mirrors.txt); the update step's failover may already have done
        # this, in which case the rewrite is an idempotent no-op and the retry simply resumes the
        # download — apt keeps completed .debs in /var/cache/apt/archives, so the second attempt
        # does not start from zero.
        if [ "$rc" -eq 124 ]; then
          echo "::warning::apt-get install stalled past ${{ inputs.timeout }} for '${{ inputs.purpose }}' — failing over to archive.ubuntu.com and retrying once."
          if [ -e /etc/apt/apt-mirrors.txt ]; then
            printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\n' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -e "$f" ]; then
              sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' "$f"
            fi
          done
          sudo apt-get update -o Acquire::Retries=3 || true
          set +e
          timeout --foreground "${{ inputs.timeout }}" \
            sudo apt-get install -y \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              ${{ inputs.packages }}
          rc=$?
          set -e
        fi

        if [ "$rc" -eq 124 ]; then
          echo "::error::apt-get install exceeded its ${{ inputs.timeout }} budget for '${{ inputs.purpose }}' on BOTH the Azure mirror and archive.ubuntu.com."
          echo ""
          echo "This is almost certainly a wide Ubuntu-mirror event, NOT a problem with this PR — see #368."
          echo "Both recorded sightings collapsed from ~19 MB/s to ~40 KB/s part-way through the"
          echo "same install, on unrelated PRs, in the same 25-minute window."
          echo ""
          echo "This step now fails HERE, loudly, instead of silently consuming the job's whole"
          echo "timeout-minutes and reporting as 'cancelled' with the real work never started."
          echo "Re-running the job is the workaround; a warm .deb cache is the fix."
          exit 1
        fi
        exit "$rc"

    - name: Stage apt package index for the cache (writer only)
      if: inputs.save == 'true'
      shell: bash
      run: |
        set -euo pipefail
        staging="${{ steps.key.outputs.staging }}/lists"
        mkdir -p "$staging"
        # Exclude partial/ (apt's own in-progress-download scratch dir, never valid to reuse) and
        # lock (a live file descriptor of THIS run's apt processes, not a sentinel of anything —
        # copying it stages a dead lock file, not a useful one).
        sudo rsync -a --delete \
          --exclude 'partial/' \
          --exclude 'lock' \
          /var/lib/apt/lists/ "$staging"/
        sudo chown -R "$(id -u):$(id -g)" "$staging"
        n=$(find "$staging" -maxdepth 1 -type f | wc -l | tr -d ' ')
        echo "::notice::warmer staged ${n} apt package-index files for the cache"
        if [ "$n" -eq 0 ]; then
          echo "::warning::nothing staged for the package index — the warmer will publish an entry with no lists/."
        fi

    - name: Collect .debs for the cache (writer only)
      if: inputs.save == 'true'
      shell: bash
      run: |
        set -euo pipefail
        staging="${{ steps.key.outputs.staging }}"
        mkdir -p "$staging"
        # `|| true` on the copy alone: an empty archive dir is a legitimate state (everything was
        # already installed on the image), and should not fail the warmer.
        sudo cp /var/cache/apt/archives/*.deb "$staging"/ 2>/dev/null || true
        sudo chown -R "$(id -u):$(id -g)" "$staging"
        n=$(find "$staging" -maxdepth 1 -name '*.deb' | wc -l | tr -d ' ')
        echo "::notice::warmer collected ${n} .deb files for the cache"
        if [ "$n" -eq 0 ]; then
          echo "::warning::nothing to cache — the warmer will publish an empty entry."
          echo "That is the false-green shape to watch for: a HIT that seeds zero packages."
        fi

    - name: Save apt cache (.debs + package index) (writer only)
      if: inputs.save == 'true' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.key.outputs.staging }}
        key: ${{ steps.key.outputs.value }}
