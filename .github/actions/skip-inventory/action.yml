name: "Skip inventory"
description: >-
  Inventory the tests that did not run on this lane, from the [TEST-SKIPPED] markers the shared
  SkipReason path writes into the test XML, and publish them to the job summary.

# Why this exists: a skipped test is invisible in a green run, and on Kotlin/Native it is worse than
# invisible — there is no `assume` on K/N, so the only skip available is an early return, which the
# report records as a PASS. Three Apple simulator lanes were reporting 36 tests green while
# executing none of them. The Kotlin side now always emits a marker; this step is what makes anyone
# see it.
#
# Never fails the job. The gate that DOES fail is SOCKET_REQUIRE_ALL_TESTS=1, set per-lane once this
# inventory shows the lane is clean — read the summary before setting it.

runs:
  using: "composite"
  steps:
    - name: Inventory skipped tests
      shell: bash
      if: ${{ !cancelled() }}
      run: |
        # `+e`, explicitly, and not just as a default: a composite `shell: bash` step is run as
        # `bash --noprofile --norc -e -o pipefail {0}`, so errexit is ON before the first line of
        # this script and `set -uo pipefail` does not clear it. Under it, `grep` finding nothing —
        # its documented exit 1 — killed the whole step, and because the abort happened inside a
        # `VAR=$(...)` assignment it printed NOTHING: a lane whose tests had all passed failed with
        # a bare "Process completed with exit code 1". That is the reverse of this action's stated
        # contract two comments up, and it took out the three simulator lanes it exists to measure.
        # Every `grep` here is a question whose answer may legitimately be "none".
        set +e
        set -uo pipefail

        # `find | xargs grep`, not `grep -r --include` over a list of directories: that form
        # silently returns nothing on BSD grep (the macOS lanes) once it is given many directory
        # operands, while working fine for one — a false "no skips" on exactly the lanes with the
        # most skips. Verified on both greps before landing.
        #
        # Capture site+reason ONLY. Anchoring on the two `key=value` fields keeps the match bounded:
        # `detail=` is free text and, when SOCKET_REQUIRE_ALL_TESTS is set, is followed by a
        # multi-sentence failure message that a greedier pattern swallows whole.
        # `-r` (--no-run-if-empty): with no XML at all, GNU xargs still runs grep once, with no file
        # operands, so it reads stdin. That is harmless in Actions (stdin is /dev/null) and a hang
        # anywhere stdin is a live pipe. BSD xargs already declines to run; -r makes both agree.
        #
        # Two roots AND two file shapes, because Android is not like the others:
        #   * AGP writes instrumented results to build/outputs/androidTest-results/, not
        #     build/test-results/, so the original glob inventoried every lane EXCEPT the Android
        #     one — the last place a silent skip could still hide, which is what this action's own
        #     preamble is about;
        #   * an instrumented test's stdout goes to LOGCAT, and AGP's JUnit XML records a skip as a
        #     bare `<skipped />` with no message. So on Android the marker is in the per-test
        #     `logcat-<class>-<method>.txt` beside the XML, and only there — verified by reading
        #     both after a deliberately-unreachable run.
        # Parenthesised so each root gets the right `-name` set (BSD and GNU find both accept it).
        # ⚠️ The whole alternation is parenthesised, and that is the entire point. `-print0` is an
        # expression like any other and binds by the same implicit-AND rule, so
        #
        #     find . \( A \) -o \( B \) -print0
        #
        # parses as `A -o ( B -a -print0 )`: files matching A are matched, found to satisfy the `-o`,
        # and **never printed**. Only the second branch reaches stdout.
        #
        # That is what this file did, and B is the Android branch — so from the moment the Android
        # root was added, every non-Android lane inventoried an empty set and reported
        # "No [TEST-SKIPPED] markers found" no matter how many tests skipped. Measured in a workspace
        # holding real iOS + watchOS + JVM results: the first branch alone prints 1979 files, this
        # expression printed 3, parenthesised it prints 1982 — and the markers those 1979 files hold
        # come to 69 skipped invocations, among them the 32 `transport-unavailable` and 10
        # `simulator-lacks-network-services` the three simulator lanes were reporting as none.
        #
        # An inventory whose failure mode is "✅ nothing to report" is worse than no inventory: this
        # one is read to decide where `SOCKET_REQUIRE_ALL_TESTS=1` may be turned on.
        RESULT_FILES=$(find . \
            \( \( -path '*/build/test-results/*' -name '*.xml' \) \
               -o \( -path '*/build/outputs/androidTest-results/*' \( -name '*.xml' -o -name 'logcat-*.txt' \) \) \) \
            -print0 2>/dev/null | tr -dc '\0' | wc -c | tr -d ' ')
        RESULT_FILES=${RESULT_FILES:-0}

        MARKERS=$(find . \
            \( \( -path '*/build/test-results/*' -name '*.xml' \) \
               -o \( -path '*/build/outputs/androidTest-results/*' \( -name '*.xml' -o -name 'logcat-*.txt' \) \) \) \
            -print0 2>/dev/null \
          | xargs -0 -r grep -hoE '\[TEST-SKIPPED\] site=[^ ]+ reason=[^ ]+' 2>/dev/null | sort || true)

        # The runner's OWN skip count, independently of our markers: a JUnit `assumeTrue`, an
        # `@Ignore`, or a filtered method writes `<skipped/>` into the XML without ever reaching
        # SkipReason. Those are invisible to the marker grep AND to SOCKET_REQUIRE_ALL_TESTS, so a
        # lane can read "0 skips" while genuinely skipping — the exact reading this inventory exists
        # to prevent. Counting both keeps the difference between them on the page.
        RUNNER_SKIPS=$(find . \( -path '*/build/test-results/*' -o -path '*/build/outputs/androidTest-results/*' \) \
          -name '*.xml' -print0 2>/dev/null \
          | xargs -0 -r grep -hoE '<skipped' 2>/dev/null | wc -l | tr -d ' ')
        RUNNER_SKIPS=${RUNNER_SKIPS:-0}

        untypedNote() {
          if [ "$RUNNER_SKIPS" -gt 0 ]; then
            echo
            echo "ℹ️ The test runner also recorded **$RUNNER_SKIPS** \`<skipped/>\` result(s)."
            echo "Those come from \`assumeTrue\` / \`@Ignore\` rather than \`SkipReason\`, so they are NOT"
            echo "covered by \`SOCKET_REQUIRE_ALL_TESTS\`. Route them through \`recordSkip\` to gate them."
          fi
        }

        # "No skips" and "nothing to read" are different facts, and reporting the second as the first
        # is how the bug above stayed invisible for as long as it did. Say which one this is.
        if [ "$RESULT_FILES" -eq 0 ]; then
          echo "::warning title=Skip inventory read nothing::No test-result files were found under build/test-results/ or build/outputs/androidTest-results/, so this inventory validated nothing. A lane that runs tests should produce them; if this lane does not run any, it does not need this step."
          {
            echo "### Skip inventory"
            echo
            echo "⚠️ **No test-result files found.** This inventory read nothing, so it is not evidence"
            echo "that nothing skipped — do not set \`SOCKET_REQUIRE_ALL_TESTS=1\` on the strength of it."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        if [ -z "$MARKERS" ]; then
          echo "No [TEST-SKIPPED] markers found in $RESULT_FILES result file(s); runner-reported skips: $RUNNER_SKIPS"
          {
            echo "### Skip inventory"
            echo
            echo "✅ No typed (\`SkipReason\`) skips on this lane, across **$RESULT_FILES** result file(s)."
            untypedNote
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        TOTAL=$(printf '%s\n' "$MARKERS" | wc -l | tr -d ' ')
        echo "$TOTAL skipped test invocations:"
        printf '%s\n' "$MARKERS"

        # awk, not sed: the grouping key is a tab-separated pair, and BSD sed (the macOS lanes)
        # does not understand `\t` in either the pattern or the replacement.
        {
          echo "### Skip inventory"
          echo
          echo "⚠️ **$TOTAL** test invocations did not run on this lane."
          echo
          echo "| count | reason | site |"
          echo "|---|---|---|"
          printf '%s\n' "$MARKERS" | awk '
            {
              site = $2; sub(/^site=/, "", site)
              reason = $3; sub(/^reason=/, "", reason)
              count[reason "\t" site]++
            }
            END {
              for (k in count) {
                split(k, parts, "\t")
                printf "| %d | `%s` | `%s` |\n", count[k], parts[1], parts[2]
              }
            }' | sort -t'|' -k2 -rn
          untypedNote
          echo
          echo "Set \`SOCKET_REQUIRE_ALL_TESTS=1\` on this lane to turn these into failures — except"
          echo "rows recorded with \`SkipGate.HostCannotProvideIt\`, which name a capability the host"
          echo "does not have and stay exempt on purpose (a lane cannot install one, so gating on it"
          echo "would only make the lane permanently red)."
          echo "(On an Apple **simulator** lane that variable only arrives via the build's"
          echo "\`SIMCTL_CHILD_\` forwarding — \`simctl spawn\` drops the ambient environment.)"
        } >> "$GITHUB_STEP_SUMMARY"

        # The step's status is the last command's, and the last command here is a redirect into a
        # file the runner owns. Say the contract instead of inheriting it.
        exit 0
