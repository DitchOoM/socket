name: "Compute Version"

# The RELEASE version, computed once per run for merged.yaml: Maven Central's latest
# com.ditchoom:socket, bumped per the merged PR's label (`nextVersion`, gradle/setup.gradle.kts).
# Every job in the run is handed this one string, so a release reaching Central mid-run cannot split
# the run across two versions. Builds that do not release take a commit-derived version from
# compute-ci-version.yaml and never read Central.

on:
  workflow_call:
    inputs:
      gradle-args:
        description: "Extra Gradle arguments (e.g., -PincrementMinor=true) — selects the bump."
        required: false
        default: ""
        type: string
    outputs:
      version:
        description: "The next version, computed once for the whole run"
        value: ${{ jobs.version.outputs.version }}

jobs:
  version:
    name: "Compute version"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # Only a JDK is needed. Deliberately none of the heavy setup the build jobs do (Konan,
      # Android SDK, Rust, cross toolchains, native caches): `nextVersion` is satisfied by
      # configuring the build, and every one of those would add setup time to a job that now
      # sits on the critical path of every run.
      #
      # No `cache: gradle`: setup-java's gradle cache is read-WRITE and stores the WHOLE
      # ~/.gradle/caches tree (setup-java/src/cache.ts pins the gradle package manager to that one
      # path), which cost this configure-only job a 264MB write + a 133MB wrapper write per ref —
      # against a repo sitting at the 10GB Actions cache cap, where the eviction that buys is what
      # makes "cached" quiche natives still cost 204s in build-linux. A configure is not worth a
      # cache ENTRY.
      #
      # It is emphatically worth a cache READ, though. This job sits at the top of the graph and
      # every other job `needs:` it, so its wall time is on the critical path of every run. With no
      # restore at all, a configure-only run still cold-downloads the ~150MB Gradle distribution and
      # re-resolves every plugin for a 12-module KMP build. (The ~90s this job used to be measured at
      # was measured WITH setup-java's cache warm — it is not the no-cache number.)
      #
      # So: restore, never save. Byte-identical keys to build-linux.yaml's, which is the single
      # writer for both families and runs in main's ref scope; this job is `runs-on: ubuntu-latest`,
      # so the Linux keys are the right ones. Zero new bytes in the cache.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Restore Gradle build outputs (read-only)
        uses: actions/cache/restore@v6
        with:
          path: ~/.gradle/caches
          key: gradle-linux-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-linux-

      - name: Restore Gradle wrapper distribution (read-only)
        uses: actions/cache/restore@v6
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-linux-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      # `-q` leaves exactly one line on stdout, the version `nextVersion` prints, and the assert
      # fails HERE on anything else: every downstream job bakes this string into artifact paths.
      # A failure that is Central (or a plugin repository) not answering — 403/429/5xx, a dropped
      # connection — is retried with backoff; any other failure is reported on the first attempt.
      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          transient='Server returned HTTP response code: (403|429|5[0-9][0-9]) for URL: https://repo1\.maven\.org/'
          transient+='|java\.net\.(ConnectException|NoRouteToHostException|SocketException|SocketTimeoutException|UnknownHostException)'
          transient+='|Could not (GET|get resource).*(429|502|503|504|Too Many Requests|Read timed out|Connection reset|Connection timed out)'
          err="$(mktemp)"
          attempts=5
          for attempt in $(seq 1 "$attempts"); do
            if version="$(./gradlew -q --stacktrace nextVersion ${{ inputs.gradle-args }} 2>"$err")"; then
              break
            fi
            cat "$err"
            if [ "$attempt" -eq "$attempts" ] || ! grep -qE "$transient" "$err"; then
              echo "::error::nextVersion failed (attempt ${attempt}/${attempts}); Gradle's reason is above."
              exit 1
            fi
            delay=$((10 << (attempt - 1)))
            echo "::warning::nextVersion could not reach a repository (attempt ${attempt}/${attempts}); retrying in ${delay}s."
            sleep "$delay"
          done
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::nextVersion did not produce a bare semver. Got: '${version}'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version for this run: ${version}"
          echo "### Version for this run: \`${version}\`" >> "$GITHUB_STEP_SUMMARY"
