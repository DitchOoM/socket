name: "Compute Version"

# One authoritative version query per RUN.
#
# `getNextVersion` (gradle/setup.gradle.kts) derives the version from a LIVE fetch of Maven
# Central's maven-metadata.xml, performed once per Gradle invocation. The version a build uses
# is therefore not a property of the commit — it is a property of what Central happened to be
# serving at that instant.
#
# #328 pinned it per JOB (each of build-linux / build-apple exports ORG_GRADLE_PROJECT_version
# from its own `Get version` step). That closed the within-a-job split, but not the across-jobs
# one: on run 31427748610 build-apple and build-linux started together, yet build-apple ran 43
# minutes. A release landing anywhere in that window pins the two jobs to different versions and
# reproduces #329's failure #2 exactly — build-linux publishes 4.2.1, build-apple publishes
# 4.3.1, and `validate` merges the two maven-local repos into a 4.2.1 root module carrying no
# Apple variants, surfacing as an unresolvable :iosArm64CInterop that reads like a KMP metadata
# bug. review.yaml already anticipated the race and hardened `validate` to resolve the version
# from the built artifacts, but it resolves from the LINUX side only, so an Apple/Linux split
# passes straight through that guard.
#
# This job hoists the query to the top of the graph so there is exactly one answer per run and
# every job downstream is handed the same string. That is also what makes the test-shard fan-out
# safe: without it, each new shard re-introduces a Central fetch that can disagree with its peers.
#
# NOT hermetic, and deliberately out of scope here: the same commit built before and after a
# release still yields different numbers. True hermeticity means sourcing the version from a git
# tag or gradle.properties and having the release flow bump it — a larger change to the
# label-driven release machinery (see #329 "Out of scope").

on:
  workflow_call:
    inputs:
      gradle-args:
        description: "Extra Gradle arguments (e.g., -PincrementMinor=true) — selects the bump."
        required: false
        default: ""
        type: string
    outputs:
      version:
        description: "The next version, computed once for the whole run"
        value: ${{ jobs.version.outputs.version }}

jobs:
  version:
    name: "Compute version"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # Only a JDK is needed. Deliberately none of the heavy setup the build jobs do (Konan,
      # Android SDK, Rust, cross toolchains, native caches): `nextVersion` is satisfied by
      # configuring the build, and every one of those would add setup time to a job that now
      # sits on the critical path of every run.
      #
      # No `cache: gradle`: setup-java's gradle cache is read-WRITE and stores the WHOLE
      # ~/.gradle/caches tree (setup-java/src/cache.ts pins the gradle package manager to that one
      # path), which cost this configure-only job a 264MB write + a 133MB wrapper write per ref —
      # against a repo sitting at the 10GB Actions cache cap, where the eviction that buys is what
      # makes "cached" quiche natives still cost 204s in build-linux. A configure is not worth a
      # cache ENTRY.
      #
      # It is emphatically worth a cache READ, though. This job sits at the top of the graph and
      # every other job `needs:` it, so its wall time is on the critical path of every run. With no
      # restore at all, a configure-only run still cold-downloads the ~150MB Gradle distribution and
      # re-resolves every plugin for a 12-module KMP build. (The ~90s this job used to be measured at
      # was measured WITH setup-java's cache warm — it is not the no-cache number.)
      #
      # So: restore, never save. Byte-identical keys to build-linux.yaml's, which is the single
      # writer for both families and runs in main's ref scope; this job is `runs-on: ubuntu-latest`,
      # so the Linux keys are the right ones. Zero new bytes in the cache.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Restore Gradle build outputs (read-only)
        uses: actions/cache/restore@v6
        with:
          path: ~/.gradle/caches
          key: gradle-linux-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-linux-

      - name: Restore Gradle wrapper distribution (read-only)
        uses: actions/cache/restore@v6
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-linux-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      # `nextVersion` prints from its configuration block, so `-q` yields exactly one line: the
      # version (build.gradle.kts's own "Version: ..." banner is suppressed at QUIET).
      #
      # The regex assert is the point of doing this in one place. Every downstream job now takes
      # this string on faith and bakes it into artifact paths, so a malformed value (a Gradle
      # warning leaking onto stdout, an empty string from a failed Central fetch) must fail HERE,
      # loudly, in 90 seconds — not 40 minutes later as a confusing "no -jvm-<V>.jar found" or an
      # unresolvable dependency in `validate`, which is exactly how this class of bug has
      # presented every time so far.
      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          version="$(./gradlew -q nextVersion ${{ inputs.gradle-args }})"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::nextVersion did not produce a bare semver. Got: '${version}'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version for this run: ${version}"
          echo "### Version for this run: \`${version}\`" >> "$GITHUB_STEP_SUMMARY"
