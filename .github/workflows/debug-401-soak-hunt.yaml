# DEBUG-ONLY — lives on branch debug/401-soak-hunt, never merged to main.
#
# Hunts issue #401's corrupt echo in its native habitat: the same ubuntu-x64 runner + JDK17/JNI
# setup as build-linux.yaml's failing lane, looped, with glibc's MALLOC_PERTURB_ poisoning freed
# memory (memset to 0xD5 on free, ~0xD5=0x2A on malloc). When the corruption fires, the payload
# bytes name the mechanism:
#   d5 d5 d5 ...      -> something READ memory after a real free() in our layer
#   2a 2a 2a ...      -> read-before-fill (delivered without quiche ever writing)
#   hi-stream-NN      -> pool-recycle race (another acquirer's live data)
#   heap pointers     -> freed-then-relinked chunk (glibc bin metadata over the poison)
# Three shards loop just the soak class (fast, many samples); three loop the full jvmTest task
# (matches the CI load profile the 1-in-14 sightings actually had).
name: 401 Soak Hunt

# push-triggered (scoped to this branch) because workflow_dispatch requires the file on the
# default branch; every push to debug/401-soak-hunt fires a hunt round.
on:
  push:
    branches: [debug/401-soak-hunt]

env:
  # Matches build-linux.yaml — the failing run's capture printed scale=3.0, so keep every
  # .scaled budget identical to the environment the flake lives in.
  QUIC_TEST_TIME_SCALE: "3"

jobs:
  # linux-quiche-env downloads `quiche-linux-natives-full` from the CURRENT run (in build-linux.yaml
  # the sibling `natives` job produces it). This standalone workflow has no natives job, so stage the
  # artifact from a known-good main run (32303408955, the #411 merged run — its libquiche_jni.so
  # matches current main's quiche_jni.c) into this run under the same name.
  stage-natives:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download natives cross-run
        uses: actions/download-artifact@v8
        with:
          name: quiche-linux-natives-full
          path: natives
          run-id: 32303408955
          github-token: ${{ github.token }}
          repository: DitchOoM/socket
      - name: Re-upload into this run
        uses: actions/upload-artifact@v7
        with:
          name: quiche-linux-natives-full
          path: natives
          # The cargo-skip markers are DOTFILES; without this the upload silently drops them and
          # every shard re-runs a 10-20 minute cargo build (the #337 trap).
          include-hidden-files: true

  hunt:
    name: hunt (${{ matrix.mode }} shard ${{ matrix.shard }})
    needs: stage-natives
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Round 15: SUITE BISECTION. The victim is deterministic (StaleConnectionDiagnosticTests);
        # some other test creates the corrupting conditions. Each shard runs a candidate trigger set
        # + the victim, many fast iterations; the corrupting shard names the trigger.
        include:
          - { shard: 1, mode: subset, filter: "--tests *Sim* --tests *Fuzz* --tests *StaleConnection*" }
          - { shard: 2, mode: subset, filter: "--tests *CallerClock* --tests *StaleConnection*" }
          - { shard: 3, mode: subset, filter: "--tests *Migration* --tests *StaleConnection*" }
          - { shard: 4, mode: subset, filter: "--tests *Soak* --tests *Concurrency* --tests *StaleConnection*" }
          - { shard: 5, mode: subset, filter: "--tests *StaleConnection*" }
          - { shard: 6, mode: full, filter: "" }
    env:
      MALLOC_PERTURB_: ""
      # Round 13: glibc's own double-/invalid-free detector. If ANY pointer in the process is freed
      # twice (the leading remaining mechanism: a re-freed shim pointer whose chunk glibc had
      # already handed to a quiche Vec frees quiche's LIVE memory), glibc aborts at the offending
      # free and the JVM writes an hs_err naming the thread and native stack.
      MALLOC_CHECK_: "3"
      # linux-quiche-env enforces the #329 per-job version pin. A fixed dummy is exactly right
      # here: nothing publishes, and it keeps the hunt hermetic (no live Central metadata fetch).
      ORG_GRADLE_PROJECT_version: "0.0.0-hunt"
    steps:
      - uses: actions/checkout@v7

      # Same composite the real lane uses: apt toolchain (cached), natives artifact or rebuild,
      # JDK 21 + 17. konan:false — JVM-only, exactly like the quiche-jvm job.
      - uses: ./.github/actions/linux-quiche-env
        with:
          konan: "false"
          jdk17: "true"

      - name: Generate harness TLS certs
        run: bash test-harness/tls/gen-certs.sh

      - name: Trust harness CA (Linux)
        run: |
          sudo cp test-harness/tls/certs/ca.crt /usr/local/share/ca-certificates/harness-root.crt
          sudo update-ca-certificates

      - name: Trust harness CA in JVM keystore (Linux)
        run: |
          sudo keytool -delete -alias harness-root \
              -keystore "$JAVA_HOME/lib/security/cacerts" \
              -storepass changeit 2>/dev/null || true
          sudo keytool -importcert -trustcacerts \
              -file test-harness/tls/certs/ca.crt \
              -alias harness-root \
              -keystore "$JAVA_HOME/lib/security/cacerts" \
              -storepass changeit -noprompt

      - name: Hunt loop
        timeout-minutes: 110
        run: |
          set -uo pipefail
          mkdir -p hunt-results
          base=25
          if [ "${{ matrix.mode }}" = "subset" ]; then
            n=40
          else
            n=$(( base / 2 ))
          fi
          echo "mode=${{ matrix.mode }} iterations=$n MALLOC_PERTURB_=$MALLOC_PERTURB_"
          for i in $(seq 1 "$n"); do
            echo "=== hunt iteration $i/$n ($(date -u +%H:%M:%S)) ==="
            set +e
            if [ "${{ matrix.mode }}" = "subset" ]; then
              ./gradlew :socket-quic-quiche:jvmTest ${{ matrix.filter }} \
                --rerun --continue --no-configuration-cache \
                -PjvmTestLauncher=17 -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64
            else
              ./gradlew :socket-quic-quiche:jvmTest \
                --rerun --continue --no-configuration-cache \
                -PjvmTestLauncher=17 -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64
            fi
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              # A glibc abort kills the test JVM: no XML, but hs_err files name the freeing stack.
              find . -name "hs_err_pid*.log" -newer gradlew -exec cp {} hunt-results/ \; 2>/dev/null || true
              if compgen -G "hunt-results/hs_err_pid*.log" >/dev/null; then
                echo "::error::JVM native crash captured at iteration $i (glibc abort?) — hs_err uploaded"
                grep -m1 -A4 "Problematic frame\|SIGABRT\|double free\|invalid pointer" hunt-results/hs_err_pid*.log | head -20 || true
                exit 1
              fi
              if grep -rlE "<failure|<error" socket-quic-quiche/build/test-results/jvmTest >/dev/null 2>&1; then
                echo "::error::CAPTURED test failure at iteration $i (mode=${{ matrix.mode }})"
                cp -r socket-quic-quiche/build/test-results/jvmTest "hunt-results/fail-iter-$i"
                grep -rh -A8 "<failure" "hunt-results/fail-iter-$i" | head -40
                exit 1
              fi
              echo "::warning::non-test failure at iteration $i (rc=$rc) — continuing"
            fi
          done
          echo "all $n iterations green — no corruption captured on this shard"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hunt-results-${{ matrix.mode }}-${{ matrix.shard }}
          path: hunt-results/
          if-no-files-found: ignore
