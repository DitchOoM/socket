name: "Android Emulator Integration Test"
on:
  pull_request:
    # See review.yaml: '*' does not match '/', so '*.md' let every docs/**.md change boot an
    # emulator for nothing. '**.md' matches markdown at any depth.
    paths-ignore:
      - '**.md'
    types:
      - synchronize
      - opened

# Same value as build-apple.yaml:60 and build-linux.yaml, so no lane scales its deadlines
# differently from another. `timeScaleEnv()`'s Android actual is the commonJvmMain one
# (System.getenv), and TestHelpers.testTimeScale clamps the result to 1..10, so a slow/loaded
# emulator gets 3x the wall-clock on every `.scaled` budget without any assertion, ordering or
# timing ratio changing — the shape of flake #291 on the API-35 lane.
#
# ⚠️ Scope, stated honestly: this env reaches the HOST side of this job (the Gradle daemon and the
# :socket-quic-quiche:startNetworkControlServer JVM that scripts/android-emulator-tests.sh
# launches). It does NOT reach the instrumented test process on the emulator — an app process is
# forked from zygote and inherits the device's environment, not the runner's. Propagating a scale
# to `connectedAndroidTest` needs an instrumentation argument plumbed through to timeScaleEnv(),
# which is Kotlin-side work outside this file; tracked with #291.
env:
  QUIC_TEST_TIME_SCALE: "3"

jobs:
  android-emulator:
    runs-on: ubuntu-latest
    # 25, not 15: a passing run already takes ~14m58s (emulator boot + KVM-accelerated
    # instrumented tests), so a 15-min cap tips a healthy run into a "cancelled" timeout on
    # any normal runner-speed jitter. 25 leaves comfortable headroom while still bounding a
    # genuine hang (e.g. an emulator that never boots).
    timeout-minutes: 25
    # ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL is deliberately NOT set job-wide — see the `run tests`
    # step, which is the only step where force-killing the emulator is safe. Setting it here also
    # applied it to the create-AVD step, whose entire purpose is to let the emulator WRITE a
    # snapshot on shutdown, and a 1-second grace is not enough to flush one.
    strategy:
      # 29 and 35 are independent signals — an API-35-only regression must not cancel the 29 lane
      # (or vice versa) before it reports, or the matrix tells us less than the single lane did.
      fail-fast: false
      matrix:
        # 29 = the floor this suite has always run on. 35 = the reactive-monitor ceiling: every
        # ConnectivityManager tightening that would break AndroidNetworkMonitor landed after 29 —
        # the API-31 NetworkCapabilities/callback changes and API-34's stricter background-callback
        # accounting among them — so a lane that stops at 29 cannot observe them. Both use the
        # `default` (AOSP userdebug) image, which is what makes `adb root` + `su 0 iptables/tc`
        # work for the QUIC netem suite; `google_apis*` images would break that.
        api-level: [29, 35]
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The aggregate `connectedAndroidTest` task graph reaches the root
      # `:buildBoringsslArm64` task (the linuxArm64 Kotlin/Native BoringSSL build),
      # whose CMake toolchain needs the GNU aarch64 cross-compiler. Without it the
      # job failed at `:buildBoringsslArm64` with
      # `CMAKE_CXX_COMPILER aarch64-linux-gnu-g++ ... not found`. Install it (the fix
      # the root build.gradle.kts comment already prescribes). NOTE: building the
      # linuxArm64 lib in an x86_64 emulator job is wasteful — de-scoping that task
      # from the Android test graph is a follow-up.
      # apt-safe-update first — see .github/actions/apt-safe-update. It also supplies the
      # `apt-get update` the install below needs; do not drop it without adding one back.
      - uses: ./.github/actions/apt-safe-update

      # libclang: quiche 0.29 dropped `boringssl-vendored`; the Android build now uses
      # `boringssl-boring-crate`, whose boring-sys build runs bindgen and needs libclang
      # on the host (the NDK clang covers the target compile).
      - name: Install aarch64 GNU cross-compiler (for :buildBoringsslArm64) + libclang
        uses: ./.github/actions/apt-install-cached
        with:
          purpose: "android emulator lane: arm64 cross toolchain"
          packages: >-
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross libclang-dev

      - name: Install Rust + cargo-ndk
        uses: dtolnay/rust-toolchain@stable
      # All four Android Rust targets are needed because socket-quic-quiche's
      # build.gradle.kts enumerates arm64-v8a / armeabi-v7a / x86_64 / x86
      # ABIs (see `androidAbis` list); cargo-ndk fails if any target is
      # missing. The previous list omitted armv7-linux-androideabi and
      # i686-linux-android, causing :socket-quic-quiche:buildAndroidJniArmeabiv7a
      # to fail in this job.
      - run: |
          rustup target add x86_64-linux-android aarch64-linux-android \
              armv7-linux-androideabi i686-linux-android
          cargo install cargo-ndk

      # Build the x86_64 (emulator ABI) native libs via Gradle instead of a hand-rolled cargo-ndk +
      # clang duplicate, so this can't drift from build.gradle.kts. buildAndroidJniX86_64 emits the
      # dedup'd pair into src/androidMain/jniLibs/x86_64/: a thin libquiche_jni.so (DT_NEEDED=libquiche.so)
      # beside a self-contained libquiche.so (unversioned soname), exactly what the emulator loads
      # (libquiche.so first, then the shim). NDK/cargo-ndk/targets/libclang are set up in the steps above.
      - name: Build Android QUIC native libs (x86_64, via Gradle)
        run: ./gradlew :socket-quic-quiche:buildAndroidJniX86_64 --no-configuration-cache

      # Bring up the docker quic-echo harness (same image / port as
      # build-linux + build-apple) before the emulator starts.
      #
      # ⚠️ `10.0.2.2:<port>` is a fact about an EMULATOR, not about Android.
      # It is the AVD's built-in alias for the host's loopback; a physical
      # device has no such alias, and `adb reverse` cannot stand in because
      # it forwards TCP only while QUIC is UDP. This lane is emulator-only,
      # so the pairing holds here: the compose file publishes a fixed port
      # on the host's loopback and the alias makes that loopback
      # addressable. The device side takes it as an explicit, named
      # fallback (`EndpointOrigin.DockerContract` in HarnessEndpoints.kt),
      # not as a hardcoded host — on real hardware the address is computed
      # on the host, probed, and carried down as an instrumentation
      # argument by `:socket-quic-quiche:androidQuicIntegrationTest`.
      #
      # Previous setup ran no server at all and used `adb reverse
      # tcp:4433 tcp:4433` — wrong on two counts: adb reverse only
      # supports TCP (QUIC is UDP) and no QuicEchoTestServer ever
      # started on the host. The result was a quiet skip of every
      # instrumented QUIC test via the `assumeTrue(...)` in
      # AndroidQuicConnectivityTests.checkServerReachable's catch
      # block. This was the Android side of the same silent-skip
      # failure mode being fixed across the comprehensive QUIC CI plan
      # (macOS = PR #51, Linux ARM64 = PR #52). Both catch-alls are now
      # gone: the causes they conflated are separate `SkipReason`s with
      # separate `SkipGate`s, counted by the skip inventory, and the gate
      # itself finally reaches the device — see the note on
      # SOCKET_REQUIRE_ALL_TESTS in scripts/android-emulator-tests.sh.
      - name: Generate harness TLS certs
        run: bash test-harness/tls/gen-certs.sh

      # Build the quic-echo fat jar so docker compose's `build: ./quic-echo`
      # has the COPY input it needs. Default (host-arch-only) is enough —
      # the docker image base + jar are both linux-x64 for this job, which
      # matches the ubuntu-latest runner. The container then exposes
      # 14433/udp on the host's loopback — the port half of the docker
      # contract above, which this emulator (and only an emulator) can
      # address through its 10.0.2.2 alias.
      - name: Build quic-echo fat jar (Linux x64)
        run: ./gradlew :socket-quic-quiche:quicEchoJar --no-configuration-cache

      - name: Bring up quic-echo via the docker harness
        run: bash test-harness/compose-up-retry.sh quic-echo

      # ⚠️ THERE IS DELIBERATELY NO AVD CACHE HERE — do not "restore" one without re-reading this.
      #
      # This is NOT a revert of #333 (72e24e21). #333's substantive fix was moving
      # ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL out of the job-level env and onto the `run tests`
      # step alone, so the create-AVD step below keeps its full shutdown grace period and can flush
      # a complete snapshot. That fix is untouched (see the job-level note and the `run tests` env).
      # What is removed is the cached artifact itself, which makes the poisoning failure mode
      # structurally impossible rather than merely fixed:
      #   run 1 misses, creates the AVD, passes, saves a snapshot; run 2 restores it and the
      #   emulator exits before registering with adb —
      #     FATAL | A snapshot operation for 'test' is pending and timeout has expired. Exiting...
      #   surfacing only as the boot poller's misleading "Timeout waiting for emulator to boot".
      #
      # The economics, measured rather than assumed (2026-08-12):
      #   create+save on a miss = 71s (api-29) / 83s (api-35); restore on a hit = 19-36s / 10-16s.
      #   Net saving ~35-52s and ~67-73s, for 1776 MiB of a 10 GiB repo-wide cap — about
      #   0.07 s/MiB, versus 1-4 s/MiB for the quiche/Konan/Gradle entries it was evicting. And
      #   `on:` here is `pull_request` only, so the key is written per PR REF and never shared:
      #   7 distinct refs in 24h = ~12 GiB of AVD writes against a 10 GiB cap.
      #   This job (13-16 min) is nowhere near review.yaml's 48-55 min critical path, so the
      #   ~100s costs zero wall-clock on the run as a whole.
      - name: create AVD and generate boot snapshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          force-avd-creation: false
          # The default API-29 userdata partition wants ~7.37 GB, which does not
          # fit in the ~6.7 GB this job leaves free after the Rust/quiche/docker
          # native-build steps — the emulator FATAL'd at launch with "Not enough
          # space to create userdata partition" (device never registered → the
          # boot poller then timed out with a misleading "emulator to boot"
          # error). Cap it: this instrumented suite installs a couple of modest
          # APKs, so 4 GB is ample and drops `need` well under available. Must
          # match the run-tests step below (that step reuses the AVD this one
          # creates, in the same job).
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated the AVD + boot snapshot this job's test step will reuse."

      - name: run tests
        uses: reactivecircus/android-emulator-runner@v2
        # Safe to force-kill HERE and nowhere else: this step runs with `-no-snapshot-save`, so the
        # emulator has nothing to flush on shutdown and waiting 20s for a graceful exit is pure
        # dead time. The create-AVD step above must NOT inherit this — see the job-level note.
        env:
          ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 1
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          force-avd-creation: false
          # Must match the create-AVD step above — this step reuses the AVD that
          # step created earlier in this same job.
          disk-size: 4096M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -writable-system -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # ONE line, deliberately. This action splits `script:` on newlines and runs each line as
          # its own `/usr/bin/sh -c` — multi-line constructs are a syntax error and shell variables
          # do not survive to the next line (run 31057524722 died on exactly that, after the tests
          # had passed). The body therefore lives in a file that runs in a single shell; see the
          # header of scripts/android-emulator-tests.sh.
          script: bash scripts/android-emulator-tests.sh ${{ matrix.api-level }}

      # Inventory whatever this lane skipped, the same way build-linux and build-apple do. Android
      # was the last lane missing this: the instrumented XML lands under
      # build/outputs/androidTest-results/ rather than build/test-results/, so the shared action's
      # glob never reached it (fixed in the action). Reports only — the gate that FAILS is
      # SOCKET_REQUIRE_ALL_TESTS=1, which now genuinely reaches the device (see
      # scripts/android-emulator-tests.sh) and is deliberately left unset until this inventory shows
      # the lane is clean.
      - uses: ./.github/actions/skip-inventory
        if: ${{ !cancelled() }}

      # Mirror the audit step from build-apple.yaml + build-linux.yaml:
      # count `harness OK` vs `harness SKIP` markers from
      # QuicHarnessIntegrationTests' withHarness() across the
      # connectedAndroidTest report XMLs. Surfaces a regression that
      # silently breaks the Android QUIC client as a CI warning instead
      # of letting it pass via the skip-on-failure catch.
      - name: Audit QUIC harness coverage on Android
        if: always()
        continue-on-error: true
        run: |
          REPORT_ROOT=socket-quic-quiche/build/outputs/androidTest-results
          if [ ! -d "$REPORT_ROOT" ]; then
            echo "no android instrumented-test results — audit skipped"
            exit 0
          fi
          OK=$(grep -rh 'harness OK' "$REPORT_ROOT" 2>/dev/null | wc -l | tr -d ' ')
          SKIP=$(grep -rh 'harness SKIP' "$REPORT_ROOT" 2>/dev/null | wc -l | tr -d ' ')
          # Distinct skip reasons (dedup + count). Bound to [^<&] so the match
          # stops at the next XML entity/tag in the androidTest result reports.
          SKIP_REASONS=$(grep -rhoE 'harness SKIP: [^<&]+' "$REPORT_ROOT" 2>/dev/null \
            | sed -E 's/^harness SKIP: //' | sort | uniq -c | sed -E 's/^ *//' | sort -rn)
          echo "QuicHarnessIntegrationTests on Android: OK=$OK, SKIP=$SKIP"
          [ -n "$SKIP_REASONS" ] && echo "Skip reasons:" && echo "$SKIP_REASONS"
          {
            echo "## QUIC harness — Android (emulator)"
            echo ""
            echo "| OK | SKIP |"
            echo "|---|---|"
            echo "| $OK | $SKIP |"
            if [ -n "$SKIP_REASONS" ]; then
              echo ""
              echo "<details><summary>Skip reasons (Android)</summary>"
              echo ""
              echo '```'
              echo "$SKIP_REASONS"
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$OK" = "0" ] && [ "$SKIP" != "0" ]; then
            echo "::warning::Every QuicHarnessIntegrationTest skipped on Android — emulator QUIC client not actually validated"
          elif [ "$OK" = "0" ]; then
            # OK=0 AND SKIP=0 means the audit matched NOTHING — the suite never ran on the emulator
            # (QuicHarnessIntegrationTests lives in commonTest, which connectedAndroidTest does not
            # execute) or the marker text moved. Either way this step validated nothing, so it has to
            # say so instead of printing "OK=0, SKIP=0" and passing like a clean result.
            echo "::warning::No harness OK/SKIP markers on Android — QuicHarnessIntegrationTests never ran on the emulator, so this audit validated nothing"
          fi

      # The instrumented-test record itself. Without this a failure left ONLY the Gradle console
      # stack (run 31027926910): no per-test HTML/XML report, and no logcat — where the Android
      # failure diagnostics actually live (see the `run tests` script above). Both are uploaded
      # together so the next occurrence can be read end-to-end from the artifact.
      - name: Upload instrumented test reports + logcat on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports-${{ matrix.api-level }}
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
            emulator-diagnostics/**
          if-no-files-found: warn
          retention-days: 7

      # Surface the quiche cargo build transcript when anything failed, so a build failure
      # (e.g. a missing rustup cross target → E0463) is diagnosable from an artifact instead
      # of hunting through interleaved BoringSSL/cargo output in the job log.
      - name: Upload quiche build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: quiche-build-logs-android-${{ matrix.api-level }}
          path: '**/build/quiche-build-logs/'
          if-no-files-found: ignore
          retention-days: 7

      - name: Bring down quic-echo harness
        if: always()
        run: cd test-harness && docker compose down -v

      - name: Kill emulator processes
        if: always()
        run: |
          pkill -SIGTERM crashpad_handler || true
          sleep 2
          pkill -SIGKILL crashpad_handler || true
          adb emu kill || true
