name: "Android Emulator Integration Test"
on:
  # A push to main or an integration branch runs only the jobs that fill caches (`natives`,
  # `kotlin-build`): a cache entry is readable by the ref that wrote it, by pull requests into that
  # ref, and by the default branch's. Pull requests alone wrote theirs under refs/pull/N/merge, which
  # no other pull request can read, so every new PR started cold (measured: PR 970 and PR 971 each
  # built the same natives, digest defa8fc37cabb022, hours apart).
  push:
    branches:
      - main
      - 'integrate/**'
    paths-ignore:
      - '**.md'
  pull_request:
    # See review.yaml: '*' does not match '/', so '*.md' let every docs/**.md change boot an
    # emulator for nothing. '**.md' matches markdown at any depth.
    paths-ignore:
      - '**.md'
    types:
      - synchronize
      - opened

# Same value as build-apple.yaml:60 and build-linux.yaml, so no lane scales its deadlines
# differently from another. `timeScaleEnv()`'s Android actual is the commonJvmMain one
# (System.getenv), and TestHelpers.testTimeScale clamps the result to 1..10, so a slow/loaded
# emulator gets 3x the wall-clock on every `.scaled` budget without any assertion, ordering or
# timing ratio changing — the shape of flake #291 on the API-35 lane.
#
# ⚠️ Scope, stated honestly: this env reaches the HOST side of this job (the Gradle daemon and the
# :socket-quic-quiche:startNetworkControlServer JVM that scripts/android-emulator-tests.sh
# launches). It does NOT reach the instrumented test process on the emulator — an app process is
# forked from zygote and inherits the device's environment, not the runner's. Propagating a scale
# to `connectedAndroidTest` needs an instrumentation argument plumbed through to timeScaleEnv(),
# which is Kotlin-side work outside this file; tracked with #291.
env:
  QUIC_TEST_TIME_SCALE: "3"

jobs:
  # Every Gradle call below, including those in scripts/android-emulator-tests.sh, takes this run's
  # one version through the job env; build.gradle.kts fails a CI build that was not handed one.
  version:
    uses: ./.github/workflows/compute-ci-version.yaml

  # The inputs every Android lane shares, built ONCE per run instead of once per lane: the x86_64
  # Android natives (the emulator's ABI), and the quic-echo fat jar with the host libquiche.so it
  # carries. Each lane used to rebuild both (2-3 min each, four lanes and the benchmark job), because
  # the lanes ran concurrently and every one of them missed the cache before any of them saved it.
  # This job is the single writer of both caches (the rule in .github/actions/linux-quiche-env); the
  # lanes only take the artifact. The artifact keeps the dotfile build markers (include-hidden-files),
  # the same trap build-linux.yaml's `natives` job documents.
  natives:
    name: "Android lane inputs (natives + quic-echo jar)"
    runs-on: ubuntu-latest
    needs: version
    timeout-minutes: 25
    env:
      ORG_GRADLE_PROJECT_version: ${{ needs.version.outputs.version }}
      ORG_GRADLE_PROJECT_linuxTargets: "false"
      ORG_GRADLE_PROJECT_quicheAndroidAbis: x86_64
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Restore Gradle wrapper distribution
        uses: actions/cache/restore@v6
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-linux-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      # The Gradle dependency cache; restore-only, written by native-deps-freshness.yaml's `cache-warm`
      # and build-linux.yaml's `natives` (see the same step in the lane jobs' history).
      - name: Restore Gradle dependency cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.gradle/caches
          key: gradle-linux-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-linux-

      # Gradle's local build cache for the JVM test classes this job compiles (quicEchoJar). The repo's
      # Gradle dependency cache holds no build cache (gradle-cache-prune deletes it: 2.7 GB), so this is
      # its own entry: a new key per commit, restored by prefix, so the previous run's entries start
      # every run.
      - name: Cache Gradle build cache (JVM test classes)
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/build-cache-1
          key: android-bc-jvm-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            android-bc-jvm-v1-${{ runner.os }}-

      # The toolchain is pinned, not `stable`: the Android cache key below includes the compiler
      # version, so a floating toolchain changed the key (and rebuilt every native) whenever a Rust
      # release landed. Bump it here deliberately.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.120.0

      # One digest of the inputs of a quiche native binary, shared by every writer and reader of these
      # caches (see .github/scripts/quiche-native-inputs.sh). It used to hash all of
      # socket-quic-quiche/build.gradle.kts, test configuration included, so the key changed on almost
      # every commit and every job here compiled quiche from source.
      - name: Compute quiche native cache key
        id: qkey
        uses: ./.github/actions/quiche-native-key

      # quic-echo's libquiche.so and JNI shim (`:quicEchoJar` → buildQuicheSharedLinuxX64). Building
      # them from source provisions the linuxX64 BoringSSL bundle, which is a GitHub release download.
      # Same key and path as the other writers (build-linux.yaml `natives` and
      # native-deps-freshness.yaml `cache-warm`). buildQuicheSharedLinuxX64 skips only when the restored
      # `.built-<quiche>-…-<native-input digest>` marker matches this tree; otherwise it rebuilds. This
      # job saves on a miss as well: the first run of a changed native input pays the build once (here,
      # not once per lane), every later run of the PR hits.
      - name: Cache quiche Linux x64 natives (quic-echo)
        id: linux_natives
        uses: actions/cache@v6
        with:
          path: socket-quic-quiche/libs/quiche/linux-x64
          key: quiche-linux-x64-v9-${{ steps.qkey.outputs.digest }}

      - name: Compute Android quiche native cache key
        id: qkey_android
        uses: ./.github/actions/quiche-native-key
        with:
          rust: "true"

      - name: Cache quiche Android x86_64 natives
        id: android_natives
        uses: actions/cache@v6
        with:
          path: socket-quic-quiche/src/androidMain/jniLibs/x86_64
          key: quiche-android-x86_64-v1-${{ steps.qkey_android.outputs.digest }}

      # cargo-ndk is pinned and its binary cached: `cargo install` compiled it from source on every
      # lane (25-55 s) and floated with crates.io.
      - name: Cache cargo-ndk
        id: cargo_ndk
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-4.1.2-rustc-1.100.0-${{ runner.os }}

      # libclang is only needed when a native is actually compiled (boring-sys' bindgen), so a run whose
      # caches both hit installs nothing.
      - name: Install libclang
        if: steps.android_natives.outputs.cache-hit != 'true' || steps.linux_natives.outputs.cache-hit != 'true'
        uses: ./.github/actions/apt-install-cached
        with:
          purpose: "android lane inputs: libclang for boring-sys bindgen"
          packages: libclang-dev

      - name: Install cargo-ndk and the x86_64 Android Rust target
        if: steps.android_natives.outputs.cache-hit != 'true'
        run: |
          rustup target add x86_64-linux-android
          if [ "${{ steps.cargo_ndk.outputs.cache-hit }}" != "true" ]; then
            cargo install cargo-ndk --version 4.1.2 --locked
          fi

      # The Android build only checks that the files are there on a cache hit (-PquicheAndroidNativesPrebuilt):
      # a fresh runner has no task history and would otherwise compile them again.
      - name: Use the cached Android natives
        if: steps.android_natives.outputs.cache-hit == 'true'
        run: echo "ORG_GRADLE_PROJECT_quicheAndroidNativesPrebuilt=true" >> "$GITHUB_ENV"

      # buildAndroidJniX86_64 emits the dedup'd pair into src/androidMain/jniLibs/x86_64/: a thin
      # libquiche_jni.so (DT_NEEDED=libquiche.so) beside a self-contained libquiche.so, exactly what
      # the emulator loads. Via Gradle, so this cannot drift from build.gradle.kts.
      - name: Build Android QUIC native libs (x86_64, via Gradle)
        if: steps.android_natives.outputs.cache-hit != 'true'
        run: .github/scripts/gradle-retry.sh :socket-quic-quiche:buildAndroidJniX86_64 --no-configuration-cache

      - name: Generate harness TLS certs
        run: bash test-harness/tls/gen-certs.sh

      # The quic-echo fat jar docker compose's `build: ./quic-echo` COPYs (host arch only: the image and
      # the jar are both linux-x64). Building it compiles the JVM test classes and, on a Linux cache
      # miss, the host libquiche.so.
      - name: Build quic-echo fat jar (Linux x64)
        run: .github/scripts/gradle-retry.sh :socket-quic-quiche:quicEchoJar --no-configuration-cache

      # Not a lane's job to find this out an hour later: the artifact must hold every file the lanes take.
      - name: Assert the lane inputs are complete
        run: |
          set -euo pipefail
          for f in socket-quic-quiche/src/androidMain/jniLibs/x86_64/libquiche.so \
                   socket-quic-quiche/src/androidMain/jniLibs/x86_64/libquiche_jni.so \
                   test-harness/quic-echo/quic-echo.jar \
                   test-harness/quic-echo/testcerts/cert.crt \
                   test-harness/quic-echo/testcerts/cert.key; do
            [ -s "$f" ] || { echo "::error::missing $f"; exit 1; }
          done
          markers=$(find socket-quic-quiche/libs/quiche/linux-x64 -name '.built-*' | wc -l)
          [ "$markers" -gt 0 ] || { echo "::error::no linux-x64 quiche build marker"; exit 1; }

      # The JVM test classes' build-cache entries, for the lanes' `startNetworkControlServer` build
      # (the same compileTestKotlinJvm): they take these instead of compiling again (3.7 min each).
      - name: Stage the build-cache entries
        run: |
          set -euo pipefail
          mkdir -p lane-build-cache
          cp -a "$HOME/.gradle/caches/build-cache-1/." lane-build-cache/
          echo "build cache entries: $(find lane-build-cache -type f | wc -l), $(du -sh lane-build-cache | cut -f1)"

      # ⚠️ include-hidden-files IS LOAD-BEARING: the linux-x64 build markers are dotfiles, and without
      # them every lane would silently rebuild the host libquiche.so if its Gradle graph reaches it.
      - name: Upload the lane inputs
        uses: actions/upload-artifact@v7
        with:
          name: android-lane-inputs
          path: |
            socket-quic-quiche/src/androidMain/jniLibs/x86_64/
            socket-quic-quiche/libs/quiche/linux-x64/
            test-harness/quic-echo/quic-echo.jar
            test-harness/quic-echo/testcerts/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

      # Its own artifact, so a lane takes the natives without waiting for the cache upload. The entries
      # are gzip files already: no further compression.
      - name: Upload the JVM build-cache entries
        uses: actions/upload-artifact@v7
        with:
          name: android-jvm-build-cache
          path: lane-build-cache/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  # The Android Kotlin compile and dex of every module's debug and androidTest variants, built once per
  # run into Gradle's build cache and handed to the lanes, which then only package, install and run.
  # The tasks named here need no natives, so this job runs beside `natives` instead of after it (the
  # tasks that merge the natives into the APKs, and the packaging, stay in the lanes: they take
  # seconds). The outputs are the same for every API level, because every module's minSdk is 28.
  kotlin-build:
    name: "Android Kotlin build cache"
    runs-on: ubuntu-latest
    needs: version
    timeout-minutes: 25
    env:
      ORG_GRADLE_PROJECT_version: ${{ needs.version.outputs.version }}
      ORG_GRADLE_PROJECT_linuxTargets: "false"
      ORG_GRADLE_PROJECT_quicheAndroidAbis: x86_64
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Restore Gradle wrapper distribution
        uses: actions/cache/restore@v6
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-linux-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Restore Gradle dependency cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.gradle/caches
          key: gradle-linux-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-linux-

      # This job writes the entry (the post step saves it): the next run of the branch starts from it.
      - name: Cache Gradle build cache (Android Kotlin)
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/build-cache-1
          key: android-bc-kotlin-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            android-bc-kotlin-v1-${{ runner.os }}-

      # The lanes' own certs step: the harness config and the pinned certs are inputs of the build.
      - name: Generate harness TLS certs
        run: bash test-harness/tls/gen-certs.sh

      # The compile and dex tasks of the lanes' connectedAndroidTest (every module's debug variant and
      # its androidTest variant) and the JVM test classes the network control server runs. Selected by
      # name, so a module that gains an androidInstrumentedTest source set is included.
      - name: Compile every module's debug and androidTest variants
        run: |
          .github/scripts/gradle-retry.sh             compileDebugKotlinAndroid compileDebugAndroidTestKotlinAndroid dexBuilderDebugAndroidTest             :socket-quic-quiche:compileTestKotlinJvm :socket-quic-quiche:jvmTestProcessResources             --no-configuration-cache

      - name: Stage the build-cache entries
        run: |
          set -euo pipefail
          mkdir -p lane-build-cache
          cp -a "$HOME/.gradle/caches/build-cache-1/." lane-build-cache/
          echo "build cache entries: $(find lane-build-cache -type f | wc -l), $(du -sh lane-build-cache | cut -f1)"

      - name: Upload the build-cache entries
        uses: actions/upload-artifact@v7
        with:
          name: android-kotlin-build-cache
          path: lane-build-cache/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  android-emulator:
    runs-on: ubuntu-latest
    needs: version
    if: ${{ github.event_name == 'pull_request' }}
    # 25, unchanged: before `run tests` a lane spends ~2.5 min (setup, SDK install) and ~1.5 min after it,
    # so the step below gets RUN_TESTS_MINUTES = 19 of it. The wait for the shared jobs' inputs is INSIDE
    # that step, taken out of its budget, not added to it, so a hang is still bounded by the same 25.
    timeout-minutes: 25
    # ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL is deliberately NOT set job-wide — see the `run tests`
    # step, which is the only step where force-killing the emulator is safe. Setting it here also
    # applied it to the create-AVD step, whose entire purpose is to let the emulator WRITE a
    # snapshot on shutdown, and a 1-second grace is not enough to flush one.
    env:
      ORG_GRADLE_PROJECT_version: ${{ needs.version.outputs.version }}
      # This lane builds Android, the JVM quic-echo jar and the host's libquiche.so. It never
      # compiles a Linux Kotlin/Native target, but with those targets declared every Gradle call
      # here still configured them. Configuring them provisions the linuxX64 + linuxArm64 BoringSSL
      # bundles (GitHub release downloads) while the task graph is built, and the commonMain
      # metadata chain then built liburing (a GitHub archive download) and fetched the K/N
      # toolchain. On 2026-11-08 GitHub answered those downloads with 504 for hours, and every leg
      # of this matrix failed before it compiled anything. The job env also reaches the Gradle
      # calls in scripts/android-emulator-tests.sh. quic-bench.yaml and the quiche-jvm legs of
      # build-linux.yaml use the same switch.
      ORG_GRADLE_PROJECT_linuxTargets: "false"
      # The emulator is x86_64. Every connected* and merge*JniLibFolders task depends on every ABI's
      # native build, so without this the run test step compiled arm64-v8a and armeabi-v7a through
      # cargo-ndk as well (~2.5 minutes) for libraries no test loads. build-linux builds all ABIs.
      ORG_GRADLE_PROJECT_quicheAndroidAbis: x86_64
      # The `run tests` step's timeout and the watchdog's deadline: the emulator's boot, the wait for the
      # shared jobs' inputs (scripts/android-lane-inputs.sh) and the tests all fit in it. Green runs
      # took 11-15 min for the whole job (the slowest, API 29, ~13 min in this step), the shared jobs
      # finish 4-6 min in, and the wait is bounded by LANE_INPUTS_WAIT_MINUTES, so 19 leaves the margin the
      # old 17 had after a 2-min-shorter step.
      RUN_TESTS_MINUTES: 19
      LANE_INPUTS_WAIT_MINUTES: 8
    strategy:
      # Each API level is an independent signal — an API-35-only regression must not cancel the 29 lane
      # (or vice versa) before it reports, or the matrix tells us less than the single lane did.
      fail-fast: false
      matrix:
        # 29 = the floor this suite has always run on. 35 = the reactive-monitor ceiling: every
        # ConnectivityManager tightening that would break AndroidNetworkMonitor landed after 29 —
        # the API-31 NetworkCapabilities/callback changes and API-34's stricter background-callback
        # accounting among them — so a lane that stops at 29 cannot observe them. Both use the
        # `default` (AOSP userdebug) image, which is what makes `adb root` + `su 0 iptables/tc`
        # work for the QUIC netem suite; `google_apis*` images would break that.
        # 28 = the minSdk of every published module: the oldest device the AAR claims to run on,
        # and the one place a call to a newer API without a version guard fails. 36 = the newest
        # platform with a `default` x86_64 image: the next tightening lands here before it reaches users.
        # No arm64 lane: GitHub's arm64 runners offer no KVM, and an unaccelerated emulator cannot
        # finish this suite inside the job's budget. The arm64 JNI build is covered by build-linux.
        api-level: [28, 29, 35, 36]
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      # The Gradle distribution, so `./gradlew` does not download it from services.gradle.org,
      # which redirects to GitHub. Restore-only: build-linux.yaml's `natives` job and
      # native-deps-freshness.yaml's `cache-warm` write this key on main, and every job that uses
      # .github/actions/linux-quiche-env restores it the same way. The key is the hash of
      # gradle-wrapper.properties, so a Gradle version bump misses and downloads, as before.
      - name: Restore Gradle wrapper distribution
        uses: actions/cache/restore@v6
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-linux-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      # The Gradle dependency cache: the settings plugins (Develocity, foojay), the Android Gradle
      # Plugin and every library the build resolves, so `./gradlew` does not fetch them from
      # plugins.gradle.org and Google/Central on each run. Restore-only: native-deps-freshness.yaml's
      # `cache-warm` writes it on main after `resolveAllDependencies`, build-linux.yaml's `natives`
      # job writes the same key, and a PR ref reads main's entry. The key and prefix are
      # build-linux.yaml's, so a build-script edit still lands on the previous entry.
      - name: Restore Gradle dependency cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.gradle/caches
          key: gradle-linux-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-linux-

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Bring up the docker quic-echo harness (same image / port as
      # build-linux + build-apple) before the emulator starts.
      #
      # ⚠️ `10.0.2.2:<port>` is a fact about an EMULATOR, not about Android.
      # It is the AVD's built-in alias for the host's loopback; a physical
      # device has no such alias, and `adb reverse` cannot stand in because
      # it forwards TCP only while QUIC is UDP. This lane is emulator-only,
      # so the pairing holds here: the compose file publishes a fixed port
      # on the host's loopback and the alias makes that loopback
      # addressable. The device side takes it as an explicit, named
      # fallback (`EndpointOrigin.DockerContract` in HarnessEndpoints.kt),
      # not as a hardcoded host — on real hardware the address is computed
      # on the host, probed, and carried down as an instrumentation
      # argument by `:socket-quic-quiche:androidQuicIntegrationTest`.
      #
      # Previous setup ran no server at all and used `adb reverse
      # tcp:4433 tcp:4433` — wrong on two counts: adb reverse only
      # supports TCP (QUIC is UDP) and no QuicEchoTestServer ever
      # started on the host. The result was a quiet skip of every
      # instrumented QUIC test via the `assumeTrue(...)` in
      # AndroidQuicConnectivityTests.checkServerReachable's catch
      # block. This was the Android side of the same silent-skip
      # failure mode being fixed across the comprehensive QUIC CI plan
      # (macOS = PR #51, Linux ARM64 = PR #52). Both catch-alls are now
      # gone: the causes they conflated are separate `SkipReason`s with
      # separate `SkipGate`s, counted by the skip inventory, and the gate
      # itself finally reaches the device — see the note on
      # SOCKET_REQUIRE_ALL_TESTS in scripts/android-emulator-tests.sh.
      - name: Generate harness TLS certs
        run: bash test-harness/tls/gen-certs.sh


      # The natives, the quic-echo jar and the compiled Kotlin come from the `natives` and `kotlin-build`
      # jobs, which build them once for every lane. They are taken INSIDE the emulator step below
      # (scripts/android-lane-inputs.sh), after the emulator has booted, so the boot overlaps the
      # shared build instead of following it. The quic-echo container comes up there too: it needs the jar.

      # sdkmanager reports a corrupt download as a Warning and exits 0 with the package missing, so
      # the emulator-runner action's own install cannot be trusted to fail. This step installs the
      # emulator + system image with retries, fails on sdkmanager's error output, and requires
      # `emulator -no-window -version` to work. The action's installs below are then no-ops; each
      # action step re-checks with `verify` as its pre-emulator-launch-script, which fails that
      # step with the real cause ahead of any boot error.
      - name: Install + verify Android Emulator and system image
        timeout-minutes: 6
        run: bash scripts/android-sdk-emulator.sh install ${{ matrix.api-level }}

      # THERE IS NO "create AVD and generate boot snapshot" STEP any more (it cost 27-55 s per lane).
      # The step below runs with -writable-system, which the emulator cannot load a quickboot snapshot
      # with ("Device 'system' does not have the requested snapshot 'default_boot'", then a cold boot),
      # so the snapshot the removed step booted an emulator to write was never read. The action creates the
      # AVD itself when it is missing. There is still no AVD cache, for the reason the #333 poisoning
      # showed: a cached snapshot is what made an emulator exit before registering with adb.

      # The run-tests step's deadline, for the script's watchdog to stop a run, capture it and shut
      # the emulator down before the step's own timeout ends it with nothing captured.
      - name: run-tests deadline
        run: echo "ANDROID_TESTS_STEP_DEADLINE=$(( $(date +%s) + RUN_TESTS_MINUTES * 60 ))" >> "$GITHUB_ENV"

      - name: run tests
        # Bounded well below the job budget so a HANG fails this step while the job still has time
        # to run the capture steps below. Without it the only bound is the job's timeout-minutes, and
        # a hung test consumes all of it — then the job is CANCELLED, which is not `failure()`, so
        # every upload is skipped and the hang leaves nothing to read (#417). That is not
        # hypothetical: DeviceHandoffProbe once stalled both lanes at 69/153 and produced no
        # artifacts at all.
        #
        # This timeout is the backstop. The script's own watchdog (WATCHDOG in
        # scripts/android-emulator-tests.sh) declares a hang first: an APK install running for 5 min,
        # no test started or finished for 5 min, or the deadline above less the ~2 min the capture,
        # Gradle's stop and the emulator shutdown take. Green API 29 runs took 8.5-10.8 min of
        # script time; RUN_TESTS_MINUTES leaves a runner 1.5x slower room to finish.
        timeout-minutes: ${{ fromJSON(env.RUN_TESTS_MINUTES) }}
        uses: reactivecircus/android-emulator-runner@v2
        # Safe to force-kill HERE and nowhere else: this step runs with `-no-snapshot-save`, so the
        # emulator has nothing to flush on shutdown and waiting 20s for a graceful exit is pure
        # dead time. The create-AVD step above must NOT inherit this — see the job-level note.
        env:
          ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 1
          # For the script's wait for, and download of, the shared jobs' artifacts.
          GH_TOKEN: ${{ github.token }}
          ANDROID_LANE_INPUTS_WAIT_MIN: ${{ env.LANE_INPUTS_WAIT_MINUTES }}
          # A Perfetto ring of the device (scheduling, process stats, ss/am/network atrace for the
          # test APKs), written out only if the run fails or hangs: scripts/android-perfetto-ring.sh.
          # Traced: 29 and 35. UNTRACED: 36 (an instrument has hidden the race it was built to catch
          # on this project, so the matrix always has an uninstrumented lane) and 28, which has no
          # Perfetto service and keeps logcat only.
          PERFETTO_RING: ${{ contains(fromJSON('[29, 35]'), matrix.api-level) && '1' || '0' }}
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          force-avd-creation: false
          # Must match the create-AVD step above — this step reuses the AVD that
          # step created earlier in this same job.
          disk-size: 4096M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -writable-system -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          pre-emulator-launch-script: bash scripts/android-sdk-emulator.sh verify ${{ matrix.api-level }}
          # ONE line, deliberately. This action splits `script:` on newlines and runs each line as
          # its own `/usr/bin/sh -c` — multi-line constructs are a syntax error and shell variables
          # do not survive to the next line (run 31057524722 died on exactly that, after the tests
          # had passed). The body therefore lives in a file that runs in a single shell; see the
          # header of scripts/android-emulator-tests.sh. The script also shuts the emulator down
          # itself, bounded (see its EMULATOR SHUTDOWN section), so the action's own trailing
          # `adb emu kill` normally finds no device.
          script: bash scripts/android-emulator-tests.sh ${{ matrix.api-level }}

      # Inventory whatever this lane skipped, the same way build-linux and build-apple do. Android
      # was the last lane missing this: the instrumented XML lands under
      # build/outputs/androidTest-results/ rather than build/test-results/, so the shared action's
      # glob never reached it (fixed in the action). Reports only — the gate that FAILS is
      # SOCKET_REQUIRE_ALL_TESTS=1, which now genuinely reaches the device (see
      # scripts/android-emulator-tests.sh) and is deliberately left unset until this inventory shows
      # the lane is clean.
      - uses: ./.github/actions/skip-inventory
        if: ${{ !cancelled() }}

      # Did the emulator really exercise the docker quic-echo harness?
      #
      # This step used to copy the Linux/Apple audit and count the `harness OK` / `harness SKIP:`
      # lines QuicHarnessIntegrationTests prints. That suite is in commonTest, which
      # androidInstrumentedTest deliberately does not dependsOn, so it is never in the test APK and
      # the step printed `QuicHarnessIntegrationTests on Android: OK=0, SKIP=0` on every run: a line
      # that looks like a suite that ran nothing, from a step that validated nothing (and could not
      # fail: it was continue-on-error). On this lane the harness is reached by the instrumented
      # classes that resolve HarnessEndpoints.quicEcho; the script finds them in the source and reads
      # their outcomes from the result XML, quoting each skip's reason from its per-test logcat.
      # It FAILS when a harness class is missing from the results or none of its tests passed. When
      # it fails, the upload below carries the XML and per-test logcat it read, plus the quic-echo
      # container's own log and state.
      - name: Audit QUIC harness coverage on Android
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 -I .github/scripts/audit-android-quic-harness.py \
            --report-root socket-quic-quiche/build/outputs/androidTest-results \
            --source-dir socket-quic-quiche/src/androidInstrumentedTest \
            --api-level ${{ matrix.api-level }}

      # The quic-echo side of a harness failure: whether the container was up, and what it logged
      # (handshakes it saw, or nothing at all). Only the device side was recorded before, so "the
      # emulator could not reach it" and "it was not running" looked the same.
      - name: Capture quic-echo harness state on failure
        if: ${{ failure() || cancelled() }}
        continue-on-error: true
        run: |
          mkdir -p emulator-diagnostics
          {
            echo "--- docker compose ps ---"
            (cd test-harness && docker compose ps -a) 2>&1 || true
            echo "--- docker compose logs quic-echo (last 500 lines) ---"
            (cd test-harness && docker compose logs --no-color --tail 500 quic-echo) 2>&1 || true
            echo "--- host UDP sockets on 14433 ---"
            ss -uanp 2>/dev/null | grep -E ':14433\b' || echo "(none)"
          } > emulator-diagnostics/quic-echo-api${{ matrix.api-level }}.txt

      # The instrumented-test record itself. Without this a failure left ONLY the Gradle console
      # stack (run 31027926910): no per-test HTML/XML report, and no logcat — where the Android
      # failure diagnostics actually live (see the `run tests` script above). Both are uploaded
      # together so the next occurrence can be read end-to-end from the artifact.
      # `failure() || cancelled()`, not `failure()`: a job killed by its timeout budget is
      # CANCELLED, and `failure()` is false for a cancelled job — so the one run that most needs
      # diagnostics is exactly the run that uploaded none of them (#417). The logcat streamer in
      # scripts/android-emulator-tests.sh writes continuously, so the evidence already exists on
      # disk when a hang is killed; only the gate was throwing it away.
      - name: Upload instrumented test reports + logcat on failure
        if: ${{ failure() || cancelled() }}
        continue-on-error: true # an upload hiccup must not mask the failure it was capturing
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports-${{ matrix.api-level }}
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
            emulator-diagnostics/**
          if-no-files-found: warn
          retention-days: 7

      # The Perfetto ring, pulled from the device by the test script only when the run failed or hung.
      # Its own artifact, 14 days: a scheduling trace is read well after the logcat of the same run.
      - name: Upload Perfetto ring on failure
        if: ${{ (failure() || cancelled()) && hashFiles('perfetto-ring/perfetto-ring-api*.gz') != '' }}
        continue-on-error: true # an upload hiccup must not mask the failure it was capturing
        uses: actions/upload-artifact@v7
        with:
          name: perfetto-ring-api${{ matrix.api-level }}
          path: perfetto-ring/
          if-no-files-found: ignore
          retention-days: 14

      # What a failed core test wrote: the flight recording of each connection it touched, one .trace per
      # connection, rebuilt from the run's logcat by scripts/android-core-flight.sh (the test app is
      # uninstalled with its files when the run ends).
      - name: Upload core flight recordings on failure
        if: ${{ (failure() || cancelled()) && hashFiles('core-flight/**/*.trace') != '' }}
        continue-on-error: true # an upload hiccup must not mask the failure it was capturing
        uses: actions/upload-artifact@v7
        with:
          name: core-flight-android-api${{ matrix.api-level }}
          path: core-flight/
          if-no-files-found: ignore
          retention-days: 14

      # A shutdown wedge after green tests leaves the job green (it is a host-side fault, reported
      # as a ::warning::), so the failure upload above never carries its capture; this one does.
      # A test-APK install that stalled and was recovered by the adb install guard
      # (scripts/adb-install-guard.sh) leaves the job green, so the failure upload above never
      # carries its capture; this one does, so every stall adds evidence.
      - name: Upload stalled-install capture
        if: ${{ !cancelled() && hashFiles('emulator-diagnostics/install-stall-*.txt') != '' }}
        continue-on-error: true # an upload hiccup must not mask the capture's ::warning::
        uses: actions/upload-artifact@v7
        with:
          name: install-stall-${{ matrix.api-level }}
          path: |
            emulator-diagnostics/install-stall-*.txt
            emulator-diagnostics/logcat-api*.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload emulator shutdown-wedge capture
        if: ${{ !cancelled() && hashFiles('emulator-diagnostics/emulator-shutdown-wedge-*.txt') != '' }}
        continue-on-error: true # an upload hiccup must not mask the capture's ::warning::
        uses: actions/upload-artifact@v7
        with:
          name: emulator-shutdown-wedge-${{ matrix.api-level }}
          path: emulator-diagnostics/emulator-shutdown-wedge-*.txt
          if-no-files-found: error
          retention-days: 7

      # Surface the quiche cargo build transcript when anything failed, so a build failure
      # (e.g. a missing rustup cross target → E0463) is diagnosable from an artifact instead
      # of hunting through interleaved BoringSSL/cargo output in the job log.
      - name: Upload quiche build logs on failure
        if: ${{ failure() || cancelled() }}
        continue-on-error: true # an upload hiccup must not mask the failure it was capturing
        uses: actions/upload-artifact@v7
        with:
          name: quiche-build-logs-android-${{ matrix.api-level }}
          path: '**/build/quiche-build-logs/'
          if-no-files-found: ignore
          retention-days: 7

      - name: Bring down quic-echo harness
        if: always()
        run: cd test-harness && docker compose down -v

      - name: Kill emulator processes
        if: always()
        run: |
          # -f: plain pkill matches the 15-char comm, which "crashpad_handler" (16) never equals.
          pkill -SIGTERM -f crashpad_handler || true
          sleep 2
          pkill -SIGKILL -f crashpad_handler || true
          adb emu kill || true

  # Jetpack Microbenchmarks (benchmarks/android-micro) in a release-like build: the test APK minified by
  # R8 full mode, once with AGP's default rules, once with only the libraries' consumer rules (proving
  # socket-quic-quiche's consumer-rules.pro keeps the by-name JNI binding working on its own), and once
  # unminified for comparison. Every benchmark completes a QUIC round trip through quiche before it
  # times anything, so an R8 build that broke JNI fails this job. The numbers are an emulator's:
  # printed to the job summary as regression signals, never compared against a threshold.
  android-benchmark:
    name: "Android microbenchmarks (R8, emulator)"
    runs-on: ubuntu-latest
    needs: version
    if: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 40
    env:
      ORG_GRADLE_PROJECT_version: ${{ needs.version.outputs.version }}
      ORG_GRADLE_PROJECT_linuxTargets: "false"
      # The emulator is x86_64, and the benchmark APK carries no other ABI's natives to run.
      ORG_GRADLE_PROJECT_quicheAndroidAbis: x86_64
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Restore Gradle wrapper distribution
        uses: actions/cache/restore@v6
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-linux-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      # The Gradle dependency cache: the settings plugins (Develocity, foojay), the Android Gradle
      # Plugin and every library the build resolves, so `./gradlew` does not fetch them from
      # plugins.gradle.org and Google/Central on each run. Restore-only: native-deps-freshness.yaml's
      # `cache-warm` writes it on main after `resolveAllDependencies`, build-linux.yaml's `natives`
      # job writes the same key, and a PR ref reads main's entry. The key and prefix are
      # build-linux.yaml's, so a build-script edit still lands on the previous entry.
      - name: Restore Gradle dependency cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.gradle/caches
          key: gradle-linux-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-linux-

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The Android natives come from the `natives` job, which built them once for every Android job.
      # They are taken inside the emulator step (scripts/android-lane-inputs.sh), after the boot.

      - name: Install + verify Android Emulator and system image
        timeout-minutes: 6
        run: bash scripts/android-sdk-emulator.sh install 34

      # One emulator step, no snapshot: unlike android-emulator this job boots once.
      - name: Run the benchmarks
        # As before: the wait for the `natives` job (at most 8 min) is inside these 25.
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 1
          GH_TOKEN: ${{ github.token }}
          ANDROID_LANE_INPUTS_WAIT_MIN: 8
        with:
          api-level: 34
          target: default
          arch: x86_64
          disk-size: 4096M
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          pre-emulator-launch-script: bash scripts/android-sdk-emulator.sh verify 34
          # ONE line: the action runs each line of `script:` in its own shell (see android-emulator).
          script: bash scripts/android-benchmark.sh 34

      - name: Upload benchmark results
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: android-benchmark
          path: |
            bench-android/**
            benchmarks/android-micro/build/outputs/**
            benchmarks/android-micro/build/reports/androidTests/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload emulator shutdown-wedge capture
        if: ${{ !cancelled() && hashFiles('emulator-diagnostics/emulator-shutdown-wedge-*.txt') != '' }}
        continue-on-error: true # an upload hiccup must not mask the capture's ::warning::
        uses: actions/upload-artifact@v7
        with:
          name: emulator-shutdown-wedge-benchmark-34
          path: emulator-diagnostics/emulator-shutdown-wedge-*.txt
          if-no-files-found: error
          retention-days: 7
