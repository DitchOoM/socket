name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'src/**/kotlin/**'
      - '.github/workflows/docs.yaml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to use for API docs (e.g. 2.0.1). Leave empty for default.'
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      # cache-disabled, plus an explicit read-only restore below.
      #
      # This job and validate-artifacts.yaml's `validate` are the only two that run setup-gradle in
      # the DEFAULT BRANCH's ref scope, which is the only scope where it writes rather than reads.
      # Between them they were storing the entire `gradle-home-v2` extraction family — 1384MB of
      # gradle-dependencies-v2 / gradle-wrapper-zips-v2 / gradle-transforms-v2 / … — which is a
      # third mechanism caching the same modules-2 content that build-apple.yaml's explicit
      # `gradle-macos-*` entry and setup-java's (now removed) `cache: gradle` also held. Three
      # copies of one directory, in a repo pinned at the 10GB Actions cache cap, where the eviction
      # that causes is what makes a "cached" quiche native build still cost 339s on Apple.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      # Zero new bytes: reads the entry build-apple.yaml's K/N shard already writes. `gradle-macos-kn-*`
      # is the warmest of the three (it holds build-cache-1 klib output); `gradle-macos-` is the
      # `natives`-written fallback.
      - name: Restore Gradle build outputs (read-only)
        uses: actions/cache/restore@v6
        with:
          path: ~/.gradle/caches
          key: gradle-macos-kn-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-macos-kn-
            gradle-macos-

      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate API Documentation with Dokka
        run: ./gradlew copyDokkaToDocusaurus ${{ steps.version.outputs.version && format('-Pversion={0}', steps.version.outputs.version) || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build documentation
        working-directory: docs
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
