name: "Build & Test (Linux)"

# FAN-OUT SHAPE (was one ~28-31 minute serial `build` job plus a 6-7 minute fuzz tail):
#
#   natives ──┬── checks-tests   (the big JVM/JS/Android/K-N suite + the netns + Docker-harness lanes)
#             ├── quiche-jvm     (matrix: JNI | FFM | JDK 17 / JNI)
#             ├── link ──┬── integration-linux-x64
#             │          └── integration-linux-arm64
#             ├── publish        (publishToMavenLocal + the JDK-25 MR-jar link-check)
#             ├── malloc-check
#             ├── fuzz-jvm (matrix) / fuzz-native (matrix) / fuzz-boringssl-asan
#
# `natives` builds every quiche native this runner is responsible for — and it is responsible for far
# more than Linux: linux-x64, linux-arm64, the Android ABIs, and the Windows x64 JNI shim that
# review.yaml's separate windows-latest job consumes. It hands the lot to the consumers as an
# artifact, so the ~10-20 minute cargo/BoringSSL build is paid at most once per run instead of being
# the serial prefix of everything.
#
# The win is mostly in taking `publish` off the tail: it used to run AFTER the ~20 minute
# checks-and-tests step and all three JVM quiche backends, purely because they shared a job, even
# though it depends on none of them. `validate` (the caller's next job) needs the published
# artifacts, not the test results, so publishing in parallel with the tests shortens the run's
# critical path directly. Secondarily, `link` no longer waits for the tests either, which is what
# unblocks integration-linux-{x64,arm64} early.
#
# ⚠️ This does NOT weaken the release gate. A reusable workflow call completes only when ALL of its
# jobs complete and fails if ANY of them fail, so a caller's `needs: build-linux` still waits for
# every test job here. Publishing early makes the artifacts available sooner within the run; it
# never lets a red test suite reach `publish-to-central`. The note at merged.yaml:253 still holds.
#
# ⚠️ THE DOCKER HARNESS DOES NOT CROSS JOB BOUNDARIES. `docker compose up` in one job is unreachable
# from another, so every step that needs it stays in the SAME job as the tests that use it:
#   - checks-tests owns the harness TLS certs + CA trust + the aioquic HTTP/3/WebTransport interop
#     server + the ls-qpack QPACK oracle, because :socket-http3:jvmTest's Http3DockerInteropTests /
#     WebTransportDockerInteropTests / QpackDifferentialInteropTests run inside its gradle call.
#   - quiche-jvm owns its OWN copy of the certs + CA trust, because :socket-quic-quiche:jvmTest
#     dependsOn(harnessUp) (root build.gradle.kts) and brings the stack up inside that job.
#   - integration-linux-{x64,arm64} already brought the harness up at the YAML level, unchanged.
#
# ⚠️ Shard balance is a first cut, not a measured optimum. Every extra ubuntu job re-pays checkout +
# JDK + cache restore + apt toolchain + Gradle configuration (~3-4 min), so splitting further is NOT
# free. Judge changes here over several runs.

on:
  workflow_call:
    inputs:
      gradle-args:
        description: "Extra Gradle arguments (e.g., -PincrementMinor=true)"
        required: false
        default: ""
        type: string
      run-h3spec:
        description: "Run the h3spec HTTP/3 conformance lane against withHttp3Server (staged-dormant; needs buffer on Central)."
        required: false
        default: false
        type: boolean
      version:
        # REQUIRED, with no fallback to computing it here on purpose — see the matching note in
        # build-apple.yaml. An optional "compute it yourself" default would silently restore the
        # cross-job split this removes, and both branches produce a plausible-looking version.
        description: "The run's version, from the compute-version job. Pins every Gradle call here."
        required: true
        type: string

# Every job below shares this. Workflow-level (not a step export, not a per-job repeat) so it covers
# the FIRST Gradle invocation in each of them — there is no longer a version step to run first.
env:
  # Pins every Gradle invocation in this workflow to the run's single version. build.gradle.kts only
  # calls getNextVersion when no version was supplied from outside, so no Gradle call here touches
  # Central's metadata. These lanes publish nothing except `publish`, so a divergent version in a
  # test lane would not corrupt an artifact — but "one version per run" is only a useful invariant if
  # it has no exceptions, and each unpinned lane is one more live Maven Central fetch that can fail
  # or hang on a job whose whole point is to be reproducible.
  #
  # The ~86s `Get version` Gradle call that used to sit inside the job is gone; the query now happens
  # once per RUN in compute-version.yaml and arrives as `inputs.version`. #328 pinned it per job,
  # which fixed the within-a-job split that took down the JDK-25 link-check gate on #320 —
  # `nextVersion` read 4.2.1 at 20:06:57Z, v4.3.0 hit Central at 20:11:50Z, `publishToMavenLocal`
  # produced 4.3.1 at 20:24:14Z, and the gate hunted for jars at a version the build never emitted.
  # What #328 could NOT fix from inside one job is build-linux and build-apple disagreeing with each
  # other; that is what moving the query up to the run closes. See compute-version.yaml.
  # .github/actions/linux-quiche-env asserts this is non-empty before any Gradle call.
  ORG_GRADLE_PROJECT_version: ${{ inputs.version }}
  # Same value and same reasoning as build-apple.yaml:60 — and until now that was the ONLY lane in
  # the repo that set it, even though `timeScaleEnv()` has actuals for Linux
  # (socket-testsuite/src/linuxMain + socket-quic/src/linuxTest) and the JVM
  # (socket-testsuite/src/commonJvmMain + socket-quic/src/commonJvmTest). A loaded ubuntu runner
  # takes >10s for a QUIC handshake that is normally <1s, which trips the fixed test deadlines and
  # produces exactly the tail flakes tracked in #292 (partialReadHandling[linuxX64]). Scaling every
  # `.scaled` budget (TestHelpers.testTimeScale, clamped 1..10) by 3x gives a slow runner more
  # wall-clock WITHOUT weakening any assertion, ordering, or timing RATIO — the deterministic
  # ManualDriverClock sim tier is unaffected, since it never reads the wall clock.
  QUIC_TEST_TIME_SCALE: "3"

jobs:
  # ── Stage 1: build every quiche native this runner owns, exactly once ─────────────────────────
  # Linux is the cross-build host for more than Linux: linux-x64 + linux-arm64 (JVM .so + K/Native
  # .a + JNI shims), the Windows x64 JNI shim via MinGW, and the Android arm64 pair via cargo-ndk.
  # Everything downstream consumes the results as artifacts.
  #
  # This job is the SINGLE WRITER for the konan-linux / gradle-linux / gradle-wrapper-linux /
  # boringssl / openssl / liburing / quiche / cargo cache keys. Every fanned-out consumer restores
  # them read-only via .github/actions/linux-quiche-env, so a cache miss cannot turn into five
  # parallel jobs racing to upload the same key.
  # ⚠️ For the two Gradle keys that is now further narrowed to main's ref scope only — see the
  # `Restore Gradle …` steps below and their `Save … (main only)` twins at the end of this job.
  # The native keys (konan/boringssl/openssl/liburing/quiche/cargo) are still written from every
  # ref: they are keyed on content that rotates rarely, and a miss there costs a 10-20 minute
  # rebuild on the job every other job in this workflow waits for.
  natives:
    name: "quiche natives (Linux/Android/Windows)"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # NO `cache: gradle` here — see the Gradle cache steps below. setup-java's gradle cache
      # points at ~/.gradle/caches, byte-for-byte the same directory the explicit step already
      # saves, so enabling both stored that tree TWICE per run under two different keys.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      # accept-android-sdk-licenses is DISABLED here on purpose. The action's
      # built-in license pass (`sdkmanager --licenses`, run when this input is
      # true) doesn't just write license files — after accepting, sdkmanager
      # *completes* the runner image's pending Android Emulator package, which
      # downloads + unzips it from dl.google.com. That download intermittently
      # arrives truncated, so sdkmanager aborts with
      #   "Error reading Zip content from a SeekableByteChannel" -> exit 1
      # and the action has no retry, reddening the whole build-linux lane for a
      # transient network glitch (run 27561470552 attempt 1, step "Setup Android
      # SDK"). The package-install loop below (`tools platform-tools`) still
      # auto-accepts each package's own license via the action's stdin handler,
      # so the only thing deferred is the standalone all-licenses pass — which we
      # re-run with retry in the next step.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false

      # Accept the remaining SDK licenses with retry. `sdkmanager --licenses`
      # is idempotent and the emulator-package prep it triggers is exactly the
      # transient dl.google.com download that flakes above, so retry it with
      # backoff — same model as test-harness/compose-up-retry.sh absorbing
      # transient Docker Hub pulls. Finite `printf` of 'y' lines (not `yes |`,
      # which would hand pipefail a SIGPIPE 141 from the killed generator and
      # mask sdkmanager's real exit code) feeds the prompts.
      - name: Accept Android SDK licenses (retry transient package prep)
        run: |
          attempts=3
          for i in $(seq 1 "$attempts"); do
            if printf 'y\n%.0s' $(seq 1 50) | sdkmanager --licenses; then
              exit 0
            fi
            if [ "$i" -lt "$attempts" ]; then
              backoff=$((i * 15))
              echo "::warning::'sdkmanager --licenses' failed (attempt $i/$attempts) — likely a transient dl.google.com package-download corruption; retrying in ${backoff}s"
              sleep "$backoff"
            fi
          done
          echo "::error::Android SDK license acceptance failed after $attempts attempts"
          exit 1

      - name: Cache Konan
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-linux-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-linux-

      # Persist the local Gradle build cache (~/.gradle/caches/build-cache-1) across runs so
      # compiled Kotlin/Native klibs, cinterop klibs, and KSP/codegen outputs are reused instead
      # of rebuilt cold every run. Keyed on the build definition (version catalog, build scripts,
      # wrapper); restore-keys fall back to the most recent partial match. (mirrors buffer #232)
      #
      # This REPLACES setup-java's `cache: gradle` rather than supplementing it. The old comment
      # here claimed setup-java only restored modules-2 and not build-cache-1; that is false —
      # setup-java/src/cache.ts pins the gradle package manager to
      # `path: [join(os.homedir(), '.gradle', 'caches')]`, the whole tree. Running both therefore
      # bought nothing and cost a duplicate copy of this directory in the repo's Actions cache
      # (measured 2026-08-11: 264MB `setup-java-Linux-x64-gradle-*` alongside the 1373MB
      # `gradle-linux-*` below), which matters because the repo sits at the 10GB cap and the
      # resulting LRU eviction is what makes "cached" quiche natives still cost ~204s here.
      #
      # ⚠️ Post-fan-out caveat: this entry is now saved after the NATIVES build rather than after
      # the full test run, so on a key miss it is a colder tree than the old monolith stored. That
      # is the price of a single writer; the alternative (letting checks-tests save too) is N jobs
      # racing to upload the same key. Same trade build-apple.yaml took.
      #
      # ⚠️ RESTORE here, SAVE only on main (the two `Save Gradle …` steps at the end of this job).
      # A GitHub Actions cache entry is scoped to the ref that wrote it: a PR ref can read main's
      # entries, but main can never read a PR's, and a merged PR's entries linger for the 7-day idle
      # window evicting live ones. Measured 2026-08-12: 80.7% of this repo's 10GB cap was held by
      # already-merged PR refs, and the explicit gradle-* families were 3192MB of it — all on PR
      # refs, none on main. Writing this key only in main's ref scope (merged.yaml runs this
      # workflow on `pull_request_target: closed`, i.e. as main) gives every PR one warm entry to
      # prefix-restore instead of N per-ref copies of the same tree. Same pattern
      # gradle/actions/setup-gradle uses by default.
      - name: Restore Gradle build outputs
        id: restore_gradle_caches
        uses: actions/cache/restore@v6
        with:
          path: ~/.gradle/caches
          key: gradle-linux-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-linux-

      # Cached SEPARATELY from ~/.gradle/caches on purpose, mirroring what setup-java did (its
      # `additionalCaches: [{name: 'gradle-wrapper', ...}]`, added for actions/setup-java#269).
      # Folding ~/.gradle/wrapper into the step above would re-download the ~150MB Gradle
      # distribution on every `*.gradle.kts` edit, since that key rotates on build-script changes
      # while the wrapper itself changes only when the wrapper properties do.
      # No restore-keys: a prefix hit would hand back a DIFFERENT Gradle distribution than the
      # wrapper properties ask for, which gradlew would then re-download anyway.
      - name: Restore Gradle wrapper distribution
        id: restore_gradle_wrapper
        uses: actions/cache/restore@v6
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-linux-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Cache BoringSSL x64
        uses: actions/cache@v6
        with:
          path: libs/boringssl/linux-x64
          key: boringssl-linux-x64-v4-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Cache BoringSSL ARM64
        uses: actions/cache@v6
        with:
          path: libs/boringssl/linux-arm64
          key: boringssl-linux-arm64-v4-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Cache OpenSSL x64 (legacy fallback)
        uses: actions/cache@v6
        with:
          path: libs/openssl/linux-x64
          key: openssl-linux-x64-v5-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Cache OpenSSL ARM64 (legacy fallback)
        uses: actions/cache@v6
        with:
          path: libs/openssl/linux-arm64
          key: openssl-linux-arm64-v5-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Cache liburing x64
        uses: actions/cache@v6
        with:
          path: libs/liburing/linux-x64
          key: liburing-linux-x64-v1-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Cache liburing ARM64
        uses: actions/cache@v6
        with:
          path: libs/liburing/linux-arm64
          key: liburing-linux-arm64-v1-${{ hashFiles('gradle/libs.versions.toml') }}

      # No standalone apt-safe-update (here or at any apt-install-cached call site since
      # 2026-08-19): the action runs it itself, only when its cache cannot fully serve — so a warm
      # cache means zero mirror contact. The 1efafc4b lesson (a 403 from an unused third-party
      # source exit-100s `apt-get update`) still lives inside apt-safe-update, which is what the
      # action invokes on a miss.

      # The full manifest — this is the `natives` job, which builds every Linux/Windows artifact the
      # rest of the fan-out then downloads. Per-package rationale now lives in
      # .github/apt-packages.txt (libc6-dev-arm64-cross' Recommends trap, libclang for boring-sys'
      # bindgen, the mingw pair for the self-contained windows-x64 quiche build) so the seven other
      # call sites cannot drift from it.
      - name: Install cross-compilation toolchains
        uses: ./.github/actions/apt-install-cached
        with:
          purpose: "natives job: Linux + Windows cross toolchains"
          packages: >-
            build-essential perl pkg-config cmake nasm
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
            libclang-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Desktop cross targets + all four Android NDK targets. The Android targets
      # are needed by :socket-quic-quiche:buildAndroidJni* (cargo-ndk), which Gradle
      # transitively invokes from :socket-quic-quiche:linkDebugTestLinuxArm64 /
      # publishToMavenLocal even though this job runs on x64. Installing them
      # here (instead of leaving cargo-ndk to fail later inside the continue-
      # on-error \"Build quiche\" step) keeps the JNI build deterministic.
      - name: Add Rust cross-compile targets
        run: |
          rustup target add aarch64-unknown-linux-gnu x86_64-pc-windows-gnu \
              aarch64-linux-android armv7-linux-androideabi \
              x86_64-linux-android i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --quiet

      # Combined quiche + JNI shim cache — shims now live under
      # socket-quic-quiche/libs/quiche/<platform>/lib/ alongside libquiche.{so,a},
      # matching the local-dev path (createBuildQuicheSharedTask +
      # buildJvmJniShim*), so a single platform dir covers both outputs.
      # Hash quiche_jni.c too so shim edits invalidate the cache.
      - name: Cache quiche Linux x64
        uses: actions/cache@v6
        with:
          path: socket-quic-quiche/libs/quiche/linux-x64
          key: quiche-linux-x64-v8-${{ hashFiles('gradle/libs.versions.toml', 'socket-quic-quiche/build.gradle.kts', 'socket-quic-quiche/src/jni/quiche_jni.c') }}

      - name: Cache quiche Linux ARM64
        uses: actions/cache@v6
        with:
          path: socket-quic-quiche/libs/quiche/linux-arm64
          key: quiche-linux-arm64-v8-${{ hashFiles('gradle/libs.versions.toml', 'socket-quic-quiche/build.gradle.kts', 'socket-quic-quiche/src/jni/quiche_jni.c') }}

      # Cache the cargo target/ trees for all four quiche cross-compile
      # targets (Linux x64, Linux arm64, Windows x64, Android arm64). The
      # existing `Cache quiche Linux x64/arm64` entries above only preserve
      # the FINAL JNI shim outputs under socket-quic-quiche/libs/quiche/<platform>/
      # lib/ — they don't cover cargo's intermediate target/<triple>/release/
      # where libquiche.a is built. Without this, even on full cache-hit the
      # "Build quiche native libs" shell step unconditionally invokes cargo
      # for all four targets, recompiling the whole quiche crate from scratch
      # (~3-5 min × 4 targets). With target/ cached, cargo sees fingerprints
      # match and the build is near-instant. Also preserves the cloned quiche
      # source itself (saves ~5-30s git clone). Key includes the JNI shim
      # source hash so the cache invalidates on either change.
      # restore-keys gives a partial-hit on version bumps so cargo incremental
      # recompile picks up from the previous build instead of from zero.
      - name: Cache quiche cargo target/ (all triples)
        uses: actions/cache@v6
        with:
          path: socket-quic-quiche/build/quiche
          key: quiche-cargo-target-v3-${{ hashFiles('gradle/libs.versions.toml', 'socket-quic-quiche/build.gradle.kts', 'socket-quic-quiche/src/jni/quiche_jni.c') }}
          restore-keys: quiche-cargo-target-v3-

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Show pinned version
        run: echo "Building version ${ORG_GRADLE_PROJECT_version} (pinned for the whole run)"

      # BoringSSL is no longer built here: socket consumes the canonical :boringssl-canonical owner
      # klib + provision bundle (fetched on-demand by the quiche build below via boringssl.boringsslDir).
      - name: Build quiche native libs (all platforms from Linux)
        continue-on-error: true
        run: |
          set -e
          WS="${{ github.workspace }}"
          # Track the pinned quiche version from the catalog so the fallback clone below
          # never drifts from gradle/libs.versions.toml (was a hardcoded 0.28.0).
          QUICHE_VER=$(grep -E '^quiche[[:space:]]*=' gradle/libs.versions.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Pinned quiche version: $QUICHE_VER"
          JNI_SRC="$WS/socket-quic-quiche/src/jni/quiche_jni.c"
          QUICHE_H="$WS/socket-quic-quiche/libs/quiche/include"
          # JNI shims go next to libquiche.{so,a} under libs/quiche/<platform>/lib/
          # so the Gradle classifier-JAR pipeline (jvmNativesJar*) and jvmTest
          # stager pick them up from the same place local dev writes them.
          QUICHE_LIBS="$WS/socket-quic-quiche/libs/quiche"
          ANDROID_JNI="$WS/socket-quic-quiche/src/androidMain/jniLibs"

          # One cargo build per Linux triple: each shared task emits BOTH the JVM libquiche.so and the
          # K/Native libquiche.a (no separate static task). Builds x64 + arm64 (arm64 cross via the
          # aarch64 linker the shared task configures).
          ./gradlew :socket-quic-quiche:buildQuicheSharedLinuxX64 :socket-quic-quiche:buildQuicheSharedLinuxArm64 --no-configuration-cache || true

          # Ensure quiche source exists for JNI builds (Gradle may skip download on cache hit)
          QUICHE_DIR=$(find socket-quic-quiche/build/quiche -maxdepth 1 -name "quiche-*" -type d 2>/dev/null | head -1)
          if [ -z "$QUICHE_DIR" ]; then
            QUICHE_DIR="/tmp/quiche-src"
            git clone --recursive --depth 1 --branch "$QUICHE_VER" \
              https://github.com/cloudflare/quiche.git "$QUICHE_DIR"
          fi

          build_jni() {
            local TARGET=$1 CC=$2 STRIP=$3 DEST=$4 NAME=$5 EXTRA_LIBS=$6 BSSL_DIR=$7
            mkdir -p "$DEST"
            # Coherence-aware warm-cache skip (mirrors the gradle buildJvmJniShim onlyIf): if the shim
            # already exists and is NEWER than the sibling libquiche.so it links -lquiche against, it's up
            # to date — skip the recompile. actions/cache (tar) preserves mtimes, so a warm restore keeps
            # the shim newer than the .so. A shared-lib rebuild (e.g. a patched-quiche source change) bumps
            # libquiche.so's mtime ahead of the shim → this guard falls through and the shim relinks against
            # the fresh symbols. Without this the shim recompiled on every run regardless of cache.
            if [ -f "$DEST/$NAME" ] && [ -f "$DEST/libquiche.so" ] && [ "$DEST/$NAME" -nt "$DEST/libquiche.so" ]; then
              echo "Skipping $DEST/$NAME (up to date — newer than libquiche.so)"
              return
            fi
            # -fno-omit-frame-pointer: keep the frame pointer so a JVM hs_err / core backtrace can
            # unwind through the JNI shim (the JVM's native stack walker doesn't use DWARF CFI). This
            # is the CI counterpart of the gradle buildJvmJniShim task — CI builds the shim HERE, not
            # via that task, so it must mirror that task's linking (thin vs self-contained + symbols).
            local COMMON=(-shared -fPIC -fno-omit-frame-pointer -Wall -o "$DEST/$NAME" "$JNI_SRC"
              -I${JAVA_HOME}/include -I${JAVA_HOME}/include/linux -I"$QUICHE_H")
            if [ -f "$DEST/libquiche.so" ]; then
              # A self-contained libquiche.so is present (built by gradle buildQuicheShared*): link the
              # shim THIN against it (matches build.gradle.kts) so quiche + BoringSSL ship exactly once.
              # DT_NEEDED=libquiche.so (soname), resolved at load via RUNPATH $ORIGIN.
              $CC "${COMMON[@]}" -L"$DEST" -lquiche -lpthread -ldl -lm $EXTRA_LIBS \
                -Wl,-rpath,'$ORIGIN' -Wl,--no-undefined \
                && $STRIP "$DEST/$NAME" \
                && echo "Built (thin) $DEST/$NAME ($(du -h "$DEST/$NAME" | cut -f1))"
            else
              # No separate base lib for this arch: fall back to a SELF-CONTAINED shim (whole-archive
              # libquiche.a + BoringSSL), which loads standalone.
              local LIB=$(find "$QUICHE_DIR/target/$TARGET/release" -name "libquiche.a" 2>/dev/null | head -1)
              [ -z "$LIB" ] && echo "No libquiche.a for $TARGET" && return
              local ARCHIVES="$LIB"
              if [ -n "$BSSL_DIR" ] && [ -f "$BSSL_DIR/lib/libcrypto.a" ]; then
                ARCHIVES="$ARCHIVES $BSSL_DIR/lib/libcrypto.a $BSSL_DIR/lib/libssl.a"
              fi
              $CC "${COMMON[@]}" \
                -Wl,--whole-archive $ARCHIVES -Wl,--no-whole-archive \
                -Wl,--allow-multiple-definition \
                -lpthread -ldl -lm -lstdc++ $EXTRA_LIBS \
                && $STRIP "$DEST/$NAME" \
                && echo "Built (self-contained) $DEST/$NAME ($(du -h "$DEST/$NAME" | cut -f1))"
            fi
          }

          # Linux x64 JNI shim
          echo "=== Linux x64 JNI ==="
          BSSL="$WS/libs/boringssl/linux-x64"
          QUICHE_BSSL_PATH=$BSSL cargo build --release --package quiche \
            --target x86_64-unknown-linux-gnu --no-default-features --features ffi \
            --manifest-path "$QUICHE_DIR/Cargo.toml" 2>/dev/null || true
          # --strip-debug (NOT --strip-all): drop DWARF to keep the lib small but KEEP the .symtab
          # function names, so a native crash backtrace reads `...(Java_..._nConnRecv+0x..)` instead of
          # a bare `libquiche_jni.so+0xNNNN`. Matches socket-quic-quiche/build.gradle.kts.
          build_jni "x86_64-unknown-linux-gnu" "gcc" "strip --strip-debug" "$QUICHE_LIBS/linux-x64/lib" "libquiche_jni.so" "" "$BSSL"

          # Linux arm64 JNI shim
          echo "=== Linux arm64 JNI ==="
          BSSL_ARM="$WS/libs/boringssl/linux-arm64"
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
          QUICHE_BSSL_PATH=$BSSL_ARM cargo build --release --package quiche \
            --target aarch64-unknown-linux-gnu --no-default-features --features ffi \
            --manifest-path "$QUICHE_DIR/Cargo.toml" 2>/dev/null || true
          build_jni "aarch64-unknown-linux-gnu" "aarch64-linux-gnu-gcc" "aarch64-linux-gnu-strip --strip-debug" "$QUICHE_LIBS/linux-arm64/lib" "libquiche_jni.so" "" "$BSSL_ARM"

          # Windows x64 JNI shim (cross-compile via MinGW)
          echo "=== Windows x64 JNI ==="
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc \
            cargo build --release --package quiche \
            --target x86_64-pc-windows-gnu --no-default-features --features ffi,boringssl-boring-crate \
            --manifest-path "$QUICHE_DIR/Cargo.toml" 2>/dev/null || true
          WIN_LIB=$(find "$QUICHE_DIR/target/x86_64-pc-windows-gnu/release" -name "libquiche.a" 2>/dev/null | head -1)
          if [ -n "$WIN_LIB" ]; then
            mkdir -p "$QUICHE_LIBS/windows-x64/lib"
            x86_64-w64-mingw32-gcc -shared -Wall \
              -static-libgcc -static-libstdc++ \
              -o "$QUICHE_LIBS/windows-x64/lib/quiche_jni.dll" "$JNI_SRC" \
              -I${JAVA_HOME}/include -I${JAVA_HOME}/include/linux \
              -I"$QUICHE_H" \
              -Wl,--whole-archive "$WIN_LIB" -Wl,--no-whole-archive \
              -lws2_32 -lcrypt32 -lntdll -luserenv -lbcrypt -lm \
              -Wl,-Bstatic -lstdc++ -lpthread -Wl,-Bdynamic \
              && x86_64-w64-mingw32-strip --strip-all "$QUICHE_LIBS/windows-x64/lib/quiche_jni.dll" \
              && echo "Built Windows x64: $(du -h "$QUICHE_LIBS/windows-x64/lib/quiche_jni.dll" | cut -f1)"
          fi

          # Android arm64 native libs — built via Gradle (buildAndroidJni*) rather than a hand-rolled
          # cargo-ndk + clang duplicate, so CI can't drift from build.gradle.kts. The Gradle task emits
          # the dedup'd pair into src/androidMain/jniLibs/arm64-v8a/: a thin libquiche_jni.so
          # (DT_NEEDED=libquiche.so) beside a self-contained libquiche.so (unversioned soname). libclang
          # (installed above) satisfies boring-sys' bindgen; the NDK/cargo-ndk/targets are set up above.
          echo "=== Android arm64 (gradle) ==="
          ./gradlew :socket-quic-quiche:buildAndroidJniArm64v8a --no-configuration-cache || true

          echo "=== Done ==="
          find "$QUICHE_LIBS" "$ANDROID_JNI" -name "*.so" -o -name "*.dll" -o -name "*.dylib" 2>/dev/null

      - name: Verify JNI shims exist
        run: |
          echo "=== JVM native libs ==="
          find socket-quic-quiche/libs/quiche -name "libquiche_jni.*" -o -name "quiche_jni.dll" 2>/dev/null || echo "WARN: no JNI shims found"
          echo "=== Android native libs ==="
          find socket-quic-quiche/src/androidMain/jniLibs -type f 2>/dev/null || echo "No Android JNI (expected on Linux)"

      # ⚠️ FAN-OUT PREREQUISITE — writes the `.jni-built-<ver>` markers the hand-rolled shim build
      # above never writes.
      #
      # The shell script deliberately compiles quiche_jni.c itself ("CI builds the shim HERE, not via
      # that task"), so `libs/quiche/<platform>/lib/.jni-built-<ver>` — buildJvmJniShimLinux*'s skip
      # marker — is absent unless a warm cache restored one from an earlier run. In the monolith that
      # merely meant the Gradle task relinked the shim later in the SAME job, where the aarch64 cross
      # compiler was installed. Fanned out, a missing marker means every consumer that touches
      # prepareQuicheNativeLib / stageQuicheNativeResources relinks, and the linux-arm64 leg of that
      # needs aarch64-linux-gnu-gcc in a job that has no other reason to install it.
      #
      # Running the real Gradle tasks (rather than hand-stamping a marker file) keeps the contract
      # honest: the task itself decides the shim is current and writes its own marker, and the shim
      # that ends up in the artifact is byte-for-byte the one local dev and the monolith's later steps
      # produced (same -fno-omit-frame-pointer + `strip --strip-debug`, so the fuzz/malloc-check gdb
      # post-mortems still get NAMED quiche_jni frames). On a warm run it re-links two small .c files;
      # that is seconds, not minutes.
      #
      # continue-on-error mirrors the tolerance of the build step above: if buildQuicheSharedLinuxArm64
      # never produced libquiche.so, this task throws, and the right outcome is the same as before —
      # no marker, and the loud, specific failure comes from linux-quiche-env's `Verify Linux quiche
      # libs are present` check in the consumer, not from a cryptic link error here.
      - name: Build the JNI shims through Gradle too (writes the .jni-built markers)
        continue-on-error: true
        run: >-
          ./gradlew
          :socket-quic-quiche:buildJvmJniShimLinuxX64
          :socket-quic-quiche:buildJvmJniShimLinuxArm64
          --no-configuration-cache ${{ inputs.gradle-args }}

      # ⚠️ include-hidden-files IS LOAD-BEARING — do not drop it.
      # The consumers skip their cargo builds via `onlyIf { !markerFile.exists() || ... }`, and every
      # marker is a DOTFILE inside lib/ (`.built-<ver>-qlog-jvm-<digest>`, `.jni-built-<ver>`).
      # upload-artifact excludes hidden files by default, so without this the .so/.a files would
      # arrive WITHOUT their markers and every consumer would silently re-run the ~10-20 minute cargo
      # build — a green run that quietly costs more than the serial version it replaced.
      # .github/actions/linux-quiche-env fails loudly if the markers ever go missing.
      #
      # This is a SEPARATE artifact from `quiche-linux-natives` below, which validate-artifacts.yaml
      # consumes by name with a linux-only path. This one is the superset the fan-out needs
      # (linux-x64 + linux-arm64 + windows-x64 lib dirs, markers included); that one keeps its exact
      # existing name and path so nothing downstream has to change.
      - name: Upload quiche natives for the fanned-out jobs
        id: upload_natives
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: quiche-linux-natives-full
          # Least common ancestor of the matched files is socket-quic-quiche/libs/quiche, so the
          # artifact holds <platform>/lib/... and the consumers download it back to that same dir.
          path: socket-quic-quiche/libs/quiche/*/lib/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

      # ⚠️ Two-attempt upload. `actions/upload-artifact` classifies a 403 from the storage
      # intermediary at FinalizeArtifact as NON-retryable and gives up immediately. Here that would
      # fail the natives job and skip EVERY job in this workflow, so the retry matters more than it
      # did when this was one job. Observed 2026-08-10 on run 31422985484 (Apple side).
      - name: Upload quiche natives for the fanned-out jobs (retry after transient finalize failure)
        if: steps.upload_natives.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: quiche-linux-natives-full
          path: socket-quic-quiche/libs/quiche/*/lib/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      - name: Upload Android native libs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-native-libs
          path: |
            socket-quic-quiche/src/androidMain/jniLibs/
          retention-days: 1
          if-no-files-found: ignore

      # Symmetric to build-apple.yaml's quiche-macos-natives. The publish step
      # below uploads maven-local with the JAR but Gradle doesn't (currently)
      # stage native libs into META-INF/native/<platform>/ at publish time —
      # validate-artifacts.yaml injects them post-merge from this artifact.
      - name: Upload quiche Linux native libs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quiche-linux-natives
          path: socket-quic-quiche/libs/quiche/linux-*/lib/
          retention-days: 1
          if-no-files-found: ignore

      # The Windows x64 JNI shim is cross-compiled above (MinGW) but the
      # conformance suite runs on a separate windows-latest job (review.yaml's
      # build-windows). Hand the DLL across via this artifact so that job can
      # stage it and run :socket-quic-quiche:jvmTest. if-no-files-found: ignore keeps
      # the Linux job green if the cross-compile didn't produce the DLL.
      - name: Upload quiche Windows native lib
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quiche-windows-natives
          path: socket-quic-quiche/libs/quiche/windows-x64/lib/quiche_jni.dll
          retention-days: 1
          if-no-files-found: ignore

      # Surface the quiche cargo build transcript when this job failed, so a build failure (e.g. a
      # missing rustup cross target → E0463) is diagnosable from an artifact instead of hunting
      # through interleaved BoringSSL/cargo output in the job log.
      - name: Upload quiche build logs on failure
        if: ${{ failure() || cancelled() }}
        continue-on-error: true # an upload hiccup must not mask the failure it was capturing
        uses: actions/upload-artifact@v7
        with:
          name: quiche-build-logs-linux
          path: '**/build/quiche-build-logs/'
          if-no-files-found: ignore
          retention-days: 7

      # ── The write half of the restore-only Gradle caches at the top of this job ──────────────
      # Only in main's ref scope. merged.yaml calls this workflow on `pull_request_target: closed`,
      # where github.ref is refs/heads/main, so main is rewritten on every merge and every PR
      # prefix-restores it. See the note on the restore steps for why per-PR-ref copies were the
      # single largest consumer of the repo's 10GB cache cap.
      #
      # `!cancelled()` rather than `success()`: actions/cache's post-step saved on failure too, and
      # the dependency metadata resolved before a cargo failure is still valid and worth keeping.
      # continue-on-error: a save whose key already exists warns rather than fails, and a cache
      # problem must never redden the natives job — every consumer is `needs:` on it.
      #
      # ⚠️ The `cache-hit != 'true'` guard is NOT redundant with continue-on-error, and splitting
      # actions/cache into restore+save is exactly what makes it necessary. The full action knows it
      # restored an EXACT primary-key hit and skips its own post-save; `actions/cache/save` has no
      # such knowledge and re-saves every run. @actions/cache tars the directory FIRST and only then
      # reserves the entry, so on the common already-cached main run these steps would tar 258MB-1GB
      # of ~/.gradle/caches and only then discover the key is taken — wall time burned every run and
      # silently swallowed by continue-on-error. `cache-hit` is true only on an exact primary-key
      # match (a restore-keys prefix hit leaves it false), which is precisely the case where a
      # re-save is impossible anyway: cache entries are immutable per key.
      - name: Save Gradle build outputs (main only)
        id: save_gradle_caches
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.restore_gradle_caches.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.gradle/caches
          key: gradle-linux-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Save Gradle wrapper distribution (main only)
        id: save_gradle_wrapper
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.restore_gradle_wrapper.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-linux-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      # `continue-on-error: true` above is deliberate — a cache-save problem must never redden the
      # job every other job is `needs:` on — but it also rewrites a FAILED step's `conclusion` to
      # `success`. That masking is not hypothetical: both saves above had been failing on every
      # single release run with
      #     cache write denied: token has no writable scopes
      # while the step list showed two green checks, so `gradle-linux-*` and
      # `gradle-wrapper-linux-*` never existed at all and every fanned-out job cold-bootstrapped
      # Gradle (see native-deps-freshness.yaml's cache-warm job, which now owns writing them).
      # `outcome` keeps the pre-masking result, so read that. Annotation only, never `exit 1`:
      # the whole point is to stay non-fatal while ceasing to be invisible.
      - name: Surface a masked cache-save failure
        if: ${{ !cancelled() && (steps.save_gradle_caches.outcome == 'failure' || steps.save_gradle_wrapper.outcome == 'failure') }}
        run: |
          echo "::warning::A Gradle cache SAVE failed here and continue-on-error hid it (caches=${{ steps.save_gradle_caches.outcome }}, wrapper=${{ steps.save_gradle_wrapper.outcome }}). Expected on the merged.yaml/pull_request_target path, whose token the cache service refuses; native-deps-freshness.yaml's cache-warm job is the real writer. If THAT job stops warming, every Linux job re-downloads the Gradle distribution and the fan-out stampedes services.gradle.org."

  # ── Stage 2a: the main compile + unit/integration suite ──────────────────────────────────────
  # Keeps the monolith's job NAME so the branch-protection check and every run-history comparison
  # still line up. Everything here shares one Gradle invocation and one live Docker harness; the
  # steps that bring that harness's peers up (aioquic HTTP/3 + WebTransport server, ls-qpack QPACK
  # oracle) and the netns route-resolution lanes that read this job's freshly-linked
  # network-monitor .kexe CANNOT be moved out — see the harness note at the top of this file.
  checks-tests:
    name: "Linux / JVM / JS / Android"
    needs: natives
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Every jvmTest worker in this job mirrors its JVM fatal-error log (hs_err) to
    # stderr so a native crash (the intermittent JNI SIGABRT) is fully visible in
    # the live job log, not just an opaque exit 134. See socket-quic-quiche/build.gradle.kts.
    env:
      ORG_GRADLE_PROJECT_quicCrashDiag: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-quiche-env

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2

      # accept-android-sdk-licenses is DISABLED here on purpose. The action's
      # built-in license pass (`sdkmanager --licenses`, run when this input is
      # true) doesn't just write license files — after accepting, sdkmanager
      # *completes* the runner image's pending Android Emulator package, which
      # downloads + unzips it from dl.google.com. That download intermittently
      # arrives truncated, so sdkmanager aborts with
      #   "Error reading Zip content from a SeekableByteChannel" -> exit 1
      # and the action has no retry, reddening the whole build-linux lane for a
      # transient network glitch (run 27561470552 attempt 1, step "Setup Android
      # SDK"). The package-install loop below (`tools platform-tools`) still
      # auto-accepts each package's own license via the action's stdin handler,
      # so the only thing deferred is the standalone all-licenses pass — which we
      # re-run with retry in the next step.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false

      # Accept the remaining SDK licenses with retry. `sdkmanager --licenses`
      # is idempotent and the emulator-package prep it triggers is exactly the
      # transient dl.google.com download that flakes above, so retry it with
      # backoff — same model as test-harness/compose-up-retry.sh absorbing
      # transient Docker Hub pulls. Finite `printf` of 'y' lines (not `yes |`,
      # which would hand pipefail a SIGPIPE 141 from the killed generator and
      # mask sdkmanager's real exit code) feeds the prompts.
      - name: Accept Android SDK licenses (retry transient package prep)
        run: |
          attempts=3
          for i in $(seq 1 "$attempts"); do
            if printf 'y\n%.0s' $(seq 1 50) | sdkmanager --licenses; then
              exit 0
            fi
            if [ "$i" -lt "$attempts" ]; then
              backoff=$((i * 15))
              echo "::warning::'sdkmanager --licenses' failed (attempt $i/$attempts) — likely a transient dl.google.com package-download corruption; retrying in ${backoff}s"
              sleep "$backoff"
            fi
          done
          echo "::error::Android SDK license acceptance failed after $attempts attempts"
          exit 1

      # Harness-backed tests use the in-repo Docker stack (`docker compose up`
      # is wired via Gradle's harnessUp/harnessDown tasks). The TLS server
      # certs are generated by this script; we inject the harness root CA into
      # both the OS trust store (BoringSSL/K-N read /etc/ssl/certs) and the JVM
      # keystore (JSSE reads $JAVA_HOME/lib/security/cacerts) so tlsDefault()
      # accepts the harness cert chain.
      - name: Generate harness TLS certs
        run: bash test-harness/tls/gen-certs.sh

      - name: Trust harness CA (Linux)
        run: |
          sudo cp test-harness/tls/certs/ca.crt /usr/local/share/ca-certificates/harness-root.crt
          sudo update-ca-certificates

      - name: Trust harness CA in JVM keystore (Linux)
        run: |
          sudo keytool -delete -alias harness-root \
              -keystore "$JAVA_HOME/lib/security/cacerts" \
              -storepass changeit 2>/dev/null || true
          sudo keytool -importcert -trustcacerts \
              -file test-harness/tls/certs/ca.crt \
              -alias harness-root \
              -keystore "$JAVA_HOME/lib/security/cacerts" \
              -storepass changeit -noprompt

      # NOTE: :jsTest above is the ROOT project's JS suite. :socket-quic:jsNodeTest
      # is a SEPARATE task (the socket-quic module's common QUIC suite + JS gap
      # tests, running on Node) that was never wired in — so Node QUIC went
      # entirely unvalidated in CI (#74 Task 2). It needs no native quiche (the
      # JS impls are documented placeholders that throw), so it just rides the
      # Node already on this runner. wasmJsNodeTest is now wired alongside
      # jsNodeTest (same Node runtime, no raw UDP needed — the JS/Wasm QUIC impls
      # are documented placeholders): the wasmJs target shipped real common tests
      # that had NEVER run in CI on any module. Validated green locally (root +
      # socket-quic + socket-http3). Browser (jsBrowserTest/wasmJsBrowserTest)
      # still stays out — it needs a headless Chrome the Linux runner lacks.
      # :socket-http3 is a pure-Kotlin HTTP/3 layer on :socket-quic. Its deterministic
      # codec/connection suite + the in-process loopback run on jvm, jsNode, and linuxX64
      # (the live interop GET self-skips when the endpoint is unreachable). Wiring these
      # here keeps the published socket-http3 artifact gatekept by CI — otherwise the module
      # would publish (root publishToMavenLocal includes it) but go entirely unvalidated,
      # the same gap #74/#76 fixed for socket-quic's JS suite.
      # Start the third-party HTTP/3 + WebTransport server (aioquic + lsqpack, built from
      # socket-http3/docker-interop) so the foreign-stack interop tests bundled in :socket-http3:jvmTest
      # below — Http3DockerInteropTests (QPACK eviction) and WebTransportDockerInteropTests (WT bidi
      # echo) — actually RUN instead of self-skipping on an unreachable 127.0.0.1:4433. These are our
      # ONLY checks against a foreign stack: the in-process loopback round-trips our client through our
      # OWN server, so a bug symmetric across both halves would hide. `start` is detached and blocks
      # until the server logs it is serving, so the tests have a provably-up peer. A build/start failure
      # fails the job on purpose — the alternative (silently skipping) is exactly the gap this closes.
      - name: Start HTTP/3 + WebTransport interop server (aioquic)
        run: socket-http3/docker-interop/run-server.sh start

      # Start the ls-qpack (pylsqpack) DIFFERENTIAL oracle on 127.0.0.1:4434 so
      # QpackDifferentialInteropTests (bundled in :socket-http3:jvmTest below) RUNS
      # instead of self-skipping. It cross-checks our hand-rolled QPACK encoder
      # against an independent implementation — our only differential QPACK check
      # (the in-process round-trip would hide a bug symmetric across our own
      # encode+decode). `start` is detached and blocks until the oracle logs ready,
      # so the test has a provably-up peer; a build/start failure fails the job on
      # purpose, same as the aioquic server above (a silent skip is the gap this
      # closes). Validated live previously vs pylsqpack 0.3.24 (1200 round-trips).
      - name: Start QPACK differential oracle (ls-qpack)
        run: socket-http3/qpack-diff/run-qpack-diff.sh start

      # HANG DIAGNOSTIC (temporary): a progress-watchdog wraps the gradle run. If gradle
      # emits no new output for 7 min the build is deadlocked (the failure mode seen on
      # PR #246: harness up, all tests start, then ~46 min of silence until the 60-min job
      # cap — 5 JVM workers + a native test.kexe orphaned). The watchdog dumps every JVM
      # test worker (jstack -l, with lock info) AND every native debugTest/test.kexe
      # (gdb thread apply all bt), then kills the build so the step FAILS FAST with the
      # exact deadlocked stacks in the log instead of an opaque timeout. The full dump is
      # also uploaded as an artifact by the step below.
      #
      # -PquicEchoAllArches=true stays on this invocation: harnessUp dependsOn quicEchoJar, so the
      # quic-echo container this job's harness serves is built INSIDE this gradle call with both
      # linux arches staged, exactly as when the explicit `Build multi-arch quic-echo fat jar` step
      # ran first in the monolith. That step now lives in `link`, which is where the uploaded
      # quic-echo-docker-context comes from.
      - name: Run checks and tests
        timeout-minutes: 45
        env:
          # Inventory came back empty on this lane; a skip here means a broken environment, not an
          # accommodation. See .github/actions/skip-inventory.
          SOCKET_REQUIRE_ALL_TESTS: "1"
        run: |
          set -o pipefail
          command -v gdb >/dev/null 2>&1 || sudo apt-get install -y gdb >/dev/null 2>&1 || true
          LOG=/tmp/gradle-out.log
          DUMP=/tmp/hang-threaddump.txt
          : > "$LOG"
          (
            while sleep 30; do
              [ -f "$LOG" ] || continue
              now=$(date +%s); mtime=$(stat -c %Y "$LOG" 2>/dev/null || echo "$now")
              idle=$(( now - mtime ))
              # 15 min of TOTAL output silence = deadlocked (the real hang is ~46 min silent);
              # a slow-but-healthy native link/test suite is never quiet this long.
              if [ "$idle" -ge 900 ]; then
                {
                  echo "################ HANG WATCHDOG: no gradle output for ${idle}s — dumping stacks ################"
                  date -u
                  echo "== processes =="
                  ps -eo pid,rss,etimes,comm,args | grep -E 'GradleWorkerMain|GradleDaemon|test\.kexe|java|kotlin' | grep -v grep || true
                  for p in $(pgrep -f 'GradleWorkerMain' 2>/dev/null); do
                    echo "===== jstack (JVM worker) pid=$p ====="; jstack -l "$p" 2>&1 || true
                  done
                  for p in $(pgrep -f 'test\.kexe' 2>/dev/null); do
                    echo "===== gdb backtrace (native) pid=$p ====="
                    sudo gdb -p "$p" -batch -ex 'thread apply all bt' 2>&1 | head -500 || true
                  done
                  echo "################ END WATCHDOG DUMP ################"
                } | tee -a "$DUMP" | tee -a "$LOG"
                # Kill the build so the step fails fast now that we have the stacks.
                pkill -f 'GradleWorkerMain' 2>/dev/null || true
                pkill -f 'test\.kexe' 2>/dev/null || true
                pkill -f 'GradleDaemon' 2>/dev/null || true
                break
              fi
            done
          ) &
          WD=$!
          ./gradlew :jvmTest :jsTest :wasmJsNodeTest :linuxX64Test :testDebugUnitTest :ktlintCheck \
            :network-monitor:jvmTest :network-monitor:jsNodeTest :network-monitor:testDebugUnitTest :network-monitor:linuxX64Test :network-monitor:ktlintCheck \
            :network-monitor:netnsJvmProbeClasspath \
            :socket-quic:jsNodeTest :socket-quic:wasmJsNodeTest \
            :socket-quic-quiche:jvmProcessResources \
            :socket-quic:ktlintCheck :socket-quic-quiche:ktlintCheck :socket-quic-default:ktlintCheck \
            :socket-http3:jvmTest :socket-http3:jsNodeTest :socket-http3:wasmJsNodeTest :socket-http3:linuxX64Test \
            :socket-http3:testDebugUnitTest :socket-http3:ktlintCheck \
            :socket-webtransport:jvmTest :socket-webtransport:linuxX64Test :socket-webtransport:ktlintCheck \
            :socket-udp:jvmTest :socket-udp:testDebugUnitTest :socket-udp:jsNodeTest :socket-udp:linuxX64Test :socket-udp:ktlintCheck \
            -PquicEchoAllArches=true \
            --no-configuration-cache ${{ inputs.gradle-args }} 2>&1 | tee -a "$LOG"
          RC=${PIPESTATUS[0]}
          kill "$WD" 2>/dev/null || true
          exit "$RC"

      - name: Upload hang thread-dump (if any)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hang-threaddump-linux
          path: /tmp/hang-threaddump.txt
          if-no-files-found: ignore

      # Inventory whatever this lane skipped. Reports only — the gate is SOCKET_REQUIRE_ALL_TESTS=1,
      # which goes on once a lane's inventory reads clean.
      - uses: ./.github/actions/skip-inventory
        if: ${{ !cancelled() }}

      # Exercise the REAL Linux route-resolution paths against controlled network namespaces — the
      # integration paths unit tests cannot reach (netlink always answers on a normal host, so the
      # fallback tier never runs and the route table is whatever the host has). Two implementations run
      # in each namespace: the native LinuxNetworkMonitor (netlink RTM_GETROUTE, the /proc/net/{route,
      # ipv6_route} fallbacks, the getifaddrs scan, /sys link-kind classification) via the .kexe, and the
      # desktop-JVM :network-monitor resolvers (commonJvmMain JvmNetworkId + jvm21 FFM NetlinkNetworkMonitor)
      # via NetnsJvmProbe. Rootless via `unshare -rnm`; :network-monitor:linuxX64Test above linked the
      # .kexe and :network-monitor:netnsJvmProbeClasspath dumped the JVM classpath + JDK21 launcher the
      # harness reads. The binary is :network-monitor's, not the root project's: issue #269 moved
      # LinuxNetworkMonitor and enumerateNetworkInterfaces() there together.
      # (Both netns steps therefore MUST stay in this job — they read a build output of the gradle
      # call above, and nothing uploads that .kexe.)
      - name: NetworkMonitor route resolution — netns integration (Linux)
        run: |
          chmod +x test-harness/netns/run-netns-tests.sh
          ./test-harness/netns/run-netns-tests.sh \
            network-monitor/build/bin/linuxX64/debugTest/test.kexe

      # The one NetworkKind branch the rootless route harness can't reach: Wi-Fi (classifyLinkKind keys it
      # on a /sys phy80211 entry that dummy/tun devices never have). Load mac80211_hwsim to get a real
      # wlan and assert it classifies as Wifi. Privileged (kernel module) + best-effort: skips (exit 0) if
      # the module isn't available on the runner — the Wi-Fi branch is also covered by unit tests.
      - name: Wi-Fi link-kind classification — mac80211_hwsim (Linux, best-effort)
        run: |
          chmod +x test-harness/netns/run-wifi-classify.sh
          ./test-harness/netns/run-wifi-classify.sh \
            network-monitor/build/bin/linuxX64/debugTest/test.kexe

      # QUIC path migration OFF A PATH THAT DIES — the condition no other test in this repo can
      # express. Every migration suite migrates away from a *healthy* path: QuicActiveMigrationTestSuite
      # calls migrate() with no target, a local PORT change on loopback where 127.0.0.1 never dies, which
      # is why #393 needed a 124-minute on-device recording to find. A rootless namespace supplies the
      # three ingredients loopback cannot: the client's local ADDRESS changes, the old path DIES (the
      # probe downs eth-a mid-stream, revoking its address), and the stream is CARRYING DATA across it.
      # Asserts byte-exact continuity, not "the connection survived" — the latter is precisely what
      # failed to catch #393, where the connection lived 101 minutes while the stream was dead.
      # Reads socket-quic-quiche/build/netns/ from the gradle call above, so it MUST stay in this job.
      - name: QUIC migration off a dead path — netns integration (Linux)
        run: |
          .github/scripts/gradle-retry.sh :socket-quic-quiche:netnsQuicProbeClasspath
          chmod +x test-harness/netns/run-netns-quic-migration.sh
          ./test-harness/netns/run-netns-quic-migration.sh

      - name: Stop HTTP/3 QPACK interop server
        if: always()
        run: socket-http3/docker-interop/run-server.sh stop

      - name: Stop QPACK differential oracle
        if: always()
        run: socket-http3/qpack-diff/run-qpack-diff.sh stop

      # HTTP/3 error-path conformance (Phase 2 STEP 2): probe the PRODUCTION withHttp3Server with the
      # external h3spec client (socket-http3/h3spec) to externally prove the typed Http3Violation error
      # codes the deterministic Http3ServerConnectionTests assert in-process. STAGED-BUT-DORMANT: gated
      # off by default (run-h3spec=false) and the branch is buffer-blocked; flip run-h3spec=true to enable
      # this lane once it's proven. See socket-http3/h3spec/README.md.
      - name: HTTP/3 conformance (h3spec vs withHttp3Server) [staged-dormant]
        if: ${{ inputs.run-h3spec }}
        run: socket-http3/h3spec/run-h3spec.sh

      # Node/JS runs the SAME common QuicHarnessIntegrationTests (via the earlier
      # :socket-quic:jsNodeTest step), but QUIC isn't implemented on JS yet, so
      # every harness test self-skips with a "platform unsupported" marker —
      # intentional, like the Apple-simulator gate. Audit Node as its OWN matrix
      # lane and count those as intentional skips, so the interop summary renders
      # it "ℹ️ platform gap (known)". This is the fix for the false "all skipped":
      # the JS skips used to be swept into the JVM lane (the old audit grepped the
      # whole test-results tree) and failed the summary. jsNodeTest's results are
      # written before the JVM steps and never overwritten, so no snapshot needed.
      # (The JVM half of this audit now lives in the `quiche-jvm` job, which is where
      # socket-quic-quiche/build/test-results/jvmTest is produced.)
      - name: Audit QUIC harness coverage on Node (JS)
        if: always()
        continue-on-error: true
        run: |
          REPORT_ROOT=socket-quic/build/test-results/jsNodeTest
          OK=$(grep -rh 'harness OK' "$REPORT_ROOT" 2>/dev/null | wc -l | tr -d ' ')
          SKIP=$(grep -rh 'harness SKIP' "$REPORT_ROOT" 2>/dev/null | wc -l | tr -d ' ')
          # Skips via the "platform unsupported" marker are the known JS gap, not
          # a regression — counted as intentional so the summary renders ℹ️.
          INTENTIONAL=$(grep -rh 'harness SKIP: platform unsupported' "$REPORT_ROOT" 2>/dev/null | wc -l | tr -d ' ')
          SKIP_REASONS=$(grep -rhoE 'harness SKIP: [^<&]+' "$REPORT_ROOT" 2>/dev/null \
            | sed -E 's/^harness SKIP: //' | sort | uniq -c | sed -E 's/^ *//' | sort -rn)
          echo "QuicHarnessIntegrationTests on Node (JS): OK=$OK, SKIP=$SKIP, INTENTIONAL=$INTENTIONAL"
          [ -n "$SKIP_REASONS" ] && echo "Skip reasons:" && echo "$SKIP_REASONS"

          mkdir -p /tmp/quic-audit
          # applicable=false → the quiche QuicHarnessIntegrationTests does not run on JS:
          # it lives in socket-quic-quiche (no JS Kotlin target), and JS has no QUIC
          # implementation at all (wasm/BoringSSL blocked). So `OK=0,SKIP=0` here is
          # structural, not a regression. Mark the lane not-applicable ONLY when zero
          # markers appeared (a future real marker still audits normally) so the interop
          # summary renders a known ℹ️ gap rather than a false ❌ "no markers despite launch".
          APPLICABLE=true
          if [ "$OK" = "0" ] && [ "$SKIP" = "0" ]; then
            APPLICABLE=false
          fi
          cat > /tmp/quic-audit/js.txt <<EOF
          platform=js
          launched=true
          applicable=$APPLICABLE
          ok=$OK
          skip=$SKIP
          intentional_skip=$INTENTIONAL
          EOF
          if [ "$APPLICABLE" = "false" ]; then
            echo 'reason=1 JS has no QUIC implementation (wasm/BoringSSL blocked) and the quiche QuicHarnessIntegrationTests has no JS target' \
              >> /tmp/quic-audit/js.txt
          fi
          if [ -n "$SKIP_REASONS" ]; then
            while IFS= read -r line; do printf 'reason=%s\n' "$line"; done <<< "$SKIP_REASONS" \
              >> /tmp/quic-audit/js.txt
          fi

          {
            echo "## QUIC harness — Node (JS)"
            echo ""
            echo "| OK | SKIP | INTENTIONAL |"
            echo "|---|---|---|"
            echo "| $OK | $SKIP | $INTENTIONAL |"
            if [ -n "$SKIP_REASONS" ]; then
              echo ""
              echo "<details><summary>Skip reasons (Node JS)</summary>"
              echo ""
              echo '```'
              echo "$SKIP_REASONS"
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Node (JS) QUIC audit artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quic-audit-js
          path: /tmp/quic-audit/js.txt
          retention-days: 1
          if-no-files-found: warn

      # Test reports on failure — surfaces the full assertion message + stack
      # trace that gradle's brief CI log otherwise truncates to
      # `AssertionError at Assert.java:89`. Indispensable for diagnosing the
      # next harness flake without having to push a re-run with debug prints.
      # Also collect JVM fatal-error logs from a native crash (SIGABRT/SIGSEGV in quiche/JNI/FFM):
      # the test process writes hs_err_pid*/replay_pid* to its cwd, which the JUnit XML never
      # captures — without these a native abort is an invisible "exit 134". This is what lets us
      # diagnose the intermittent :socket-quic-quiche:jvmTest SIGABRT instead of guessing. The core dumps +
      # gdb backtraces + the symbol-bearing JNI shim let us reconstruct the crash fully offline.
      # (The :socket-quic-quiche:jvmTest half of that story now uploads from the `quiche-jvm` job,
      # under test-reports-linux-quiche-jvm-<leg>; this artifact keeps its exact name.)
      - name: Upload test reports (on failure)
        if: ${{ failure() || cancelled() }}
        continue-on-error: true # an upload hiccup must not mask the failure it was capturing
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-linux
          # Report globs are module-agnostic on purpose: a hand-kept module list silently drops
          # the one module that failed (this artifact missed :socket-http3's XML this way when
          # its jvmTest flaked on the 2026-07-02 release run).
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/hs_err_pid*.log
            **/replay_pid*.log
            /tmp/cores/core.*
            /tmp/cores/bt/*.txt
            socket-quic-quiche/libs/quiche/linux-x64/lib/libquiche_jni.so
          retention-days: 7
          if-no-files-found: ignore

  # ── Stage 2b: the three :socket-quic-quiche JVM backends ─────────────────────────────────────
  # These were three sequential steps in the monolith purely because they shared a job. They are
  # independent — the `if: !cancelled()` the FFM and JDK-17 steps carried existed to express exactly
  # that: "the two backends are independent and a native abort in one must not blind us to the
  # other. Without it, an intermittent JNI SIGABRT skips the entire FFM run, so we never learn
  # whether the crash is JNI-only", and on the JDK-17 step, "independent of an earlier backend's
  # crash, so all three backend runs always report". Three parallel legs with fail-fast:false say
  # the same thing structurally, and can no longer be undone by an edit to a single step's `if:`.
  #
  # Each leg brings up its OWN Docker harness: :socket-quic-quiche:jvmTest dependsOn(harnessUp) in
  # root build.gradle.kts, so `docker compose up` happens inside the gradle call. That is why the
  # harness TLS cert + CA-trust steps are repeated here rather than shared with checks-tests.
  quiche-jvm:
    name: "QUIC quiche JVM (${{ matrix.leg.name }})"
    needs: natives
    runs-on: ubuntu-24.04
    # 40, not 25: the step lid below is now 24 (see its note on QUIC_TEST_TIME_SCALE=3), and a job
    # timeout at or below the step timeout would fire first, which is the failure mode the step lid
    # exists to prevent — the job dies without ever running the report-upload steps.
    timeout-minutes: 40
    # quicCrashDiag mirrors any JVM fatal-error log (hs_err) to stderr and arms the
    # recv_info UAF lifecycle guard on the forked jvmTest worker.
    env:
      ORG_GRADLE_PROJECT_quicCrashDiag: "1"
      QUIC_MIGRATION_REQUIRE_RUN: "1"
    strategy:
      # One leg's failure must not cancel the others — with fail-fast the first red backend hides
      # whether the rest would have passed, which is the single most useful thing to know when
      # triaging an intermittent native abort.
      fail-fast: false
      matrix:
        leg:
          # The default jvmTest run exercises the JNI backend on JDK 21 (loadQuicheApi()
          # resolves to the base commonJvmMain loader — the java21/FFM output is not on
          # the Test classpath). QUIC_MIGRATION_REQUIRE_RUN=1 (job env) turns a clean skip of
          # QuicMigrationLoopbackTests into a hard failure here, where the native is
          # built fresh and 127.0.0.2 is bindable, so a broken native can't pass as green.
          #
          # `core-dump: true` on this leg only: this is the lane where the intermittent JNI SIGSEGV
          # (recv_info UAF) was first caught, so it arms core capture + --no-daemon.
          - name: "JNI"
            args: ""
            sim-fuzz: "2000"
            jdk17: "false"
            core-dump: "true"
            audit: "false"
          # Same suite on the FFM backend. -PquicheJvmBackend=ffm prepends the java21
          # (FFM) output so its loader shadows the base JNI one, then loads the
          # self-contained shim via Panama. This is the only CI run that exercises
          # FfmQuicheApi — including the FFM migration path (the in-repo FFM server +
          # client), which had a SIGSEGV that the old silent JNI fallback hid.
          - name: "FFM"
            args: "-PquicheJvmBackend=ffm"
            sim-fuzz: "2000"
            jdk17: "false"
            core-dump: "false"
            audit: "false"
          # JNI backend on a JDK 17 launcher (the runtime Android / legacy-JVM
          # consumers actually use). The build/toolchain stays on 21; only this Test
          # task runs on 17, found via the JAVA_HOME_17_X64 install from setup-java.
          # The java21/FFM classes aren't on the JNI classpath, so there is no
          # UnsupportedClassVersionError. Proves connNewScid + sockaddr decode +
          # server routing on the JNI shim at runtime on JDK < 21.
          #
          # `audit: true` on this leg only, keeping the monolith's semantics: the harness
          # audit "captures the JDK17 backend run (the last full jvmTest)". Auditing exactly
          # one leg also keeps the `quic-audit-linux-jvm` artifact name unique across the
          # matrix — review.yaml / merged.yaml collect `quic-audit-*` with merge-multiple.
          #
          # SIM_FUZZ_ITERATIONS is deliberately NOT set here, matching the monolith: the
          # deep-fuzz lane rides the two JDK-21 backends only.
          - name: "JDK 17 / JNI"
            args: "-PjvmTestLauncher=17 -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64"
            sim-fuzz: ""
            jdk17: "true"
            core-dump: "false"
            audit: "true"
    steps:
      - uses: actions/checkout@v7
      # konan: false — this lane is JVM-only, so restoring the ~450MB Kotlin/Native toolchain would
      # be download cost for nothing. jdk17 only on the leg that needs a 17 launcher.
      - uses: ./.github/actions/linux-quiche-env
        with:
          konan: "false"
          jdk17: ${{ matrix.leg.jdk17 }}

      # Harness-backed tests use the in-repo Docker stack (`docker compose up`
      # is wired via Gradle's harnessUp/harnessDown tasks). The TLS server
      # certs are generated by this script; we inject the harness root CA into
      # both the OS trust store (BoringSSL/K-N read /etc/ssl/certs) and the JVM
      # keystore (JSSE reads $JAVA_HOME/lib/security/cacerts) so tlsDefault()
      # accepts the harness cert chain.
      - name: Generate harness TLS certs
        run: bash test-harness/tls/gen-certs.sh

      - name: Trust harness CA (Linux)
        run: |
          sudo cp test-harness/tls/certs/ca.crt /usr/local/share/ca-certificates/harness-root.crt
          sudo update-ca-certificates

      # Imports into $JAVA_HOME (21) only, exactly as the monolith did — including on the JDK-17
      # leg, whose Test launcher is JAVA_HOME_17_X64 and therefore does NOT see this alias. Left
      # as-is on purpose: changing it would change which harness TLS tests that leg exercises.
      - name: Trust harness CA in JVM keystore (Linux)
        run: |
          sudo keytool -delete -alias harness-root \
              -keystore "$JAVA_HOME/lib/security/cacerts" \
              -storepass changeit 2>/dev/null || true
          sudo keytool -importcert -trustcacerts \
              -file test-harness/tls/certs/ca.crt \
              -alias harness-root \
              -keystore "$JAVA_HOME/lib/security/cacerts" \
              -storepass changeit -noprompt

      # The quiche_conn_recv SIGABRT that previously required continue-on-error
      # was a JVM-side sockaddr lifetime bug (DirectByteBuffer Cleaner freeing
      # the buffer that quiche_recv_info held a raw pointer to); fixed in 5e55a5f.
      # The K/Native side was fixed earlier in b0a4f99. Both steps now run as
      # hard requirements — a real test failure should fail the job.
      #
      # timeout-minutes caps a single hanging socket-quic test so it can't burn the
      # job timeout and wipe subsequent steps. On run 26467344275 step 29 hung 53min
      # on QuicLocalServerTests.serverAcceptsConnection before this guard existed.
      #
      # ⚠️ 24, not 8, and it must stay ~3x whatever the unscaled figure would be.
      # This workflow sets QUIC_TEST_TIME_SCALE=3 at workflow level, which triples
      # every `.scaled` budget in the suite: normal duration goes from ~30-60s to
      # ~90-180s, so the old 8min lid had fallen from ~8-16x headroom to ~2.7-5x —
      # tight enough that a merely slow run trips it. And tripping it is much worse
      # than a slow run: a step timeout CANCELS the step, so Gradle never writes the
      # JUnit XML and the lane reports a truncated/absent test report instead of a
      # clean assertion failure. 24min restores the original headroom.
      # 9 alphabetically-late
      # tests still skip on CI via assumeTrue gates (see HANDOFF.md / TODO.md
      # for the resource-pressure root-cause story).
      # --continue: without it, the first hanging test (typically
      # bidirectionalStreamMuxExchange, alphabetically Q-ordered, currently re-
      # gated) halts the whole task before the alphabetically-later tests run,
      # which means each push only reveals one failure at a time. With
      # --continue, every failing test gets to execute and report so we see the
      # full failure surface in one CI cycle. Combined with the test-reports
      # artifact upload below, this gives complete signal per run.
      - name: Run socket-quic-quiche JVM tests (${{ matrix.leg.name }})
        timeout-minutes: 24
        env:
          # W5 deep-fuzz lane: 2000 Tier-A seeds through SimFuzzDeepRunTests (~1-2s;
          # virtual time). Without this the deep lane never runs anywhere and only the
          # 25-seed commonTest smoke guards the fuzzer. Forwarded into the test worker
          # by the quiche build script (daemon env is not step env). Empty on the JDK-17
          # leg, which is how the monolith had it.
          SIM_FUZZ_ITERATIONS: ${{ matrix.leg.sim-fuzz }}
          # All three legs build their own natives and inventoried zero skips.
          SOCKET_REQUIRE_ALL_TESTS: "1"
        run: |
          if [ "${{ matrix.leg.core-dump }}" = "true" ]; then
            # This is the lane where the intermittent JNI SIGSEGV (recv_info UAF) was first caught, so
            # capture a core here too — not just on the malloc-check lane. The forked worker inherits this
            # shell's core ulimit, so raise it and run --no-daemon (a daemon reused from an earlier step
            # would carry core size 0). core_pattern is machine-wide; the post-mortem step reads /tmp/cores.
            ulimit -c unlimited
            sudo mkdir -p /tmp/cores && sudo chmod 1777 /tmp/cores
            echo '/tmp/cores/core.%e.%p' | sudo tee /proc/sys/kernel/core_pattern >/dev/null
            .github/scripts/gradle-retry.sh :socket-quic-quiche:jvmTest ${{ matrix.leg.args }} --continue --no-daemon \
              --no-configuration-cache ${{ inputs.gradle-args }}
          else
            .github/scripts/gradle-retry.sh :socket-quic-quiche:jvmTest ${{ matrix.leg.args }} --continue \
              --no-configuration-cache ${{ inputs.gradle-args }}
          fi

      # Distinct from the harness OK/SKIP audit below: that one counts whether the QUIC *client*
      # reached the live harness, this one counts test bodies that never executed at all.
      - uses: ./.github/actions/skip-inventory
        if: ${{ !cancelled() }}

      # Snapshot the JVM QuicHarnessIntegrationTests OK/SKIP markers into a jvmTest-scoped
      # log the audit step reads. Snapshot the jvmTest dir ONLY, so the Node/JS "platform
      # unsupported" skips written by :jsNodeTest can't be miscounted into the JVM
      # lane. Captures the JDK17 backend run (the last full jvmTest); all three JVM backends
      # hit the same live harness, so its outcome represents the JVM client. (The glibc
      # malloc-check rerun that used to overwrite test-results/jvmTest here moved to the
      # separate `malloc-check` job under #209, but the jvmTest-only scoping is still what
      # keeps the Node skips out of the count.) `!cancelled()` mirrors the test steps.
      - name: Snapshot JVM QUIC harness markers
        if: ${{ !cancelled() && matrix.leg.audit == 'true' }}
        run: |
          grep -rhoE 'harness (OK|SKIP: [^<&]+)' \
            socket-quic-quiche/build/test-results/jvmTest 2>/dev/null \
            > /tmp/quic-harness-jvm.log || true
          echo "snapshotted $(wc -l < /tmp/quic-harness-jvm.log 2>/dev/null || echo 0) JVM harness markers"

      # NOTE: the glibc-malloc-check recv-path + soak + teardown suite (the
      # heap-corruption / UAF guard) used to run here. It is a slow, native-abort-prone
      # lane, so #209 relocated it to the parallel `malloc-check` job — this
      # job now gives fast compile + unit + JVM/JS/Android green/red without waiting
      # on it. See the `malloc-check` + `fuzz-*` jobs below for the moved lanes + rationale.

      # Audit step: mirror the macOS + Linux ARM64 audits — count
      # `harness OK` / `harness SKIP` markers in the JUnit XML's
      # <system-out> blocks and surface in step summary + artifact.
      # On Linux x64 the harness is always brought up by `harnessUp`
      # so OK > 0 is expected. The audit catches regressions where the
      # setup quietly stops working (port mismatch, broken native, etc.)
      # — same observability pattern uniformly across platforms.
      - name: Audit QUIC harness coverage on Linux x64 JVM
        if: ${{ always() && matrix.leg.audit == 'true' }}
        continue-on-error: true
        run: |
          # Read the pre-malloc-check JVM-only snapshot (see the snapshot step
          # above), NOT the live test-results tree: scoped to jvmTest so the
          # Node/JS "platform unsupported" skips never count here, and immune to
          # the malloc-check rerun overwriting test-results/jvmTest. The snapshot
          # already holds one marker per line.
          REPORT_ROOT=/tmp/quic-harness-jvm.log
          OK=$(grep -c 'harness OK' "$REPORT_ROOT" 2>/dev/null || true); OK=${OK:-0}
          SKIP=$(grep -c 'harness SKIP' "$REPORT_ROOT" 2>/dev/null || true); SKIP=${SKIP:-0}
          # Capture WHY each test skipped, not just the count, so a real
          # connection failure (vs an intentional gap) is legible without a log
          # dive. Dedup + count so a recurring failure shows as one line.
          SKIP_REASONS=$(grep -hoE 'harness SKIP: .+' "$REPORT_ROOT" 2>/dev/null \
            | sed -E 's/^harness SKIP: //' | sort | uniq -c | sed -E 's/^ *//' | sort -rn)
          echo "QuicHarnessIntegrationTests on Linux x64 JVM: OK=$OK, SKIP=$SKIP"
          [ -n "$SKIP_REASONS" ] && echo "Skip reasons:" && echo "$SKIP_REASONS"

          mkdir -p /tmp/quic-audit
          cat > /tmp/quic-audit/linux-jvm.txt <<EOF
          platform=linux-jvm
          launched=true
          ok=$OK
          skip=$SKIP
          EOF
          # Persist the distinct reasons as `reason=` lines so the cross-platform
          # summary job can render them without a log dive (the per-key greps
          # there are anchored, so extra lines are harmless).
          if [ -n "$SKIP_REASONS" ]; then
            while IFS= read -r line; do printf 'reason=%s\n' "$line"; done <<< "$SKIP_REASONS" \
              >> /tmp/quic-audit/linux-jvm.txt
          fi

          {
            echo "## QUIC harness — Linux x64 JVM"
            echo ""
            echo "| OK | SKIP |"
            echo "|---|---|"
            echo "| $OK | $SKIP |"
            if [ "$OK" = "0" ] && [ "$SKIP" != "0" ]; then
              echo ""
              echo "⚠️ Every QuicHarnessIntegrationTest skipped — Linux x64 JVM QUIC client not actually validated."
            fi
            if [ -n "$SKIP_REASONS" ]; then
              echo ""
              echo "<details><summary>Skip reasons (Linux x64 JVM)</summary>"
              echo ""
              echo '```'
              echo "$SKIP_REASONS"
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$OK" = "0" ] && [ "$SKIP" != "0" ]; then
            echo "::warning::Every QuicHarnessIntegrationTest skipped on Linux x64 JVM"
          fi

      - name: Upload Linux x64 JVM QUIC audit artifact
        if: ${{ always() && matrix.leg.audit == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: quic-audit-linux-jvm
          path: /tmp/quic-audit/linux-jvm.txt
          retention-days: 1
          if-no-files-found: warn

      # Native-crash post-mortem: if the test worker dumped a core (the malloc-check
      # lane raises ulimit + core_pattern), load it in gdb and print every thread's
      # backtrace into the live log AND a file. With the JNI shim now built
      # frame-pointer-preserving and only `--strip-debug`'d (function symbols kept,
      # see socket-quic-quiche/build.gradle.kts), these stacks NAME the quiche_jni frames —
      # turning the intermittent SIGABRT from "exit 134" into a real native stack.
      #
      # Split into three steps (was one, with a raw `apt-get update && apt-get install` inline):
      # check for a core FIRST so a plain test failure with nothing native to inspect never pays
      # for a gdb install, then install (from the nightly-warmed cache — gdb is in
      # .github/apt-packages.txt — instead of an unbounded raw apt-get on the failure path, which
      # is exactly the shape that deleted two jobs in #368), then run the backtrace.
      - name: Check for a core dump to post-mortem
        id: core-check
        if: ${{ failure() || cancelled() }}
        run: |
          shopt -s nullglob
          cores=(/tmp/cores/core.*)
          if [ ${#cores[@]} -eq 0 ]; then
            echo "No core dumps captured — the run failed without a native abort (or core_pattern was overridden)."
            echo "found=false" >>"$GITHUB_OUTPUT"
          else
            echo "found=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Install gdb (native crash post-mortem)
        if: steps.core-check.outputs.found == 'true'
        uses: ./.github/actions/apt-install-cached
        with:
          purpose: "native crash post-mortem: gdb backtrace from core"
          timeout: "3m"
          packages: gdb

      - name: Native crash post-mortem (gdb backtrace from core)
        if: steps.core-check.outputs.found == 'true'
        run: |
          shopt -s nullglob
          mkdir -p /tmp/cores/bt
          for core in /tmp/cores/core.*; do
            echo "==================== $core ===================="
            gdb --batch -q \
              -ex 'thread apply all bt full' \
              -ex 'info registers' \
              -ex quit \
              "$(command -v java)" "$core" 2>&1 | tee "/tmp/cores/bt/$(basename "$core").bt.txt"
          done

      # Same globs as checks-tests' `test-reports-linux`, under a per-leg name so the three
      # parallel legs cannot collide on upload. The hs_err/replay + core + symbol-bearing shim
      # are the whole point here: a native abort in :socket-quic-quiche:jvmTest is otherwise an
      # invisible "exit 134" with no failing JUnit case.
      - name: Upload test reports (on failure)
        if: ${{ failure() || cancelled() }}
        continue-on-error: true # an upload hiccup must not mask the failure it was capturing
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-linux-quiche-jvm-${{ strategy.job-index }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/hs_err_pid*.log
            **/replay_pid*.log
            /tmp/cores/core.*
            /tmp/cores/bt/*.txt
            socket-quic-quiche/libs/quiche/linux-x64/lib/libquiche_jni.so
          retention-days: 7
          if-no-files-found: ignore

  # ── Stage 2c: link the native test binaries + package quic-echo for the integration jobs ─────
  # Everything integration-linux-{x64,arm64} download comes from here, which is why both of them
  # need only this job. No Docker harness in this job: it builds inputs, it runs no tests.
  #
  # ⚠️ The quic-echo jar step must stay FIRST. `quicEchoJar` dependsOn `jvmTestProcessResources`,
  # which is what pulls in generateLocalhostCert + generatePinnedW3cCerts — and those Gradle tasks
  # are the ONLY producers of socket-quic-quiche/testcerts/{localhost,pinned}*. The link tasks do
  # not match the regex that wires them (build.gradle.kts ~line 2791), so without this step the two
  # test-binary artifacts below would ship a testcerts/ holding only the two committed files, and
  # the 43 cert-reading quiche tests would fail with "Test cert not found" in the integration jobs —
  # the exact failure the artifact comments below describe.
  link:
    name: "Link native test binaries + quic-echo (Linux)"
    needs: natives
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-quiche-env

      # Build the quic-echo fat jar with BOTH linux-x64 AND linux-arm64 quiche
      # natives baked in (gated by -PquicEchoAllArches=true). Done explicitly
      # here so `harnessUp` downstream sees an up-to-date multi-arch jar and
      # skips its own quicEchoJar dependency rebuild. The same jar then runs
      # under both the linux-x64 and linux-arm64 manifests of the
      # eclipse-temurin:21-jre-noble base image — required to bring quic-echo
      # up on the Linux ARM64 (native) job (Phase 3) out of the same artifact.
      # The cross-build uses aarch64-linux-gnu-gcc + the cargo arm64 target
      # that this job already has installed for the K/Native ARM64 chain.
      # verifyGeneratedTestCerts makes the testcerts half of the ⚠️ above ENFORCED rather than merely
      # documented: it depends on both generators, so it mints the fixtures and then fails here, in
      # the producing job, if any is missing — instead of surfacing as "Test cert not found" inside a
      # raw-.kexe integration job that has no Gradle to mint them. (The same guard runs in
      # build-apple's link job, which is where this class of break was last found.)
      - name: Build multi-arch quic-echo fat jar
        run: >-
          .github/scripts/gradle-retry.sh :socket-quic-quiche:quicEchoJar -PquicEchoAllArches=true
          :socket-quic-quiche:verifyGeneratedTestCerts
          --no-configuration-cache ${{ inputs.gradle-args }}

      # Upload the multi-arch quic-echo Docker context (jar + Dockerfile +
      # testcerts) so the Linux ARM64 (native) job can pull it down and
      # `docker compose up quic-echo` instead of skipping. The jar built
      # above contains both linux-x64 + linux-arm64 quiche natives, so the
      # same artifact runs under the arm64 manifest of the base image
      # without further fiddling. Phase 3 of the QUIC CI coverage plan.
      - name: Upload quic-echo Docker context
        uses: actions/upload-artifact@v7
        with:
          name: quic-echo-docker-context
          path: |
            test-harness/quic-echo/quic-echo.jar
            test-harness/quic-echo/Dockerfile
            test-harness/quic-echo/testcerts/
          retention-days: 1
          if-no-files-found: error

      # Link (don't run) the native test binaries the Integration Tests jobs consume.
      # The socket-quic-quiche linuxX64Test RUN moved OUT of this job into
      # integration-linux-x64, which runs the prebuilt .kexe against the Docker harness
      # — mirroring how the integration-linux-arm64 job already consumes the arm64
      # binary linked here. The root / socket-http3 / socket-webtransport linuxX64Test
      # still RUN in "Run checks and tests" (now the `checks-tests` job); only
      # socket-quic-quiche's native run relocated (it's the allocation-heavy quiche
      # cinterop suite, grouped with the fuzz/ASAN lanes in the integration job).
      - name: Link native test binaries (x64 + arm64) for integration jobs
        run: >-
          .github/scripts/gradle-retry.sh
          :socket-quic-quiche:linkDebugTestLinuxX64
          linkDebugTestLinuxArm64
          :socket-quic-quiche:linkDebugTestLinuxArm64
          :socket-udp:linkDebugTestLinuxArm64
          --no-configuration-cache ${{ inputs.gradle-args }}

      - name: Upload ARM64 test binaries
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-test-binary
          # testcerts/ rides along: the pinned*/localhost* fixtures are GENERATED by Gradle
          # (generateLocalhostCert/generatePinnedW3cCerts, wired to Gradle test tasks only), so a
          # raw-.kexe job never creates them — without this the 43 cert-reading quiche tests all
          # threw "Test cert not found" and the `| tee` pipeline swallowed the failing exit code.
          path: |
            build/bin/linuxArm64/debugTest/test.kexe
            socket-quic-quiche/build/bin/linuxArm64/debugTest/test.kexe
            socket-udp/build/bin/linuxArm64/debugTest/test.kexe
            socket-quic-quiche/testcerts/
          retention-days: 1

      # Hand the x64 socket-quic-quiche test .kexe to integration-linux-x64, which runs
      # it against the Docker harness (the native cinterop run that used to live in the
      # monolithic build job). Only this one module's binary moves — root/http3/webtransport
      # linuxX64Test still run in `checks-tests`. testcerts/ rides along for the same reason as
      # the arm64 artifact above: the generated fixtures only exist where Gradle test tasks ran.
      # Both paths share the socket-quic-quiche/ ancestor, so the download lands the kexe
      # at build/bin/linuxX64/debugTest/test.kexe and the certs at testcerts/ —
      # cwd-relative from the repo root, exactly where the tests look first.
      - name: Upload x64 test binary
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64-test-binary
          path: |
            socket-quic-quiche/build/bin/linuxX64/debugTest/test.kexe
            socket-quic-quiche/testcerts/
          retention-days: 1

  # ── Stage 2d: publish ────────────────────────────────────────────────────────────────────────
  # OFF THE TEST CRITICAL PATH. This job depends only on the natives, never on the test results —
  # which is safe because the caller's `needs: build-linux` waits for this whole workflow, tests
  # included, before `validate`/`publish-to-central` run. Previously this sat behind ~25 minutes of
  # tests in the same job for no reason other than colocation.
  #
  # ⚠️ The Android toolchain below is NOT optional here. `publishToMavenLocal` pulls
  # merge{Debug,Release}JniLibFolders, which build.gradle.kts wires `dependsOn(androidJniTasks)` —
  # verified with `--dry-run`: buildAndroidJniArm64v8a, buildAndroidJniArmeabiv7a and
  # buildAndroidJniX86_64 are all in the graph. Those run cargo-ndk, so this job needs the NDK, the
  # Android Rust targets, cargo-ndk itself and libclang (boring-sys' bindgen), exactly as the
  # monolith did. Restoring the android-native-libs artifact instead would NOT help: those tasks
  # have no marker-based `onlyIf`, and a fresh runner has no Gradle execution history to make them
  # up to date.
  publish:
    name: "Publish Linux targets to Maven Local"
    needs: natives
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      # ⚠️ The composite's artifact download is what makes the native CLASSIFIER jars publishable:
      # build.gradle.kts attaches the linux-x86_64 / linux-aarch64 artifacts to the jvm publication
      # only `if (allPresent)`, evaluated at CONFIGURE time against
      # libs/quiche/linux-*/lib/{libquiche.so,libquiche_jni.so}. Without the natives in place before
      # the Gradle call, this job would happily publish a maven-local-linux with those jars silently
      # missing. The composite hard-fails on exactly that condition.
      - uses: ./.github/actions/linux-quiche-env

      # accept-android-sdk-licenses is DISABLED here on purpose. The action's
      # built-in license pass (`sdkmanager --licenses`, run when this input is
      # true) doesn't just write license files — after accepting, sdkmanager
      # *completes* the runner image's pending Android Emulator package, which
      # downloads + unzips it from dl.google.com. That download intermittently
      # arrives truncated, so sdkmanager aborts with
      #   "Error reading Zip content from a SeekableByteChannel" -> exit 1
      # and the action has no retry, reddening the whole build-linux lane for a
      # transient network glitch (run 27561470552 attempt 1, step "Setup Android
      # SDK"). The package-install loop below (`tools platform-tools`) still
      # auto-accepts each package's own license via the action's stdin handler,
      # so the only thing deferred is the standalone all-licenses pass — which we
      # re-run with retry in the next step.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false

      # Accept the remaining SDK licenses with retry. `sdkmanager --licenses`
      # is idempotent and the emulator-package prep it triggers is exactly the
      # transient dl.google.com download that flakes above, so retry it with
      # backoff — same model as test-harness/compose-up-retry.sh absorbing
      # transient Docker Hub pulls. Finite `printf` of 'y' lines (not `yes |`,
      # which would hand pipefail a SIGPIPE 141 from the killed generator and
      # mask sdkmanager's real exit code) feeds the prompts.
      - name: Accept Android SDK licenses (retry transient package prep)
        run: |
          attempts=3
          for i in $(seq 1 "$attempts"); do
            if printf 'y\n%.0s' $(seq 1 50) | sdkmanager --licenses; then
              exit 0
            fi
            if [ "$i" -lt "$attempts" ]; then
              backoff=$((i * 15))
              echo "::warning::'sdkmanager --licenses' failed (attempt $i/$attempts) — likely a transient dl.google.com package-download corruption; retrying in ${backoff}s"
              sleep "$backoff"
            fi
          done
          echo "::error::Android SDK license acceptance failed after $attempts attempts"
          exit 1

      # The four Android NDK targets buildAndroidJni* (cargo-ndk) needs. The desktop cross targets
      # the monolith also installed here are not required in this job — nothing in the
      # publishToMavenLocal graph cross-builds quiche for Linux arm64 or Windows (the natives came
      # from the artifact), and the aarch64 Linux target is already added by the composite.
      - name: Add Rust Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi \
              x86_64-linux-android i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --quiet

      # cargo-ndk compiles quiche for three ABIs here; the registry cache is what keeps that from
      # re-downloading every crate. Restore-only: `natives` is the single writer for this key.
      - name: Restore Cargo registry
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      # Retried on a transient repository failure only — see .github/scripts/gradle-retry.sh for
      # why this job talks to Maven Central at all on a warm cache (issue #427).
      - name: Publish to Maven Local
        run: .github/scripts/gradle-retry.sh publishToMavenLocal --no-configuration-cache ${{ inputs.gradle-args }}

      - name: Upload Maven local artifacts
        uses: actions/upload-artifact@v7
        with:
          name: maven-local-linux
          path: ~/.m2/repository/com/ditchoom
          retention-days: 3

      # --- Multi-release tier linkage gate (issue #293, from shipped bug #287) ---
      #
      # socket-quic-quiche and network-monitor both ship a META-INF/versions/21 tier holding their FFM
      # bindings. Those tiers are compiled by jvmToolchain(21) but selected at runtime by EVERY JDK >= 21,
      # and nothing else in CI ever loads them on a JDK newer than the one that built them.
      #
      # That is precisely how #287 shipped: FfmQuicheApi called Arena.allocateUtf8String, a JDK-21-PREVIEW
      # name that JEP 454 renamed to allocateFrom when FFM finalised in 22. javac would have refused it
      # without --enable-preview and stamped the classfile; the Kotlin compiler does neither, so it
      # compiled clean, published clean, and threw NoSuchMethodError only when a consumer on JDK 22+ hit
      # that call site. An outside ProGuard audit found it, not us.
      #
      # Deliberately a *linkage* check, not a test run: #287 lived in an optional qlog path the suite
      # never calls, so running the FFM tests on a newer JDK would not have caught it. Only resolving
      # every reference sees the whole surface. jdeps cannot substitute — it stops at class granularity,
      # and java.lang.foreign.Arena exists on both JDKs, so a renamed method on a present class reads as
      # clean.
      #
      # Placed here, in build-linux, rather than in the `validate` job: validate has
      # needs: [build-linux, build-apple], which would gate a check that reads only META-INF/versions/**
      # behind the 40-60 minute macOS job. Neither tier is Apple-produced. This is the earliest point at
      # which both exist — and since the fan-out took `publish` off the test tail, that point is now
      # earlier still: this gate no longer waits for the Linux test suites either.
      #
      # setup-java is a SEPARATE step with an id rather than another entry in this job's multi-line
      # java-version: that list's last entry becomes JAVA_HOME, so appending 25 would silently run Gradle
      # on 25. Referencing steps.<id>.outputs.path also avoids $JAVA_HOME_25_<ARCH>, which is
      # architecture-coupled and breaks under `set -u` if the runner arch ever changes. This step runs
      # after every Gradle step in the job, so repointing JAVA_HOME here affects nothing.
      - name: Set up JDK 25 for the linkage check
        id: jdk25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Link-check multi-release tiers against JDK 25
        run: |
          set -euo pipefail
          JAVA25="${{ steps.jdk25.outputs.path }}/bin/java"
          "$JAVA25" -version

          # Self-test first. It asserts the checker still flags the exact #287 signature as unresolvable
          # AND still resolves its JDK 22+ replacement, so a refactor that neuters the resolver fails
          # loudly instead of going green forever. A gate that cannot fail is not a gate.
          "$JAVA25" scripts/LinkCheck.java --selftest

          # --require makes a vanished tier fail. Without it, a build that stopped emitting
          # META-INF/versions/21 would scan zero classes and pass — the "an audit that matched nothing
          # looks identical to a clean audit" shape that hid #290.
          # Scoped to THIS build's version. A CI runner's ~/.m2 is fresh so an unscoped find would
          # work here, but locally it picks up every version ever published to the developer's
          # ~/.m2 — including genuinely buggy historical ones (3.6.6 / 3.8.11 / 3.8.13 all still
          # carry #287) — which makes a local repro fail for reasons that have nothing to do with
          # the working tree.
          # Read from the workflow-level pin (the run's single version) rather than a step output — the
          # `Get version` step this used to reference is gone. Fittingly, this is the gate whose
          # #320 failure motivated #328/#329 in the first place: when the version it looks for is
          # not the version that got published, it reports "no -jvm-<V>.jar found", which reads
          # exactly like the MR-jar drift it exists to catch.
          VERSION="${ORG_GRADLE_PROJECT_version}"
          # Plain read loop rather than `mapfile`: mapfile is bash 4+, so this stays runnable on a
          # stock macOS bash 3.2 when reproducing the gate locally. A single invocation (not
          # `xargs`) so the --require assertions see the whole jar set at once — xargs could split
          # the list into batches and fail a require that a later batch would have satisfied.
          JARS=()
          while IFS= read -r j; do JARS+=("$j"); done < <(find ~/.m2/repository/com/ditchoom \
            -name "*-jvm-${VERSION}.jar" ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort)
          echo "scanning ${#JARS[@]} jvm jar(s) at version ${VERSION}"
          if [ "${#JARS[@]}" -eq 0 ]; then
            echo "::error::no -jvm-${VERSION}.jar found under ~/.m2 — publishToMavenLocal did not produce what this gate expects"
            exit 1
          fi
          "$JAVA25" scripts/LinkCheck.java \
            --require=socket-quic-quiche-jvm \
            --require=network-monitor-jvm \
            "${JARS[@]}"

  # The socket-quic-quiche linuxX64Test NATIVE (quiche cinterop) suite, split out of the monolithic
  # build job so the core compile + JVM/JS/Android test signal goes green/red fast and isn't gated
  # behind it. Run from the prebuilt .kexe (linked in `link`, uploaded as
  # linux-x64-test-binary) against the Docker harness, exactly like integration-linux-arm64
  # already does. The slow, native-abort-prone lanes (glibc malloc-check + Jazzer/cargo-fuzz)
  # live in the separate `malloc-check` + `fuzz-*` jobs (#209) so a fuzz hang can't gate this
  # integration signal and vice-versa. This lane is a pure K/N .kexe run — no JVM, so no
  # quicCrashDiag env (that's on the JVM lanes: `checks-tests` + `quiche-jvm` + `malloc-check` +
  # `fuzz-jvm`).
  #
  # `needs: link` and not `needs: natives`: this job downloads linux-x64-test-binary (from `link`)
  # and quic-echo-docker-context (also from `link`). It needs nothing the tests produce.
  integration-linux-x64:
    name: "Integration Tests (Linux x64)"
    needs: link
    runs-on: ubuntu-24.04
    # 30 like integration-linux-arm64 now that the fuzz self-builds (which needed the old
    # 45-min lid) moved to the `fuzz-*` jobs — this is just the prebuilt .kexe vs the harness.
    timeout-minutes: 30
    steps:
      # This job runs the prebuilt K/Native .kexe directly — no Gradle, no JVM — so it
      # needs no JDK, no build caches, and no Rust/BoringSSL toolchain (all of that lived
      # here only to self-build the fuzz lanes, which moved to the `fuzz-*` jobs under #209).
      # It now mirrors integration-linux-arm64: checkout for the harness scripts, download
      # the binary linked in `link`, bring the Docker harness up at the YAML level
      # (Gradle's harnessUp never fires for a raw .kexe), run, audit.
      - uses: actions/checkout@v7

      - name: Download x64 test binary
        uses: actions/download-artifact@v8
        with:
          name: linux-x64-test-binary

      - name: Download quic-echo Docker context
        uses: actions/download-artifact@v8
        with:
          name: quic-echo-docker-context
          path: test-harness/quic-echo/

      - name: Generate harness TLS certs
        run: bash test-harness/tls/gen-certs.sh

      # BoringSSL inside the .kexe reads /etc/ssl/certs at runtime; trust the harness CA.
      - name: Trust harness CA (Linux)
        run: |
          sudo cp test-harness/tls/certs/ca.crt /usr/local/share/ca-certificates/harness-root.crt
          sudo update-ca-certificates

      - name: Bring up test harness (with quic-echo)
        run: bash test-harness/compose-up-retry.sh echo http tls toxiproxy netem-blackhole rst quic-echo

      - name: Run socket-quic-quiche native tests (quiche cinterop)
        run: |
          # pipefail is NOT on by default in Actions' `bash -e {0}` (only an explicit
          # `shell: bash` adds it), so without this the `| tee` below returns tee's exit
          # code and a failing kexe still passes the step. This exact mask hid 43/106
          # tests failing on "Test cert not found" in every run since the job split.
          set -o pipefail
          BIN=$(find . -name test.kexe -type f | head -1)
          if [ -z "$BIN" ]; then echo "::error::no x64 test.kexe downloaded (linkDebugTestLinuxX64 upload)"; exit 1; fi
          if [ ! -d testcerts ]; then echo "::error::testcerts/ missing — linux-x64-test-binary artifact must include socket-quic-quiche/testcerts/"; exit 1; fi
          echo "Running $BIN"
          chmod +x "$BIN"
          # cwd = repo root (harness reached over the network; CA trusted via /etc/ssl/certs).
          # tee stdout so the audit step below can grep harness OK/SKIP markers without re-running.
          "$BIN" 2>&1 | tee /tmp/socket-quic-x64.log

      # Audit step: mirror integration-linux-arm64 / the JVM audit — count
      # QuicHarnessIntegrationTests OK vs SKIP from the captured stdout, surfacing a
      # regression that silently skips the whole suite (suite stays green) as a warning.
      - name: Audit QUIC harness coverage on Linux x64 (native)
        if: always()
        continue-on-error: true
        run: |
          LOG=/tmp/socket-quic-x64.log
          OK=0; SKIP=0; SKIP_REASONS=""
          if [ -f "$LOG" ]; then
            OK=$(grep -c 'harness OK' "$LOG" || true)
            SKIP=$(grep -c 'harness SKIP' "$LOG" || true)
            SKIP_REASONS=$(grep -hoE 'harness SKIP: .+' "$LOG" 2>/dev/null \
              | sed -E 's/^harness SKIP: //' | sort | uniq -c | sed -E 's/^ *//' | sort -rn)
          fi
          echo "QuicHarnessIntegrationTests on linuxX64 (native): OK=$OK, SKIP=$SKIP"
          [ -n "$SKIP_REASONS" ] && echo "Skip reasons:" && echo "$SKIP_REASONS"
          {
            echo "## QUIC harness — Linux x64 (native)"
            echo ""
            echo "| OK | SKIP |"
            echo "|---|---|"
            echo "| $OK | $SKIP |"
            if [ "$OK" = "0" ] && [ "$SKIP" != "0" ]; then
              echo ""
              echo "⚠️ Every QuicHarnessIntegrationTest skipped — Linux x64 native client not actually validated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$OK" = "0" ] && [ "$SKIP" != "0" ]; then
            echo "::warning::Every QuicHarnessIntegrationTest skipped on linuxX64 (native)"
          fi

      - name: Bring down test harness
        if: always()
        run: cd test-harness && docker compose down -v

  # `needs: link` for the same reason as integration-linux-x64: this job downloads
  # linux-arm64-test-binary + quic-echo-docker-context, both produced by `link`.
  integration-linux-arm64:
    name: "Integration Tests (Linux ARM64)"
    needs: link
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      # Checkout is needed for test-harness/ scripts + docker-compose.yml.
      # This job runs raw K/Native .kexe binaries and bypasses Gradle, so the
      # harnessUp/harnessDown Gradle tasks never fire. We bring the harness
      # up/down at the YAML level instead.
      - uses: actions/checkout@v7

      - name: Download ARM64 test binary
        uses: actions/download-artifact@v8
        with:
          name: linux-arm64-test-binary

      - name: Generate harness TLS certs
        run: bash test-harness/tls/gen-certs.sh

      # Linux trust-store injection covers the K/Native path too — BoringSSL
      # in the .kexe reads /etc/ssl/certs/ at runtime. No JVM keystore step is
      # needed for the .kexe (no JVM in this job).
      - name: Trust harness CA (Linux)
        run: |
          sudo cp test-harness/tls/certs/ca.crt /usr/local/share/ca-certificates/harness-root.crt
          sudo update-ca-certificates

      # Pull the multi-arch quic-echo Docker context produced by the
      # build-linux x64 `link` job (Phase 2). Contains the fat jar with BOTH
      # linux-x64 + linux-arm64 quiche natives baked in, plus the
      # Dockerfile + testcerts/. The eclipse-temurin:21-jre-noble base
      # image is multi-arch on Docker Hub so the same artifact runs
      # under the arm64 manifest here without further fiddling.
      - name: Download quic-echo Docker context
        uses: actions/download-artifact@v8
        with:
          name: quic-echo-docker-context
          path: test-harness/quic-echo/

      # Restore execute bits if any (docker build doesn't need them but
      # the testcerts dir gets recreated as a normal dir, which is fine).
      - name: Verify quic-echo artifact
        run: |
          ls -la test-harness/quic-echo/
          test -f test-harness/quic-echo/quic-echo.jar
          test -f test-harness/quic-echo/Dockerfile
          test -f test-harness/quic-echo/testcerts/cert.crt
          test -f test-harness/quic-echo/testcerts/cert.key

      # quic-echo joins the rest of the harness services on ARM64 now
      # that the multi-arch jar is available. The K/N linuxArm64 test
      # binary already contains the quiche cinterop binding (built by
      # the `link` job's `linkDebugTestLinuxArm64` step and uploaded via
      # linux-arm64-test-binary), so QuicHarnessIntegrationTests
      # exercises the Linux ARM64 client against this server — closing
      # the last gap in the Linux QUIC matrix.
      - name: Bring up test harness (with quic-echo)
        run: bash test-harness/compose-up-retry.sh echo http tls toxiproxy netem-blackhole rst quic-echo

      - name: Run ARM64 tests (base module)
        run: |
          chmod +x build/bin/linuxArm64/debugTest/test.kexe
          ./build/bin/linuxArm64/debugTest/test.kexe

      # :socket-udp's io_uring datagram suite. This runs here (real ubuntu-24.04-arm hardware)
      # rather than under the x64 job's qemu-user, which returns ENOSYS for io_uring_setup —
      # so the arm64 datapath is only validatable on native arm64. The .kexe was linked in the
      # `link` job (:socket-udp:linkDebugTestLinuxArm64) and uploaded via linux-arm64-test-binary.
      - name: Run ARM64 tests (socket-udp)
        run: |
          if [ -f socket-udp/build/bin/linuxArm64/debugTest/test.kexe ]; then
            chmod +x socket-udp/build/bin/linuxArm64/debugTest/test.kexe
            ./socket-udp/build/bin/linuxArm64/debugTest/test.kexe
          else
            echo "socket-udp ARM64 binary not found — skipping"
          fi

      - name: Run ARM64 tests (socket-quic-quiche)
        run: |
          # pipefail: Actions' default `bash -e {0}` shell doesn't set it, so the `| tee`
          # below otherwise reports tee's exit code and a failing kexe passes the step —
          # the mask that hid 43/106 tests failing on missing testcerts/ in every run.
          set -o pipefail
          if [ -f socket-quic-quiche/build/bin/linuxArm64/debugTest/test.kexe ]; then
            chmod +x socket-quic-quiche/build/bin/linuxArm64/debugTest/test.kexe
            # tee stdout into /tmp/socket-quic-arm64.log so the audit
            # step below can grep harness OK/SKIP markers from
            # QuicHarnessIntegrationTests.withHarness without re-running.
            ./socket-quic-quiche/build/bin/linuxArm64/debugTest/test.kexe 2>&1 | tee /tmp/socket-quic-arm64.log
          else
            echo "socket-quic ARM64 binary not found — skipping"
          fi

      # Audit step: counts QuicHarnessIntegrationTests OK vs SKIP from
      # the captured stdout above. Mirrors the macOS-side audit in
      # build-apple.yaml — surfaces a regression that silently breaks
      # the Linux ARM64 client (every test skips via the catch, suite
      # stays green) as a CI warning.
      - name: Audit QUIC harness coverage on Linux ARM64
        if: always()
        continue-on-error: true
        run: |
          LOG=/tmp/socket-quic-arm64.log
          OK=0
          SKIP=0
          SKIP_REASONS=""
          if [ -f "$LOG" ]; then
            OK=$(grep -c 'harness OK' "$LOG" || true)
            SKIP=$(grep -c 'harness SKIP' "$LOG" || true)
            # Distinct skip reasons (dedup + count) so a recurring failure is
            # one line. Source is the plain captured stdout, so grep the marker
            # straight through to end-of-line.
            SKIP_REASONS=$(grep -hoE 'harness SKIP: .+' "$LOG" 2>/dev/null \
              | sed -E 's/^harness SKIP: //' | sort | uniq -c | sed -E 's/^ *//' | sort -rn)
          fi
          echo "QuicHarnessIntegrationTests on linuxArm64: OK=$OK, SKIP=$SKIP"
          [ -n "$SKIP_REASONS" ] && echo "Skip reasons:" && echo "$SKIP_REASONS"

          mkdir -p /tmp/quic-audit
          cat > /tmp/quic-audit/linux-arm64.txt <<EOF
          platform=linux-arm64
          launched=true
          ok=$OK
          skip=$SKIP
          EOF
          if [ -n "$SKIP_REASONS" ]; then
            while IFS= read -r line; do printf 'reason=%s\n' "$line"; done <<< "$SKIP_REASONS" \
              >> /tmp/quic-audit/linux-arm64.txt
          fi

          {
            echo "## QUIC harness — Linux ARM64 (native)"
            echo ""
            echo "| OK | SKIP |"
            echo "|---|---|"
            echo "| $OK | $SKIP |"
            if [ "$OK" = "0" ] && [ "$SKIP" != "0" ]; then
              echo ""
              echo "⚠️ Every QuicHarnessIntegrationTest skipped — Linux ARM64 client not actually validated."
            fi
            if [ -n "$SKIP_REASONS" ]; then
              echo ""
              echo "<details><summary>Skip reasons (Linux ARM64)</summary>"
              echo ""
              echo '```'
              echo "$SKIP_REASONS"
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$OK" = "0" ] && [ "$SKIP" != "0" ]; then
            echo "::warning::Every QuicHarnessIntegrationTest skipped on linuxArm64 — Linux ARM64 client not actually validated"
          fi

      - name: Upload Linux ARM64 QUIC audit artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quic-audit-linux-arm64
          path: /tmp/quic-audit/linux-arm64.txt
          retention-days: 1
          if-no-files-found: warn

      - name: Bring down test harness
        if: always()
        run: cd test-harness && docker compose down -v

  # ---------------------------------------------------------------------------
  # Slow, native-abort-prone lanes split out of the monolithic build job +
  # `integration-linux-x64` (#209) and then fanned out (#213 follow-up) into
  # independent jobs so they run CONCURRENTLY instead of as sequential steps in one
  # job — the fuzz sweep no longer serializes behind itself, and a hang/abort in one
  # lane can't gate or blind the others. Per-lane crash artifacts carry the lane in
  # their name so parallel uploads don't collide.
  #
  # ⚠️ THESE LANES ARE NOT ALL SET UP THE SAME WAY, and the difference is the point (#338):
  #
  #   malloc-check, fuzz-jvm (all 4 legs)   → .github/actions/linux-quiche-env
  #       They test the natives this run SHIPS, so they download the quiche-linux-natives-full
  #       artifact `natives` produced and run against that exact binary. Previously they came
  #       through setup-linux-fuzz and rebuilt quiche from a cache lineage keyed differently from
  #       the one `natives` writes (-v7 vs -v8, and a hashFiles set missing
  #       socket-quic-quiche/build.gradle.kts, i.e. quichePatchDigest), which meant the
  #       heap-corruption guard and the JNI fuzzer were exercising a libquiche no other job in
  #       the run had ever seen.
  #
  #   fuzz-native (both legs), fuzz-boringssl-asan → .github/actions/setup-linux-fuzz
  #       cargo-fuzz builds quiche from source with SanitizerCoverage/ASAN under
  #       socket-quic-quiche/fuzz/native/target. A release-mode prebuilt artifact is the WRONG
  #       input for them, so they knowingly build their own and consume no natives artifact.
  #
  # `needs: natives` on all of them (was `needs: build`): the artifact consumers need it to exist,
  # and the ASAN lanes need `natives` to have written the gradle/cargo caches they restore
  # read-only. Pointing them at `natives` also starts them ~15 minutes earlier than `build` did.

  # Timer lane: the glibc-malloc-check recv-path + soak + teardown jvmTest rerun.
  # Heap-corruption / UAF guard, relocated from the monolithic build job (#209). The
  # worst QUIC bug class (the 3.2.12 JNI stream-command use-after-free that corrupted
  # the glibc free-list) only reproduces under glibc's malloc consistency checks — NOT
  # ASAN, because libquiche.a is non-instrumented.
  # `-PquicMallocCheck` sets MALLOC_CHECK_=3
  # + MALLOC_PERTURB_ + glibc.malloc.check=3 on the forked test worker. We re-run
  # only the recv-path robustness + concurrency-soak suites (the allocation-heavy
  # native paths) so a regression aborts the JVM with a diagnostic instead of
  # silently corrupting state. These three suites are in-process (client+server +
  # classpath certs), so `jvmTest`'s best-effort harnessUp bring-up is incidental —
  # the tests themselves need no Docker peer. StaleConnectionDiagnosticTests is
  # included because the still-open intermittent JNI SIGABRT (exit 134, no failing
  # JUnit case) was last seen *near* it — a teardown-heavy suite.
  malloc-check:
    name: "QUIC malloc-check (Linux x64)"
    needs: natives
    runs-on: ubuntu-24.04
    # 40, not 20: the step lid below is now 24 (QUIC_TEST_TIME_SCALE=3 — see its note). A job
    # timeout at or below the step lid fires first and takes the core-dump post-mortem steps with
    # it, which are the entire point of this lane.
    timeout-minutes: 40
    # quicCrashDiag mirrors any JVM fatal-error log (hs_err) to stderr and arms the
    # recv_info UAF lifecycle guard on the forked jvmTest worker.
    env:
      ORG_GRADLE_PROJECT_quicCrashDiag: "1"
    steps:
      - uses: actions/checkout@v7
      # linux-quiche-env, NOT setup-linux-fuzz: this lane is a heap-corruption guard, so it has to
      # run against the SHIPPED libquiche_jni.so/libquiche.so, not a locally rebuilt one (#338).
      - uses: ./.github/actions/linux-quiche-env

      # ⚠️ 24, not 8: this is the most deadline-heavy lane in the workflow (QuicConcurrencySoakTests
      # + StaleConnectionDiagnosticTests) and QUIC_TEST_TIME_SCALE=3 triples every `.scaled` budget
      # it waits on. A step timeout CANCELS the step, so tripping this lid yields a truncated test
      # report AND loses the core dump this lane exists to capture — strictly worse signal than the
      # slow-but-complete run it would be pre-empting. Keep at ~3x the unscaled figure.
      - name: Run socket-quic-quiche recv-path + soak + teardown suites under glibc malloc check
        timeout-minutes: 24
        env:
          QUIC_MIGRATION_REQUIRE_RUN: "1"
        run: |
          # Capture a full core dump if a native UAF aborts the test worker, so the next
          # JNI SIGABRT can be post-mortem'd in gdb instead of guessed. The forked worker
          # inherits THIS shell's core ulimit, so raise it here and run --no-daemon (a
          # daemon reused from an earlier step would carry core size 0). core_pattern is
          # machine-wide; the post-mortem step below reads /tmp/cores.
          ulimit -c unlimited
          sudo mkdir -p /tmp/cores && sudo chmod 1777 /tmp/cores
          echo '/tmp/cores/core.%e.%p' | sudo tee /proc/sys/kernel/core_pattern >/dev/null
          .github/scripts/gradle-retry.sh :socket-quic-quiche:jvmTest -PquicMallocCheck --continue --no-daemon \
            --tests "com.ditchoom.socket.quic.QuicMalformedPacketTests" \
            --tests "com.ditchoom.socket.quic.QuicConcurrencySoakTests" \
            --tests "com.ditchoom.socket.quic.StaleConnectionDiagnosticTests" \
            --no-configuration-cache ${{ inputs.gradle-args }}

      # Native-crash post-mortem: if the worker dumped a core, load it in gdb and print
      # every thread's backtrace into the live log AND a file. With the JNI shim built
      # frame-pointer-preserving and only `--strip-debug`'d (function symbols kept), these
      # stacks NAME the quiche_jni frames — turning a SIGABRT from "exit 134" into a real
      # native stack.
      #
      # Split into three steps (was one, with a raw `apt-get update && apt-get install` inline):
      # check for a core FIRST so a plain test failure with nothing native to inspect never pays
      # for a gdb install, then install (from the nightly-warmed cache — gdb is in
      # .github/apt-packages.txt — instead of an unbounded raw apt-get on the failure path, which
      # is exactly the shape that deleted two jobs in #368), then run the backtrace.
      - name: Check for a core dump to post-mortem
        id: core-check
        if: ${{ failure() || cancelled() }}
        run: |
          shopt -s nullglob
          cores=(/tmp/cores/core.*)
          if [ ${#cores[@]} -eq 0 ]; then
            echo "No core dumps captured — the run failed without a native abort (or core_pattern was overridden)."
            echo "found=false" >>"$GITHUB_OUTPUT"
          else
            echo "found=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Install gdb (native crash post-mortem)
        if: steps.core-check.outputs.found == 'true'
        uses: ./.github/actions/apt-install-cached
        with:
          purpose: "native crash post-mortem: gdb backtrace from core"
          timeout: "3m"
          packages: gdb

      - name: Native crash post-mortem (gdb backtrace from core)
        if: steps.core-check.outputs.found == 'true'
        run: |
          shopt -s nullglob
          mkdir -p /tmp/cores/bt
          for core in /tmp/cores/core.*; do
            echo "==================== $core ===================="
            gdb --batch -q \
              -ex 'thread apply all bt full' \
              -ex 'info registers' \
              -ex quit \
              "$(command -v java)" "$core" 2>&1 | tee "/tmp/cores/bt/$(basename "$core").bt.txt"
          done

      # Full assertion/stack + any JVM fatal-error log (hs_err) + core/gdb backtrace from a
      # malloc-check native abort. Distinct artifact name so it never collides with
      # checks-tests' `test-reports-linux` or the fuzz jobs' crash uploads.
      - name: Upload malloc-check reports (on failure)
        if: ${{ failure() || cancelled() }}
        continue-on-error: true # an upload hiccup must not mask the failure it was capturing
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-malloc-check
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/hs_err_pid*.log
            **/replay_pid*.log
            /tmp/cores/core.*
            /tmp/cores/bt/*.txt
            socket-quic-quiche/libs/quiche/linux-x64/lib/libquiche_jni.so
          retention-days: 7
          if-no-files-found: ignore

  # JVM Jazzer fuzz lanes — ONE matrix leg per target so every fuzzer runs on its own
  # concurrent runner (the http3 trio used to share a single leg and ran sequentially):
  #   quiche-header  — quiche_header_info, the parse on every received datagram before any
  #                    connection state; drives quiche over JNI (prepareQuicheNativeLib is
  #                    satisfied by the natives artifact linux-quiche-env downloads + touches).
  #   http3-codec    — the HAND-ROLLED HTTP/3 + QPACK decoder (untyped-decoder crashes).
  #   http3-roundtrip— encode→decode bijection breaks in that codec.
  #   wt-capsule     — the WebTransport Capsule parser (RFC 9297).
  # The three http3 lanes are pure-JVM (quiche/NW own the transport; this is OUR parser/encoder),
  # so native=false skips their native/Rust install. fail-fast:false so one lane's crash doesn't
  # cancel a sibling; each is time-boxed so a hang is a gating signal, not an open-ended job.
  fuzz-jvm:
    name: "Fuzz JVM (${{ matrix.lane }})"
    needs: natives
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # `jni` marks the lane that drives quiche over JNI (quiche-header) — it alone arms
          # native core/hs_err capture below. It does NOT gate the toolchain: EVERY lane needs
          # it, because even the pure-Kotlin http3 fuzzers have a task graph that transitively
          # reaches :buildBoringssl*/quiche cinterop via the KMP metadata chain, so linux-quiche-env
          # always installs it (skipping it for http3 broke this job — see the composite comment).
          - lane: quiche-header
            task: ":socket-quic-quiche:quicHeaderFuzz"
            crash-dir: "socket-quic-quiche/build/fuzz/header-info"
            jni: "true"
          - lane: http3-codec
            task: ":socket-http3:http3CodecFuzz"
            crash-dir: "socket-http3/build/fuzz/http3-codec"
            jni: "false"
          - lane: http3-roundtrip
            task: ":socket-http3:http3RoundTripFuzz"
            crash-dir: "socket-http3/build/fuzz/http3-roundtrip"
            jni: "false"
          - lane: wt-capsule
            task: ":socket-http3:wtCapsuleFuzz"
            crash-dir: "socket-http3/build/fuzz/wt-capsule"
            jni: "false"
    # quicCrashDiag arms the recv_info UAF guard on the quiche-header lane (JNI); harmless
    # on the pure-JVM http3 lanes.
    env:
      ORG_GRADLE_PROJECT_quicCrashDiag: "1"
    steps:
      - uses: actions/checkout@v7
      # linux-quiche-env, NOT setup-linux-fuzz: the quiche-header leg drives quiche over JNI and
      # must fuzz the binary this run ships; the three http3 legs need no native at all, and the
      # composite's artifact download + marker touch is what keeps prepareQuicheNativeLib from
      # re-running cargo in each of the four parallel legs (#338).
      - uses: ./.github/actions/linux-quiche-env

      # Persist the accumulated corpus across runs so coverage compounds instead of restarting
      # from the committed seed every time. The fuzzer writes newly-discovered, coverage-expanding
      # inputs to <crash-dir>/corpus (the gitignored FIRST positional corpus dir; the committed
      # seed is passed read-only second). The run_id key never pre-exists, so actions/cache always
      # SAVES a fresh snapshot at job end; restore-keys prefix-matches the most recent prior
      # snapshot to warm-start this run. Each lane keys independently so parallel legs don't clash.
      - name: Restore + persist fuzz corpus (${{ matrix.lane }})
        uses: actions/cache@v6
        with:
          path: ${{ matrix.crash-dir }}/corpus
          key: fuzz-corpus-jvm-${{ matrix.lane }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-jvm-${{ matrix.lane }}-

      # A find produces a `crash-*`/`oom-*`/`timeout-*` repro under the lane's crash-dir — the
      # DETERMINISTIC reproducer (download it and replay the one gradle fuzz task against it to
      # reproduce the exact failure locally, regardless of the CI RNG). The committed seed corpus
      # starts each lane warm. On the quiche-header lane, also arm core/hs_err capture: that lane
      # drives quiche over JNI, and the documented intermittent SIGABRT (recv_info UAF teardown
      # class) leaves NO fuzzer repro file — only a core + hs_err tell the story. 15-min lid: the
      # fuzz is time-boxed to 180s but Gradle config + prepareQuicheNativeLib can add minutes; the
      # step timeout only guards a genuine hang.
      - name: Fuzz ${{ matrix.lane }} (Jazzer, time-boxed)
        timeout-minutes: 15
        run: |
          if [ "${{ matrix.jni }}" = "true" ]; then
            # Frame-pointer-preserving, symbol-bearing JNI shim (built in `natives`) makes the gdb
            # backtrace NAME the quiche_jni frames. Forked worker inherits this shell's ulimit,
            # so raise it here and run --no-daemon; core_pattern is machine-wide.
            ulimit -c unlimited
            sudo mkdir -p /tmp/cores && sudo chmod 1777 /tmp/cores
            echo '/tmp/cores/core.%e.%p' | sudo tee /proc/sys/kernel/core_pattern >/dev/null
            .github/scripts/gradle-retry.sh ${{ matrix.task }} -PquicFuzzSeconds=180 --no-daemon \
              --no-configuration-cache ${{ inputs.gradle-args }}
          else
            .github/scripts/gradle-retry.sh ${{ matrix.task }} -PquicFuzzSeconds=180 \
              --no-configuration-cache ${{ inputs.gradle-args }}
          fi

      # Native-crash post-mortem for the JNI lane: if the worker dumped a core, load it in gdb and
      # print every thread's backtrace into the live log AND a file, so an intermittent SIGABRT
      # that reproduces only under CI's load becomes a real named native stack instead of exit 134.
      #
      # Split into three steps (was one, with a raw `apt-get update && apt-get install` inline):
      # check for a core FIRST so a fuzzer repro with nothing native to inspect never pays for a
      # gdb install, then install (from the nightly-warmed cache — gdb is in
      # .github/apt-packages.txt — instead of an unbounded raw apt-get on the failure path, which
      # is exactly the shape that deleted two jobs in #368), then run the backtrace.
      - name: Check for a core dump to post-mortem
        id: core-check
        if: ${{ failure() && matrix.jni == 'true' }}
        run: |
          shopt -s nullglob
          cores=(/tmp/cores/core.*)
          if [ ${#cores[@]} -eq 0 ]; then
            echo "No core dumps captured — the fuzzer failed with a repro (see the crash-* artifact), not a native abort."
            echo "found=false" >>"$GITHUB_OUTPUT"
          else
            echo "found=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Install gdb (native crash post-mortem)
        if: steps.core-check.outputs.found == 'true'
        uses: ./.github/actions/apt-install-cached
        with:
          purpose: "native crash post-mortem: gdb backtrace from core"
          timeout: "3m"
          packages: gdb

      - name: Native crash post-mortem (gdb backtrace from core)
        if: steps.core-check.outputs.found == 'true'
        run: |
          shopt -s nullglob
          mkdir -p /tmp/cores/bt
          for core in /tmp/cores/core.*; do
            echo "==================== $core ===================="
            gdb --batch -q -ex 'thread apply all bt full' -ex 'info registers' -ex quit \
              "$(command -v java)" "$core" 2>&1 | tee "/tmp/cores/bt/$(basename "$core").bt.txt"
          done

      # Upload the deterministic crash reproducer(s) for this lane + (JNI lane) the native crash
      # context: hs_err/replay logs, the core dump + its gdb backtrace, and the exact symbol-bearing
      # JNI shim the crash occurred in — everything needed to reproduce/triage offline. Lane in the
      # artifact name so parallel legs don't collide.
      - name: Upload fuzz crash + native-crash context
        if: ${{ failure() || cancelled() }}
        continue-on-error: true # an upload hiccup must not mask the failure it was capturing
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes-jvm-${{ matrix.lane }}
          path: |
            ${{ matrix.crash-dir }}/crash-*
            ${{ matrix.crash-dir }}/oom-*
            ${{ matrix.crash-dir }}/timeout-*
            **/hs_err_pid*.log
            **/replay_pid*.log
            /tmp/cores/core.*
            /tmp/cores/bt/*.txt
            socket-quic-quiche/libs/quiche/linux-x64/lib/libquiche_jni.so
          retention-days: 7
          if-no-files-found: ignore

  # Native ASAN + coverage-guided lanes (cargo-fuzz builds quiche with SanitizerCoverage +
  # AddressSanitizer, so libFuzzer gets REAL edge coverage the JVM Jazzer lane can't get on
  # non-instrumented quiche, and ASAN catches the heap-overflow / UAF class), one matrix leg
  # per target so they run in parallel:
  #   header-slice — quiche::Header::from_slice (the public-header parse).
  #   conn-recv     — the full server packet-recv state machine (accept + Connection::recv),
  #                   ~5x the edge coverage of the header parse alone.
  # Both install nightly + cargo-fuzz via the composite (cargo-fuzz binary is cached, so the
  # per-leg install is a near-instant restore, not a repeated ~3-5 min compile).
  fuzz-native:
    name: "Fuzz native ASAN (${{ matrix.lane }})"
    needs: natives
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: header-slice
            task: ":socket-quic-quiche:quicHeaderFuzzNative"
            corpus-dir: "socket-quic-quiche/build/fuzz-native/header-info-corpus"
          - lane: conn-recv
            task: ":socket-quic-quiche:quicConnRecvFuzzNative"
            corpus-dir: "socket-quic-quiche/build/fuzz-native/conn-recv-corpus"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-linux-fuzz
        with:
          cargo-fuzz: "true"

      # Persist the accumulated corpus across runs so ASAN coverage compounds. cargo-fuzz writes
      # newly-discovered inputs to build/fuzz-native/<lane>-corpus (the gitignored FIRST positional
      # corpus dir; the committed seed is read-only second). run_id key → always save a fresh
      # snapshot; restore-keys warm-starts from the latest prior one. Per-lane keys, so the two
      # native legs don't clash.
      - name: Restore + persist fuzz corpus (${{ matrix.lane }})
        uses: actions/cache@v6
        with:
          path: ${{ matrix.corpus-dir }}
          key: fuzz-corpus-native-${{ matrix.lane }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-native-${{ matrix.lane }}-

      # Tee the run to a file: on an ASAN find, the crashing input is written under
      # fuzz/native/artifacts/ (the deterministic reproducer — replay the fuzz binary against it
      # locally), but the ASAN REPORT itself (the offending stack, the allocation/free site, the
      # shadow-memory summary) goes to stderr. Capturing it durably means triage doesn't depend on
      # the ephemeral job log. set -o pipefail so the tee doesn't mask a failing gradle exit code.
      - name: Fuzz ${{ matrix.lane }} (cargo-fuzz ASAN, time-boxed)
        timeout-minutes: 12
        run: |
          set -o pipefail
          mkdir -p /tmp/fuzz-logs
          .github/scripts/gradle-retry.sh ${{ matrix.task }} -PquicFuzzSeconds=180 \
            --no-configuration-cache ${{ inputs.gradle-args }} \
            2>&1 | tee "/tmp/fuzz-logs/${{ matrix.lane }}-asan.log"

      # Upload the deterministic reproducer input(s) AND the captured ASAN report together, so a
      # heap-overflow/UAF find is reproducible + triageable offline. Lane in the name so the two
      # native legs don't collide on upload.
      - name: Upload fuzz crash repros + ASAN report
        if: ${{ failure() || cancelled() }}
        continue-on-error: true # an upload hiccup must not mask the failure it was capturing
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes-native-${{ matrix.lane }}
          path: |
            socket-quic-quiche/fuzz/native/artifacts/**
            /tmp/fuzz-logs/${{ matrix.lane }}-asan.log
          retention-days: 7
          if-no-files-found: ignore

  # BoringSSL-C ASAN proof — its own job because it's a clean rebuild (not a fuzz run) with a
  # different shape from the cargo-fuzz lanes. Proves the -PquicFuzzBoringSslAsan path actually
  # instruments BoringSSL itself (not just quiche's Rust). continue-on-error during bring-up
  # (same convention as before the split): the clang/Rust ASAN-runtime match is unproven, so a
  # red here must not block. Runs in parallel with the other fuzz lanes.
  fuzz-boringssl-asan:
    name: "Fuzz BoringSSL-C ASAN proof (Linux x64)"
    needs: natives
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-linux-fuzz
        with:
          cargo-fuzz: "true"

      # clang is required: its LLVM ASAN runtime must match cargo-fuzz's.
      # continue-on-error stays — a missing clang should degrade this probe, not fail the lane — but
      # note it never protected against the #368 stall: continue-on-error applies to a step that
      # FAILS, not to one that is still running when the job's 25m timeout fires.
      - name: Install clang (for BoringSSL ASAN)
        continue-on-error: true
        uses: ./.github/actions/apt-install-cached
        with:
          purpose: "BoringSSL ASAN: matching clang runtime"
          timeout: "4m"
          packages: "clang"

      - name: Prove BoringSSL-C ASAN instrumentation (clang, time-boxed)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -euo pipefail
          # Force a clean fuzz build so BoringSSL is recompiled with the ASAN CFLAGS (not served
          # from a prior uninstrumented cache) — otherwise the proof below could read a stale archive.
          rm -rf socket-quic-quiche/fuzz/native/target
          .github/scripts/gradle-retry.sh :socket-quic-quiche:quicConnRecvFuzzNative -PquicFuzzBoringSslAsan -PquicFuzzSeconds=90 \
            --no-configuration-cache ${{ inputs.gradle-args }}
          # Prove BoringSSL ITSELF is ASAN-instrumented: its compiled archive must reference ASAN
          # interceptors. Zero __asan_ symbols => the CFLAGS never reached the C build, fail loudly.
          bssl=$(find socket-quic-quiche/fuzz/native/target \( -name 'libcrypto.a' -o -name 'libssl.a' \) | head -1)
          if [ -z "$bssl" ]; then echo "::error::no BoringSSL archive found under the fuzz target dir"; exit 1; fi
          echo "Inspecting $bssl"
          if nm "$bssl" 2>/dev/null | grep -q '__asan_'; then
            echo "PROVEN: BoringSSL is ASAN-instrumented (__asan_ symbols present in $bssl)"
          else
            echo "::error::BoringSSL archive has NO __asan_ symbols — CFLAGS did not propagate to the C build; ASAN covers quiche's Rust only"
            exit 1
          fi
