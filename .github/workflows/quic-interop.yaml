name: QUIC interop (quic-interop-runner)

# Runs this library's QUIC client and server against every implementation the quic-interop-runner offers,
# nightly on main and on demand, through the gate in quic-interop-gate.yaml.
#
# Every other QUIC lane here is quiche talking to quiche (the HTTP/3 lane's aioquic server and the browser
# WebTransport lane aside). Two copies of one engine can agree on the same mistake; another stack does not.
# The runner's tests map directly onto what a mobile client relies on: `resumption` and `zerortt`,
# `rebind-port`/`rebind-addr` (a NAT rebinding under the connection, which our server must follow), and the
# loss, corruption and blackhole tests. The runner has no test in which the client moves its own path, so
# the gate adds one (our-client-migrating). Tests the endpoint does not implement exit 127 and are
# "unsupported" (QuicInteropEndpoint.kt lists them and why).
#
# Nightly, a stale expectation fails the run so test-harness/quic-interop/expectations.json is updated when a
# peer improves. `record` (on demand) writes today's results as a new expectations file, an artifact.

on:
  schedule:
    # 07:23 UTC, clear of flake-sweep (06:41) and native-deps-freshness (09:17).
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "gate judges against the expectations; record writes today's results as a new expectations file"
        required: false
        default: "gate"
        type: choice
        options: [gate, record]
      lanes:
        description: "Which lanes: the runner's Linux matrix, the native macOS and Windows lanes, or both"
        required: false
        default: "all"
        type: choice
        options: [all, linux, native]
      peers:
        description: "Comma-separated peers for the Linux matrix (empty = every peer; a partial run is reported, not judged)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

# A nightly run replaces the previous one; a manual run never cancels another (a recording, or a re-run of
# one of its cells, would be lost).
concurrency:
  group: quic-interop-${{ github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || github.run_id }}
  cancel-in-progress: true

jobs:
  # This workflow builds no natives of its own. A run on demand takes the natives built for the commit it
  # runs (a pull request's CI makes them): natives from another commit carry another quiche patch set. A
  # nightly run takes the newest from main.
  natives:
    name: "find natives"
    runs-on: ubuntu-24.04
    outputs:
      run-id: ${{ steps.find.outputs.run-id }}
      apple-run-id: ${{ steps.find.outputs.apple-run-id }}
      windows-run-id: ${{ steps.find.outputs.windows-run-id }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event_name == 'schedule' && 'main' || '' }}
          SHA: ${{ github.event_name == 'schedule' && '' || github.sha }}
        run: |
          set -euo pipefail
          newest() { # <artifact name>: the run that uploaded the newest unexpired copy for this commit, from main when nightly
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=$1&per_page=100" \
              --jq ".artifacts[] | select(.expired == false)
                    | select(\"$BRANCH\" == \"\" or .workflow_run.head_branch == \"$BRANCH\")
                    | select(\"$SHA\" == \"\" or .workflow_run.head_sha == \"$SHA\")
                    | [.created_at, .workflow_run.id] | @tsv" | sort -r | head -1 | cut -f2
          }
          for pair in run-id:quiche-linux-natives-full apple-run-id:quiche-apple-natives windows-run-id:quiche-windows-natives; do
            rid=$(newest "${pair#*:}")
            if [ -z "$rid" ]; then
              echo "::error::No unexpired ${pair#*:} artifact exists for ${SHA:-$BRANCH}. Run the build that makes it once, then retry."
              exit 1
            fi
            echo "${pair%%:*}=$rid" >> "$GITHUB_OUTPUT"
          done

  interop:
    needs: natives
    if: ${{ inputs.lanes != 'native' }}
    uses: ./.github/workflows/quic-interop-gate.yaml
    with:
      version: "0.0.0-interop"
      natives-run-id: ${{ needs.natives.outputs.run-id }}
      stale: ${{ github.event_name == 'schedule' && 'fail' || 'warn' }}
      record: ${{ inputs.mode || 'gate' }}
      peers: ${{ inputs.peers || '' }}

  native:
    needs: natives
    if: ${{ inputs.lanes != 'linux' && inputs.peers == '' }}
    uses: ./.github/workflows/quic-interop-native.yaml
    with:
      version: "0.0.0-interop"
      apple-natives-run-id: ${{ needs.natives.outputs.apple-run-id }}
      windows-natives-run-id: ${{ needs.natives.outputs.windows-run-id }}
      stale: ${{ github.event_name == 'schedule' && 'fail' || 'warn' }}
      record: ${{ inputs.mode || 'gate' }}
