name: QUIC interop (quic-interop-runner)

# Runs this library's QUIC client and server against every implementation the quic-interop-runner offers,
# nightly on main and on demand, through the gate in quic-interop-gate.yaml.
#
# Every other QUIC lane here is quiche talking to quiche (the HTTP/3 lane's aioquic server and the browser
# WebTransport lane aside). Two copies of one engine can agree on the same mistake; another stack does not.
# The runner's tests map directly onto what a mobile client relies on: `resumption` and `zerortt`,
# `rebind-port`/`rebind-addr` (a NAT rebinding under the connection, which our server must follow), and the
# loss, corruption and blackhole tests. The runner has no test in which the client moves its own path, so
# the gate adds one (our-client-migrating). Tests the endpoint does not implement exit 127 and are
# "unsupported" (QuicInteropEndpoint.kt lists them and why).
#
# Nightly, a stale expectation fails the run so test-harness/quic-interop/expectations.json is updated when a
# peer improves. `record` (on demand) writes today's results as a new expectations file, an artifact.

on:
  schedule:
    # 07:23 UTC, clear of flake-sweep (06:41) and native-deps-freshness (09:17).
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "gate judges against the expectations; record writes today's results as a new expectations file"
        required: false
        default: "gate"
        type: choice
        options: [gate, record]
      peers:
        description: "Comma-separated peers to run (empty = every peer; a partial run is reported, not judged)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: quic-interop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This workflow builds no natives of its own: it takes the newest quiche-linux-natives-full artifact, from
  # main when it runs nightly.
  natives:
    name: "find natives"
    runs-on: ubuntu-24.04
    outputs:
      run-id: ${{ steps.find.outputs.run-id }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event_name == 'schedule' && 'main' || '' }}
        run: |
          set -euo pipefail
          RID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=quiche-linux-natives-full&per_page=100" \
                  --jq "[.artifacts[] | select(.expired == false) | select(\"$BRANCH\" == \"\" or .workflow_run.head_branch == \"$BRANCH\")]
                        | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty")
          if [ -z "$RID" ]; then
            echo "::error::No unexpired quiche-linux-natives-full artifact exists. Run build-linux once, then retry."
            exit 1
          fi
          echo "run-id=$RID" >> "$GITHUB_OUTPUT"

  interop:
    needs: natives
    uses: ./.github/workflows/quic-interop-gate.yaml
    with:
      version: "0.0.0-interop"
      natives-run-id: ${{ needs.natives.outputs.run-id }}
      stale: ${{ github.event_name == 'schedule' && 'fail' || 'warn' }}
      record: ${{ inputs.mode || 'gate' }}
      peers: ${{ inputs.peers || '' }}
