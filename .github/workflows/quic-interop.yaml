name: QUIC interop (quic-interop-runner)

# Runs this library's QUIC client and server against other QUIC implementations with the standard
# quic-interop-runner, nightly.
#
# Every other QUIC lane here is quiche talking to quiche (the HTTP/3 lane's aioquic server and the
# browser WebTransport lane aside). Two copies of one engine can agree on the same mistake; another
# stack does not. The runner's tests also map directly onto what a mobile client relies on:
# `resumption` and `zerortt` (session tickets and 0-RTT), `rebind-port`/`rebind-addr` (a NAT rebinding
# under the connection, which our server must follow), and loss/corruption/blackhole tests.
#
# Peers run in both directions: our client against their server, then their client against ours.
# Tests the endpoint does not implement exit 127 and are reported "unsupported", not failed (see
# QuicInteropEndpoint.kt for the list and why: e.g. `connectionmigration` is the server's
# preferred_address, which quiche does not advertise).
#
# The runner has no test in which the CLIENT moves its own path, which is what a phone does on a network
# handoff. A second run adds one: with CLIENT_PARAMS=migrate=active our client's `transfer` migrates six
# times while it downloads (QuicInteropEndpoint.kt, ClientMode.ActiveMigration). The runner judges the
# download; the summary lists every move's typed result per peer.
#
# Informational: this job reports a matrix and fails only if the endpoint could not run at all, so a
# peer's regression never reddens main. Read the summary.

on:
  schedule:
    # 07:23 UTC, clear of flake-sweep (06:41) and native-deps-freshness (09:17).
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      peers:
        description: "Comma-separated peer implementations (names from the runner's implementations file)"
        required: false
        default: "quic-go,ngtcp2,quinn,msquic"
      tests:
        description: "Comma-separated tests (empty = the runner's full list)"
        required: false
        default: "handshake,transfer,multiplexing,longrtt,retry,resumption,zerortt,blackhole,handshakeloss,transferloss,handshakecorruption,transfercorruption,amplificationlimit,ipv6,rebind-port,rebind-addr,goodput"

permissions:
  contents: read
  actions: read # borrows the newest quiche-linux-natives-full artifact, as flake-hunt does

concurrency:
  group: quic-interop
  cancel-in-progress: true

env:
  ORG_GRADLE_PROJECT_version: "0.0.0-interop"
  IMAGE: ditchoom-socket-interop:ci

jobs:
  interop:
    name: "quic-interop-runner"
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      # Same borrowing as flake-hunt.yaml: this workflow has no natives job of its own, and the
      # newest main build's libquiche is the one under test.
      - name: Find a quiche natives artifact to borrow
        id: natives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=quiche-linux-natives-full&per_page=100" \
                  --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          if [ -z "$RID" ]; then
            echo "::error::No unexpired quiche-linux-natives-full artifact exists. Run build-linux once, then retry."
            exit 1
          fi
          echo "run-id=$RID" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/linux-quiche-env
        with:
          natives-run-id: ${{ steps.natives.outputs.run-id }}
          github-token: ${{ github.token }}

      # The runner's docker-compose.yml gives each sim interface an `interface_name`, which Docker
      # Engine rejects before v28.1 ("interface_name requires Docker Engine v28.1 or later"). The
      # ubuntu-24.04 image ships an older engine, so every compliance check failed, every pair was
      # skipped and the result files held only nulls. Upstream's own CI installs the same engine.
      - uses: docker/setup-docker-action@v5
        with:
          version: version=v28.3.0

      - name: Enable IPv6 packet filtering for the simulator
        run: sudo modprobe ip6table_filter

      - name: Build the endpoint jar and image
        run: |
          set -euo pipefail
          ./gradlew :socket-quic-quiche:quicInteropJar -PlinuxTargets=false --no-configuration-cache
          docker build -t "$IMAGE" test-harness/quic-interop

      # The runner judges rebind-port/rebind-addr from tshark's decryption of the capture. tshark
      # links a rebound 4-tuple to its connection only when its first short-header lookup, which
      # assumes a 20-byte DCID, misses. A 20-byte server id hits it, the link never forms, and
      # against a zero-length-CID client (quic-go, msquic) the server's packets on the new path
      # stay encrypted, so the test fails with "no PATH_CHALLENGE". QUIC_ISSUED_CONN_ID_LEN must
      # therefore stay below 20.
      - name: Install the runner and tshark
        run: |
          set -euo pipefail
          sudo add-apt-repository -y ppa:wireshark-dev/stable
          sudo apt-get update
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
          git clone --depth 1 https://github.com/quic-interop/quic-interop-runner.git /tmp/runner
          pip install -r /tmp/runner/requirements.txt
          # Register this endpoint beside the peers. The file was renamed upstream once; accept either.
          cd /tmp/runner
          FILE=implementations_quic.json
          [ -f "$FILE" ] || FILE=implementations.json
          jq --arg img "$IMAGE" '. + {"ditchoom": {"image": $img, "url": "https://github.com/DitchOoM/socket", "role": "both"}}' \
            "$FILE" > /tmp/impl.json && mv /tmp/impl.json "$FILE"
          echo "registered in $FILE"

      - name: Run (our client → peer servers, peer clients → our server)
        id: run
        env:
          PEERS: ${{ inputs.peers || 'quic-go,ngtcp2,quinn,msquic' }}
          TESTS: ${{ inputs.tests || 'handshake,transfer,multiplexing,longrtt,retry,resumption,zerortt,blackhole,handshakeloss,transferloss,handshakecorruption,transfercorruption,amplificationlimit,ipv6,rebind-port,rebind-addr,goodput' }}
        working-directory: /tmp/runner
        run: |
          set -uo pipefail
          mkdir -p /tmp/interop
          # run.py exits non-zero when any test fails; that is the matrix's content, not this step's
          # failure. A missing result file is.
          python3 run.py -c ditchoom -s "$PEERS" -t "$TESTS" -l /tmp/interop/logs-client -j /tmp/interop/client.json -d || true
          python3 run.py -s ditchoom -c "$PEERS" -t "$TESTS" -l /tmp/interop/logs-server -j /tmp/interop/server.json -d || true
          for f in client server; do
            if [ ! -s "/tmp/interop/$f.json" ]; then
              echo "::error::the runner produced no $f result — the endpoint or the runner did not start"
              exit 1
            fi
            # A pair the runner skips (compliance check failed, sim did not start) is written as a row
            # of nulls. If no pair produced a single verdict, nothing was tested.
            if ! jq -e '[.results[][] | .result | select(. != null)] | length > 0' "/tmp/interop/$f.json" > /dev/null; then
              echo "::error::the runner ran no $f test against any peer — every pair was skipped (see 'not compliant' above)"
              exit 1
            fi
          done

      # The runner's compose file hands the client container CLIENT_PARAMS from this environment.
      - name: Run (our client migrating actively → peer servers)
        env:
          PEERS: ${{ inputs.peers || 'quic-go,ngtcp2,quinn,msquic' }}
          CLIENT_PARAMS: migrate=active
        working-directory: /tmp/runner
        run: |
          set -uo pipefail
          python3 run.py -c ditchoom -s "$PEERS" -t transfer -l /tmp/interop/logs-migration -j /tmp/interop/migration.json -d || true
          if [ ! -s /tmp/interop/migration.json ]; then
            echo "::error::the runner produced no active-migration result — the endpoint or the runner did not start"
            exit 1
          fi

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # Result JSON: servers[], clients[], tests{abbr: {name}} (tests and measurements), and per pair
          # at index client*len(servers) + server: results[] and measurements[], each
          # [{abbr, result: succeeded|failed|unsupported|null}]; null = the runner skipped the pair.
          table() {
            local f=$1 title=$2
            [ -s "$f" ] || return 0
            echo "### $title"
            echo
            jq -r '
              . as $r
              | ($r.servers | length) as $ns
              | (["Server", "Client"] + [$r.tests | to_entries[] | .key]) as $hdr
              | ($hdr | "| " + join(" | ") + " |"),
                ($hdr | map("---") | "| " + join(" | ") + " |"),
                ( [range(0; $r.servers | length) as $s | range(0; $r.clients | length) as $c | {s: $s, c: $c}][]
                  | . as $p
                  | ($r.results[$p.c * $ns + $p.s] + ($r.measurements[$p.c * $ns + $p.s] // [])) as $cell
                  | [$r.servers[$p.s], $r.clients[$p.c]]
                    + [$r.tests | to_entries[] | .key as $k
                       | ($cell | map(select(.abbr == $k)) | if length == 0 then "-" else .[0].result end)
                       | if . == "succeeded" then "✅" elif . == "failed" then "❌" elif . == "unsupported" then "–" elif . == null then "skipped" else . end]
                  | "| " + join(" | ") + " |")
            ' "$f"
            echo
            echo "Legend: ✅ succeeded · ❌ failed · – unsupported by one side · skipped = the runner never ran the pair"
            echo
          }
          # One row per peer server: the runner's verdict on the download, and what our client's moves came to.
          migration() {
            local f=/tmp/interop/migration.json
            [ -s "$f" ] || return 0
            echo "### Our client migrating actively (transfer, six moves while downloading)"
            echo
            echo "| Server | Download | Moves |"
            echo "| --- | --- | --- |"
            jq -r '. as $r | range(0; $r.servers | length) as $s
                   | [$r.servers[$s], ($r.results[$s] | map(select(.abbr == "DC")) | .[0].result // "skipped")] | @tsv' "$f" |
              while IFS=$'\t' read -r peer verdict; do
                summary=$(find /tmp/interop/logs-migration -path "*${peer}_ditchoom*" -name output.txt -exec grep -h -o 'MIGRATION-SUMMARY.*' {} + 2>/dev/null | head -1 | sed 's/^MIGRATION-SUMMARY //; s/|/\\|/g' || true)
                echo "| $peer | $verdict | ${summary:-no summary printed (the client did not finish the transfer)} |"
              done
            echo
            echo "<details><summary>Every move</summary>"
            echo
            echo '```'
            find /tmp/interop/logs-migration -name output.txt | sort | while read -r out; do
              echo "== $(echo "$out" | sed 's|/tmp/interop/logs-migration/||; s|/output.txt||')"
              grep -h -o 'MIGRATION .*' "$out" || echo "(no moves printed)"
            done
            echo '```'
            echo
            echo "</details>"
            echo
          }
          {
            echo "## QUIC interop"
            echo
            table /tmp/interop/client.json "Our client"
            table /tmp/interop/server.json "Our server"
            migration
            echo "Test abbreviations are the runner's; see its README."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: quic-interop-${{ github.run_id }}
          path: /tmp/interop
          if-no-files-found: warn
          retention-days: 14
