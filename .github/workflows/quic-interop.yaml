name: QUIC interop (quic-interop-runner)

# Runs this library's QUIC client and server against every implementation the quic-interop-runner offers,
# nightly on main and on demand, through the gate in quic-interop-gate.yaml (review.yaml runs the same gate
# on every pull request).
#
# Every other QUIC lane here is quiche talking to quiche (the HTTP/3 lane's aioquic server and the browser
# WebTransport lane aside). Two copies of one engine can agree on the same mistake; another stack does not.
# The runner's tests map directly onto what a mobile client relies on: `resumption` and `zerortt`,
# `rebind-port`/`rebind-addr` (a NAT rebinding under the connection, which our server must follow), and the
# loss, corruption and blackhole tests. The runner has no test in which the client moves its own path, so
# the gate adds one (our-client-migrating). Tests the endpoint does not implement exit 127 and are
# "unsupported" (QuicInteropEndpoint.kt lists them and why).
#
# A stale expectation fails the run, so test-harness/quic-interop/expectations.json is updated when a peer
# improves. `record` (on demand) writes today's results as a new expectations file, an artifact.

on:
  schedule:
    # 07:23 UTC, clear of flake-sweep (06:41) and native-deps-freshness (09:17).
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "gate judges against the expectations; record writes today's results as a new expectations file"
        required: false
        default: "gate"
        type: choice
        options: [gate, record]
      lanes:
        description: "Which lanes: the runner's Linux matrix, the native macOS and Windows lanes, or both"
        required: false
        default: "all"
        type: choice
        options: [all, linux, native]
      peers:
        description: "Comma-separated peers for the Linux matrix (empty = every peer; a partial run is reported, not judged)"
        required: false
        default: ""
        type: string
      tests:
        description: "Comma-separated runner tests for the Linux matrix (empty = peers.json's list; with peers set, never judged)"
        required: false
        default: ""
        type: string
      repeat:
        description: "Runs of the tests per cell, each kept as its own logs (to capture a rare failure)"
        required: false
        default: "1"
        type: string

permissions:
  contents: read
  actions: read

# A nightly run replaces the previous one; a manual run never cancels another (a recording, or a re-run of
# one of its cells, would be lost).
concurrency:
  group: quic-interop-${{ github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || github.run_id }}
  cancel-in-progress: true

jobs:
  # The quiche natives of the commit this run tests: another commit's carry another quiche patch set. A pull
  # request's CI builds them (from the branch merged into main, so they match only while the branch is up to
  # date with main); when none exist for this commit, as on main, whose squash commits no pull request built,
  # this run builds them with build-linux.yaml and build-apple.yaml's natives jobs.
  natives:
    name: "find natives"
    runs-on: ubuntu-24.04
    outputs:
      # earlier: every artifact exists from an earlier run (the ids below); this-run: this run builds them.
      source: ${{ steps.find.outputs.source }}
      run-id: ${{ steps.find.outputs.run-id }}
      apple-run-id: ${{ steps.find.outputs.apple-run-id }}
      windows-run-id: ${{ steps.find.outputs.windows-run-id }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          newest() { # <artifact name>: the run that uploaded the newest unexpired copy for this commit
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=$1&per_page=100" \
              --jq ".artifacts[] | select(.expired == false) | select(.workflow_run.head_sha == \"$SHA\")
                    | [.created_at, .workflow_run.id] | @tsv" | sort -r | head -1 | cut -f2
          }
          found=()
          for pair in run-id:quiche-linux-natives-full apple-run-id:quiche-apple-natives windows-run-id:quiche-windows-natives; do
            rid=$(newest "${pair#*:}")
            [ -n "$rid" ] && found+=("${pair%%:*}=$rid")
          done
          if [ ${#found[@]} -eq 3 ]; then
            echo "source=earlier" >> "$GITHUB_OUTPUT"
            printf '%s\n' "${found[@]}" >> "$GITHUB_OUTPUT"
            echo "natives for $SHA from earlier runs: ${found[*]}"
          else
            echo "source=this-run" >> "$GITHUB_OUTPUT"
            echo "no complete set of natives for $SHA (found: ${found[*]:-none}); this run builds them"
          fi

  build-linux:
    needs: natives
    if: ${{ needs.natives.outputs.source == 'this-run' }}
    uses: ./.github/workflows/build-linux.yaml
    with:
      version: "0.0.0-interop"
      natives-only: true

  build-apple:
    needs: natives
    if: ${{ needs.natives.outputs.source == 'this-run' }}
    uses: ./.github/workflows/build-apple.yaml
    with:
      version: "0.0.0-interop"
      natives-only: true

  # A skipped build (natives from an earlier run) is not a failed one, hence !cancelled() and the results.
  interop:
    needs: [natives, build-linux]
    if: ${{ !cancelled() && needs.natives.result == 'success' && needs.build-linux.result != 'failure' && inputs.lanes != 'native' }}
    uses: ./.github/workflows/quic-interop-gate.yaml
    with:
      version: "0.0.0-interop"
      natives-run-id: ${{ needs.natives.outputs.source == 'earlier' && needs.natives.outputs.run-id || '' }}
      stale: fail
      record: ${{ inputs.mode || 'gate' }}
      peers: ${{ inputs.peers || '' }}
      tests: ${{ inputs.tests || '' }}
      repeat: ${{ inputs.repeat || '1' }}

  native:
    needs: [natives, build-linux, build-apple]
    if: >-
      ${{ !cancelled() && needs.natives.result == 'success' && needs.build-linux.result != 'failure'
      && needs.build-apple.result != 'failure' && inputs.lanes != 'linux' && inputs.peers == '' }}
    uses: ./.github/workflows/quic-interop-native.yaml
    with:
      version: "0.0.0-interop"
      apple-natives-run-id: ${{ needs.natives.outputs.source == 'earlier' && needs.natives.outputs.apple-run-id || github.run_id }}
      windows-natives-run-id: ${{ needs.natives.outputs.source == 'earlier' && needs.natives.outputs.windows-run-id || github.run_id }}
      stale: fail
      record: ${{ inputs.mode || 'gate' }}
