name: "Build & Test (Apple)"

# FAN-OUT SHAPE (was one ~32-43 minute serial job):
#
#   natives ──┬── kn-tests (matrix: macos-x64 | ios-sim | other-sims | device-compile)
#             ├── jvm-tests (matrix: jni | ffm)
#             ├── link ── integration-macos-arm64
#             └── publish
#
# `natives` builds every Apple libquiche.a/dylib + JNI shim once and hands them to the consumers as
# an artifact, so the ~10-20 minute cargo/BoringSSL build is paid at most once per run instead of
# being the serial prefix of everything.
#
# The win is mostly in taking `publish` off the tail: it used to run AFTER the ~15-19 minute K/N
# suite and both ~8 minute JVM suites, purely because they shared a job, even though it depends on
# none of them. `validate` (the caller's next job) needs the published artifacts, not the test
# results, so publishing in parallel with the tests shortens the run's critical path directly.
#
# ⚠️ This does NOT weaken the release gate. A reusable workflow call completes only when ALL of its
# jobs complete and fails if ANY of them fail, so a caller's `needs: build-apple` still waits for
# every test job here. Publishing early makes the artifacts available sooner within the run; it
# never lets a red test suite reach `publish-to-central`.
#
# ⚠️ Shard balance is a first cut, not a measured optimum. Every extra macOS job re-pays checkout +
# JDK + cache restore + Gradle configuration (~3-4 min), so splitting further is NOT free and can
# lose to the serial version. Judge changes here over several runs — `Run Apple K/N tests` alone
# swung 884s..1151s run-to-run before any of this.

on:
  workflow_call:
    inputs:
      gradle-args:
        description: "Extra Gradle arguments (e.g., -PincrementMinor=true)"
        required: false
        default: ""
        type: string
      version:
        # REQUIRED, with no fallback to computing it here on purpose. An optional input defaulting
        # to "compute it yourself" would silently restore the cross-job version split this exists
        # to remove — and it would do so invisibly, since both branches produce a plausible
        # version. A caller that forgets to pass it must fail at the workflow-call, not 40
        # minutes later in `validate`. See compute-version.yaml for the full story.
        description: "The run's version, from the compute-version job. Pins every Gradle call here."
        required: true
        type: string

# Every job below shares these. Job-level (not a step export) so it covers the FIRST Gradle
# invocation too — there is no longer a version step to run first.
env:
  # Pins every Gradle invocation to the run's single version. build.gradle.kts only calls
  # getNextVersion when no version was supplied from outside, so with this set no Gradle call here
  # touches Maven Central's metadata at all. See #329 / compute-version.yaml.
  ORG_GRADLE_PROJECT_version: ${{ inputs.version }}
  # Loaded macOS runners occasionally take >10s for a QUIC handshake that is normally <1s (this is a
  # real-network establishment test, not the deterministic ManualDriverClock sim tier), tripping the
  # fixed test deadlines and flaking the release. Scale every `.scaled` test budget
  # (TestHelpers.testTimeScale, clamped 1..10) by 3x so a slow runner simply gets more wall-clock
  # without weakening any assertion or timing ratio. Left unset on Linux/local (scale = 1). See
  # QuicMalformedPacketTestSuite + withTracedQuicConnection.
  QUIC_TEST_TIME_SCALE: "3"
  # The Docker-backed conformance harness has no working macOS fixture; the env var makes every
  # harness-backed test self-skip cleanly. Was a `>> $GITHUB_ENV` step in the monolith, which would
  # now have to be repeated in every shard.
  HARNESS_DISABLED: "true"

jobs:
  # ── Stage 1: build every Apple quiche native exactly once ────────────────────────────────────
  # The Apple QUIC backend is Cloudflare quiche over an NWConnection-UDP datapath (the
  # quiche-on-Apple pivot replaced the Network.framework system-QUIC backend / the deleted
  # :socket-quic-nw). quiche needs no special SDK; macos-26 is kept for a recent Xcode + an iOS-26
  # simulator runtime for iosSimulatorArm64Test.
  natives:
    name: "Apple quiche natives"
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # NO `cache: gradle` — the caches are saved explicitly below, and setup-java's gradle cache
      # points at the same ~/.gradle/caches directory, so enabling both stored that tree twice.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      # This job is the SINGLE WRITER for the Konan/Gradle caches. Every fanned-out consumer uses
      # actions/cache/restore (read-only) via .github/actions/apple-quiche-env, so a cache miss
      # cannot turn into six parallel jobs racing to upload the same key.
      # ⚠️ For the two Gradle keys that is now further narrowed to main's ref scope only — see the
      # `Restore Gradle …` steps below and their `Save … (main only)` twins at the end of this job.
      # Konan is still written from every ref: it is keyed on the version catalog alone, so it
      # rotates only on a Kotlin bump, and a K/N distribution download is the one thing too
      # expensive to leave to a prefix-restore miss on the job the whole workflow waits for.
      - name: Cache Konan
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-macos-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-macos-

      # Persist the local Gradle build cache (~/.gradle/caches/build-cache-1) across runs so the
      # compiled native klibs, cinterop klibs, and per-target native shim archives are reused
      # instead of rebuilt cold every run. Keyed on the build definition (version catalog,
      # build scripts, wrapper); restore-keys fall back to the most recent partial match. (mirrors buffer #232)
      #
      # This REPLACES setup-java's `cache: gradle` rather than supplementing it. The old comment
      # here claimed setup-java only restored modules-2 and not build-cache-1; that is false —
      # setup-java/src/cache.ts pins the gradle package manager to
      # `path: [join(os.homedir(), '.gradle', 'caches')]`, the whole tree. Running both therefore
      # bought nothing and cost a duplicate copy of this directory in the repo's Actions cache
      # (measured 2026-08-11: 687MB `setup-java-macOS-arm64-gradle-*` alongside the 1088MB
      # `gradle-macos-*` here), which matters because the repo sits at the 10GB cap and the
      # resulting LRU eviction is what makes "cached" quiche natives still cost ~339s.
      #
      # ⚠️ RESTORE here, SAVE only on main (the two `Save Gradle …` steps at the end of this job).
      # Cache entries are ref-scoped: a PR can read main's, main can never read a PR's, and a merged
      # PR's entries linger for the 7-day idle window evicting live ones. Measured 2026-08-12: the
      # explicit gradle-* families were 3192MB of a 10240MB cap, 100% of it on PR refs. merged.yaml
      # calls this workflow on `pull_request_target: closed` (github.ref = refs/heads/main), so main
      # is rewritten on every merge and each PR prefix-restores that one copy. Same pattern
      # gradle/actions/setup-gradle uses by default.
      - name: Restore Gradle build outputs
        id: restore_gradle_caches
        uses: actions/cache/restore@v6
        with:
          path: ~/.gradle/caches
          key: gradle-macos-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-macos-

      # The wrapper distribution is cached SEPARATELY from ~/.gradle/caches on purpose, mirroring
      # what setup-java did (its `additionalCaches: [{name: 'gradle-wrapper', ...}]`, added for
      # actions/setup-java#269). Folding ~/.gradle/wrapper into the step above would re-download
      # the ~150MB Gradle distribution on every `*.gradle.kts` edit, since that key rotates on
      # build-script changes while the wrapper itself changes only when the wrapper properties do.
      # No restore-keys: a prefix hit would hand back a different Gradle distribution than the
      # wrapper properties ask for, which gradlew would re-download anyway.
      - name: Restore Gradle wrapper distribution
        id: restore_gradle_wrapper
        uses: actions/cache/restore@v6
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-macos-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Show pinned version
        run: echo "Building version ${ORG_GRADLE_PROJECT_version} (pinned for the whole run)"

      # All five Apple Rust targets the quiche static libs are built for (macOS x2 + iOS device/sim-arm64/
      # sim-x64). Pre-installing them here means the Gradle build step doesn't have to.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      # All built quiche native libs for every Apple target: the macOS dylib + JNI shim (for the JVM
      # JNI/FFM tests) and the macOS + iOS static libs the K/N test binaries -force_load. The expensive
      # part is the from-source cargo + boring-crate BoringSSL build for five targets (~10-20 min; quiche
      # 0.29 dropped vendored-BoringSSL, so boring-sys builds it — Xcode supplies libclang for bindgen), so cache
      # it keyed on the quiche version + build script (patch source) + the JNI-shim source.
      # NO restore-keys: a prefix fallback would resurrect a stale sibling dir (marker + libquiche.dylib)
      # built from a DIFFERENT quiche source patch — exactly the #260/#263 bug where a pre-caller-clock
      # dylib (missing quiche_set_virtual_time_nanos) satisfied the marker and the JNI shim failed to link.
      # An exact-key miss must force a clean rebuild; cargo warm-start still comes from the cargo-target cache.
      - name: Cache quiche Apple native libs
        uses: actions/cache@v6
        with:
          path: |
            socket-quic-quiche/libs/quiche/macos-arm64/lib
            socket-quic-quiche/libs/quiche/macos-x64/lib
            socket-quic-quiche/libs/quiche/ios-arm64/lib
            socket-quic-quiche/libs/quiche/ios-simulator-arm64/lib
            socket-quic-quiche/libs/quiche/ios-x64/lib
          key: quiche-apple-v3-${{ hashFiles('gradle/libs.versions.toml', 'socket-quic-quiche/build.gradle.kts', 'socket-quic-quiche/src/jni/quiche_jni.c') }}

      # Build every Apple quiche native lib. buildQuicheAppleStaticLibs makes the macOS dylib+.a (both
      # arches) + the three iOS static libs (vendored BoringSSL, build.rs patched for the arm64 iOS
      # simulator); prepareQuicheNativeLib makes the host-arch JNI shim for the JVM tests. Both skip cargo
      # on a marker/cache hit.
      - name: Build quiche Apple native libs
        run: >-
          ./gradlew
          :socket-quic-quiche:buildQuicheAppleStaticLibs
          :socket-quic-quiche:prepareQuicheNativeLib
          --no-configuration-cache ${{ inputs.gradle-args }}

      # HARD check — the K/N link gates -force_load on each libquiche.a existing at configuration time, so
      # a build failure above would otherwise surface only as a confusing unresolved-symbol link error.
      - name: Verify Apple quiche static libs exist
        run: |
          set -euo pipefail
          missing=0
          for d in macos-arm64 macos-x64 ios-arm64 ios-simulator-arm64 ios-x64; do
            f="socket-quic-quiche/libs/quiche/$d/lib/libquiche.a"
            if [ ! -f "$f" ]; then echo "::error::missing $f"; missing=1; else echo "ok: $f"; fi
          done
          [ "$missing" = 0 ] || { echo "::error::quiche Apple static libs missing — the build step failed."; exit 1; }

      # ⚠️ include-hidden-files IS LOAD-BEARING — do not drop it.
      # The consumers skip their cargo builds via `onlyIf { !markerFile.exists() || ... }`, and every
      # marker is a DOTFILE inside lib/ (`.built-<ver>-qlog-<digest>`, `.jni-built-<ver>`,
      # `.bssl-vendored`). upload-artifact excludes hidden files by default, so without this the .a
      # files would arrive WITHOUT their markers and every consumer would silently re-run the
      # ~15-minute cargo build — a green run that quietly costs more than the serial version it
      # replaced. .github/actions/apple-quiche-env fails loudly if the markers ever go missing.
      - name: Upload Apple quiche natives
        id: upload_natives
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: quiche-apple-natives
          # Least common ancestor of the matched files is socket-quic-quiche/libs/quiche, so the
          # artifact holds <target>/lib/... and the consumers download it back to that same dir.
          path: socket-quic-quiche/libs/quiche/*/lib/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

      # ⚠️ Two-attempt upload. `actions/upload-artifact` classifies a 403 from the storage
      # intermediary at FinalizeArtifact as NON-retryable and gives up immediately. Here that would
      # fail the natives job and skip EVERY job in this workflow, so the retry matters more than it
      # did when this was one job. Observed 2026-08-10 on run 31422985484.
      - name: Upload Apple quiche natives (retry after transient finalize failure)
        if: steps.upload_natives.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: quiche-apple-natives
          path: socket-quic-quiche/libs/quiche/*/lib/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      # macOS dylibs consumed by validate-artifacts.yaml (it injects them into the published klibs to
      # smoke-test resolution); the artifact name + macos-* path are load-bearing for that job.
      # Kept as its own artifact rather than pointing validate at quiche-apple-natives, because that
      # one also carries the iOS archives (~200MB) validate has no use for.
      - name: Upload macOS quiche native libs
        id: upload_quiche_natives
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: quiche-macos-natives
          path: socket-quic-quiche/libs/quiche/macos-*/lib/
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload macOS quiche native libs (retry after transient finalize failure)
        if: always() && steps.upload_quiche_natives.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: quiche-macos-natives
          path: socket-quic-quiche/libs/quiche/macos-*/lib/
          retention-days: 1
          if-no-files-found: ignore
          overwrite: true

      # Surface the quiche cargo build transcript when this job failed, so a build failure (e.g. a
      # missing rustup target → E0463) is diagnosable from an artifact instead of hunting through
      # interleaved BoringSSL/cargo output in the job log.
      - name: Upload quiche build logs on failure
        if: ${{ failure() || cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: quiche-build-logs-apple
          path: '**/build/quiche-build-logs/'
          if-no-files-found: ignore
          retention-days: 7

      # ── The write half of the restore-only Gradle caches at the top of this job ──────────────
      # Only in main's ref scope — see the note on the restore steps. `!cancelled()` rather than
      # `success()` mirrors what actions/cache's post-step did (it saved on failure too);
      # continue-on-error because a save whose key already exists warns rather than fails, and a
      # cache problem must never redden the job every other job here is `needs:` on.
      #
      # ⚠️ The `cache-hit != 'true'` guard is NOT redundant with continue-on-error, and splitting
      # actions/cache into restore+save is exactly what makes it necessary. The full action knows
      # it restored an EXACT primary-key hit and skips its own post-save; `actions/cache/save` has
      # no such knowledge and will happily re-save every run. @actions/cache tars the directory
      # FIRST and only then reserves the cache entry, so on the common already-cached main run
      # these steps would tar ~1GB of ~/.gradle/caches and only then discover the key is taken —
      # minutes of wasted wall time per run, silently swallowed by continue-on-error. `cache-hit`
      # is true only on an exact primary-key match (a restore-keys prefix hit leaves it false),
      # which is precisely when a re-save would be a no-op anyway.
      - name: Save Gradle build outputs (main only)
        id: save_gradle_caches
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.restore_gradle_caches.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.gradle/caches
          key: gradle-macos-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Save Gradle wrapper distribution (main only)
        id: save_gradle_wrapper
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.restore_gradle_wrapper.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-macos-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      # See the twin of this step in build-linux.yaml for the full story. Short version:
      # `continue-on-error: true` rewrites a FAILED step's `conclusion` to `success`, and these two
      # saves are refused on the merged.yaml/`pull_request_target` path with "cache write denied:
      # token has no writable scopes". Apple never noticed because native-deps-freshness.yaml's
      # cache-warm-apple job holds `actions/cache@v6` (not restore-only) for the same two keys and
      # quietly does the writing — the Linux warm job did not, which is exactly why Linux starved.
      # `outcome` is the unmasked result. Annotation only, never `exit 1`.
      - name: Surface a masked cache-save failure
        if: ${{ !cancelled() && (steps.save_gradle_caches.outcome == 'failure' || steps.save_gradle_wrapper.outcome == 'failure') }}
        run: |
          echo "::warning::A Gradle cache SAVE failed here and continue-on-error hid it (caches=${{ steps.save_gradle_caches.outcome }}, wrapper=${{ steps.save_gradle_wrapper.outcome }}). Expected on the merged.yaml/pull_request_target path; native-deps-freshness.yaml's cache-warm-apple job is the real writer for gradle-macos-* / gradle-wrapper-macos-*."

  # ── Stage 2a: Kotlin/Native test shards ──────────────────────────────────────────────────────
  # Task names are UNQUALIFIED (no leading colon) so Gradle runs them in every subproject that has
  # them — a leading-colon `:macosX64Test` would run only the ROOT project's test and silently skip
  # socket-quic-quiche / socket-http3 / socket-webtransport (a false green). The full QUIC suites are:
  #   - socket-quic-quiche AppleQuicheEngineLoopbackTest (quiche client over NW-UDP <-> dual-stack
  #     IPv6 POSIX server)
  #   - socket-http3 AppleHttp3LoopbackTest (the HTTP/3 stack)
  #   - socket-webtransport AppleWebTransportTest (the WebTransport server stack)
  # macosArm64Test is NOT here — it runs in integration-macos-arm64 from the prebuilt .kexe the
  # `link` job uploads. iosSimulatorArm64Test runs the quiche loopback for real (the POSIX/NW
  # datapath needs no Network.framework listener, so it works standalone); the H3/WebTransport
  # suites self-skip on the standalone sim (no testcerts/ cwd). tvOS/watchOS have no quiche target
  # → UnsupportedQuicEngine, so their QUIC suites skip cleanly.
  # NOT continue-on-error: a real Apple test failure must stay red.
  kn-tests:
    name: "K/N ${{ matrix.shard.name }}"
    needs: natives
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      # One shard's failure must not cancel the others — with fail-fast the first red shard hides
      # whether the rest would have passed, which is the single most useful thing to know when
      # triaging a multi-target Kotlin/Native break.
      fail-fast: false
      matrix:
        shard:
          # ⚠️ The macOS x64 suite is split with `-x`, NOT with a hand-kept list of qualified
          # `:module:macosX64Test` task paths, and that choice is load-bearing. An explicit list is
          # exactly the false-green this file already warns about above: add a module (or an Apple
          # target to an existing one) and its tests silently stop running, with everything green.
          # `-x` inverts the failure mode — the unqualified task still means "every subproject that
          # has one", so a new module automatically lands in the `rest` shard. The only thing the
          # split can get wrong is running something twice, which is loud and cheap.
          #
          # socket-quic-quiche is peeled off because it carries the real QUIC loopback suites and
          # dominates the lane; the two together were 827s of a 864s job before this split.
          #
          # `requireAllTests` turns a skipped test into a hard failure on the lanes whose first
          # inventory came back empty (see the skip-inventory step). It is deliberately absent from
          # the three simulator shards, which still legitimately skip.
          #
          # ⚠️ The reason is NOT the one this comment used to give, and the difference decides when
          # the flag can be set. Re-measured from the markers in run 31890681923, the 115 skips split
          # into TWO causes, not one:
          #
          #   simulator-lacks-fixtures        93  AppleHttp3LoopbackTest (31 x 3 lanes)
          #   simulator-lacks-network-services 22  AppleWebTransportTest (5 x 3) + QuicHarnessIntegrationTests (7, iOS)
          #
          # #359 fixed the first 93 by exporting each module's testcerts/ into the sandbox by
          # absolute path (see the root build.gradle.kts). It cannot fix the other 22: those suites
          # skip because `simctl spawn --standalone` runs outside launchd_sim, so the network daemons
          # a connection needs are unreachable wherever the certs are. That is #81, and it needs a
          # booted-mode lane (`standalone = false`), not a fixture.
          #
          # So setting requireAllTests: "1" here today would convert 22 correct, documented skips into
          # a permanently red lane — the SkipGate docs' exact "a gate that cannot be satisfied is not
          # a gate". It goes on when #81 lands and the inventory reads zero, and not before.
          - name: "macOS x64 (quiche)"
            tasks: ":socket-quic-quiche:macosX64Test"
            requireAllTests: "1"
          - name: "macOS x64 (all other modules)"
            tasks: "macosX64Test -x :socket-quic-quiche:macosX64Test"
            requireAllTests: "1"
          - name: "iOS simulator"
            tasks: "iosSimulatorArm64Test"
          # tvOS and watchOS split apart: together they were 791-833s, the second-longest lane.
          # Neither has a quiche target (→ UnsupportedQuicEngine), so their QUIC suites skip
          # cleanly and what remains is mostly compile time, which parallelises well.
          - name: "tvOS simulator"
            tasks: "tvosSimulatorArm64Test"
          - name: "watchOS simulator"
            tasks: "watchosSimulatorArm64Test"
          # ktlint gets its OWN lane. It rode the macOS x64 lane, then moved to the compile lane
          # when that was split — and took the bottleneck with it both times, because it is ~400s
          # of work in its own right (measured: the ILP32 lane went 414s -> 813s the moment ktlint
          # landed on it). It depends on no native artifact and no test, so it parallelises freely.
          - name: "ktlint"
            tasks: "ktlintCheck"
          # Compile (can't run — no device) the test sources for the Apple *device* targets that
          # nothing else covers. The simulator lanes above are all 64-bit, so they cannot catch an
          # ILP32 regression: watchosArm64 is arm64_32, where K/N maps `ssize_t` to Int while every
          # other Apple target maps it to Long. A width-dependent comparison therefore compiles
          # clean on macOS/iOS/tvOS and on the watchOS *simulator*, and fails only here — exactly
          # how socket-udp's HostLoopback.apple.kt was broken for watchosArm64 while looking fine
          # everywhere (#280). Cheap: compile only, no link, no run.
          - name: "device-target compile (ILP32 guard)"
            tasks: "compileTestKotlinWatchosArm64 compileTestKotlinTvosArm64 compileTestKotlinIosArm64"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/apple-quiche-env
        id: quiche_env

      - name: Run ${{ matrix.shard.name }}
        env:
          SOCKET_REQUIRE_ALL_TESTS: ${{ matrix.shard.requireAllTests }}
        run: >-
          ./gradlew
          ${{ matrix.shard.tasks }}
          --no-configuration-cache ${{ inputs.gradle-args }}

      # The simulator shards are the reason this exists: `wrapTestBody` early-returns there, and on
      # Kotlin/Native an early return is reported as a PASS, so the iOS/tvOS/watchOS lanes were
      # green while running none of the HTTP/3 or WebTransport suites. Reports only — never fails.
      - uses: ./.github/actions/skip-inventory
        if: ${{ !cancelled() }}

      # ⚠️ Restores the Kotlin/Native build cache that the fan-out otherwise LOSES.
      #
      # The monolith saved one ~1GB gradle-macos-* entry containing every compiled klib, because
      # one job did all the compiling. After the split, `natives` is the single cache writer — and
      # `natives` only runs cargo and a Gradle configure, so the entry it saves holds no klibs at
      # all (measured: 258MB here vs 1088MB on a pre-fan-out PR). Every shard then recompiled the
      # klibs cold on every run, quietly giving back much of what the parallelism bought.
      #
      # This shard compiles the widest set (unqualified macosX64Test = every module) so it is the
      # designated writer of a SECOND key that actually contains build-cache-1 output. The other
      # shards restore it (see apple-quiche-env) and get the shared commonMain metadata and
      # dependency resolution even though their own target's klibs are not in it.
      #
      # Deliberately NOT per-shard keys: five ~1GB entries would blow the repo's 10GB Actions cache
      # cap and trigger exactly the LRU eviction that makes a "cached" quiche build cost 514s.
      # if: !cancelled() — the klibs compiled before a test assertion failed are still valid and
      # worth keeping; gating on success would mean a flaky lane also poisons the next run's cache.
      # continue-on-error: a save whose key already exists warns rather than fails, and a cache
      # problem must never turn a green test lane red.
      #
      # ⚠️ main's ref scope only, like the two gradle-macos entries in `natives`. This is the single
      # largest per-ref entry in the repo (713MB); written per PR ref it was pure eviction pressure,
      # because a PR ref's copy is read only by that PR and dies with it. Written on main it is
      # prefix-restorable by every PR (apple-quiche-env's restore-keys start at `gradle-macos-kn-`).
      # merged.yaml runs this workflow on `pull_request_target: closed`, i.e. as main, so the entry
      # is refreshed on every merge.
      #
      # ⚠️ Same `cache-hit != 'true'` guard as the two saves in `natives`, and it matters most here:
      # this is the repo's single largest entry (713MB-1GB). A cache key is immutable once written,
      # so on an exact hit this save can only fail to reserve — but `actions/cache/save` tars the
      # whole directory BEFORE it tries, so an unguarded step burns minutes taring a gigabyte to
      # throw it away, with continue-on-error hiding the waste. The exact-hit case is common on
      # main: this key rotates only on build-script/version-catalog/wrapper changes, so every merge
      # that touches source alone hits it. `cache-hit` comes from apple-quiche-env's output because
      # the restore lives inside that composite action.
      - name: Save Gradle build outputs (K/N klibs)
        if: ${{ !cancelled() && matrix.shard.name == 'macOS x64 (all other modules)' && github.ref == 'refs/heads/main' && steps.quiche_env.outputs.gradle-cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.gradle/caches
          key: gradle-macos-kn-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Upload test reports (on failure)
        if: ${{ failure() || cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          # Artifact names must be unique across the run; the shard names contain spaces and '+',
          # which are fine in an artifact name but are normalised here for readability.
          name: test-reports-apple-kn-${{ strategy.job-index }}
          # Report globs are module-agnostic on purpose: a hand-kept module list silently drops
          # the one module that failed (test-reports-linux missed :socket-http3's XML this way).
          path: |
            **/build/reports/tests/
            **/build/test-results/
            build/reports/ktlint/
          retention-days: 7
          if-no-files-found: ignore

  # ── Stage 2b: JVM quiche suites (JNI and FFM backends) ───────────────────────────────────────
  # :socket-quic-quiche on the JVM — the only place FFM-on-macOS and the IS_BSD sockaddr decode run.
  # The two backends were sequential steps in one job purely because they shared it; they are
  # independent (the old `if: !cancelled()` on the FFM step existed to express exactly that), so
  # they are now two parallel jobs. -PquicheJvmBackend=ffm prepends the java21/Panama loader.
  # QUIC_MIGRATION_REQUIRE_RUN=1 turns a clean skip of the active-migration test into a hard failure
  # so a broken native can't pass as green.
  jvm-tests:
    name: "JVM quiche (${{ matrix.backend.name }})"
    needs: natives
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        backend:
          - name: "JNI"
            args: ""
          - name: "FFM"
            args: "-PquicheJvmBackend=ffm"
    env:
      QUIC_MIGRATION_REQUIRE_RUN: "1"
      # See the provisioning step below: this asserts the alias exists, so a skip for want of it
      # becomes a failure naming that step rather than a plausible-looking host limitation.
      QUIC_LOOPBACK_ALIAS_PROVISIONED: "1"
    steps:
      - uses: actions/checkout@v7
      # konan: false — this lane is JVM-only, so restoring the ~450MB Kotlin/Native toolchain would
      # be pure download cost.
      - uses: ./.github/actions/apple-quiche-env
        with:
          konan: "false"

      # `streamSurvivesActiveMigrationToLoopbackAlias` migrates to a different local **address**
      # rather than a different port — the case closest to a real Wi-Fi↔cellular handoff, and the
      # only JVM-lane test that covers it. Linux binds all of 127.0.0.0/8 by default so it runs
      # there; macOS binds only 127.0.0.1, so on this lane the test skipped and the platform where
      # most QUIC development happens had strictly weaker migration coverage than Linux, silently
      # (#391).
      #
      # One privileged command fixes it. Runners already grant passwordless sudo, and the alias lives
      # only for the life of the VM.
      #
      # The verification is not decoration: `ifconfig alias` reports success for an address the
      # kernel then refuses to bind (a duplicate, a conflicting route), so the exit status alone is
      # not evidence. Binding it is. If this step is ever removed or silently stops working, the
      # QUIC_LOOPBACK_ALIAS_PROVISIONED flag above turns the resulting skip into a red naming it.
      - name: Provision the 127.0.0.2 loopback alias (#391)
        run: |
          set -euo pipefail
          sudo ifconfig lo0 alias 127.0.0.2 up
          ifconfig lo0
          python3 - <<'PY'
          import socket, sys
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          try:
              s.bind(("127.0.0.2", 0))
              print("127.0.0.2 is bindable ->", s.getsockname())
          except OSError as e:
              print("::error title=Loopback alias not usable::ifconfig reported success but 127.0.0.2 is not bindable: %s" % e)
              sys.exit(1)
          finally:
              s.close()
          PY

      # ⚠️ 20 min, NOT the 8 the monolith used or the 12 this job first carried over. Both were
      # sized for a world where this step ran AFTER the JNI step in the SAME job, so compilation
      # was already done and the Gradle daemon was warm. Fanned out, each backend lane compiles
      # from cold, and the step legitimately grew: measured 618s, 637s, then 733s across three
      # runs on equivalent content — the third tripped the 720s limit and failed a green suite.
      # That is a timeout mis-sized by the split, not a hang.
      # The limit still earns its place: it fires faster than the job timeout and names the step.
      # A genuine hang is bounded by timeout-minutes: 30 at job level.
      - name: Run socket-quic-quiche JVM tests (${{ matrix.backend.name }})
        timeout-minutes: 20
        env:
          # This lane builds its own natives, so nothing in SkipReason can legitimately fire here —
          # and its first inventory confirmed zero. A skip now means the artifact plumbing broke.
          SOCKET_REQUIRE_ALL_TESTS: "1"
        run: >-
          ./gradlew :socket-quic-quiche:jvmTest ${{ matrix.backend.args }} --continue
          --no-configuration-cache ${{ inputs.gradle-args }}

      # This lane builds its own natives, so a `native-library-unavailable` skip here means the
      # artifact plumbing broke — the case that used to erase ~38 test classes from a green run.
      - uses: ./.github/actions/skip-inventory
        if: ${{ !cancelled() }}

      # Test reports on failure — includes the JVM hs_err/replay crash logs: a native abort
      # (quiche/JNI/FFM SIGABRT/SIGSEGV) shows only as "exit value 134" with no failing JUnit case
      # otherwise. continue-on-error: this is diagnostics for an already-failing job, and a finalize
      # 403 here must not replace the real failure with an artifact error in the job summary.
      - name: Upload test reports (on failure)
        if: ${{ failure() || cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-apple-jvm-${{ matrix.backend.name }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/hs_err_pid*.log
            **/replay_pid*.log
          retention-days: 7
          if-no-files-found: ignore

  # ── Stage 2c: link the macosArm64 test binaries for the integration job ──────────────────────
  link:
    name: "Link macosArm64 test binaries"
    needs: natives
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/apple-quiche-env

      # UNQUALIFIED so every module with a macosArm64 test target is linked — socket-quic-quiche /
      # socket-http3 / socket-webtransport carry the real Apple QUIC/H3/WebTransport loopback
      # suites. The K/N link -force_loads each libquiche.a, so the .kexe is self-contained: the
      # integration job needs no quiche libs and no Docker harness.
      #
      # ⚠️ verifyGeneratedTestCerts is NOT optional here, and this job is the only place it can run —
      # the same trap build-linux's link job documents. socket-quic-quiche/testcerts/{localhost,
      # pinned}* are git-ignored and minted ONLY by generateLocalhostCert / generatePinnedW3cCerts,
      # which build.gradle.kts wires to `(jvm|linuxX64|macos|ios|tvos|watchos)\w*Test` — a regex
      # `linkDebugTestMacosArm64` does not match. The integration job runs the raw .kexe with no
      # Gradle at all, so without this the checkout's testcerts/ holds only the two committed files
      # and the Apple CA-/hash-pinning tests die on AppleTestCerts.MissingGeneratedFixture.
      # The verify task depends on both generators, so it both MINTS the fixtures and fails here,
      # in the producing job, if any is missing. PEMs are all these suites read — no .p12.
      - name: Link macosArm64 test binaries (+ mint and verify the generated TLS fixtures)
        run: >-
          ./gradlew linkDebugTestMacosArm64
          :socket-quic-quiche:verifyGeneratedTestCerts
          --no-configuration-cache ${{ inputs.gradle-args }}

      # The artifact boundary is the other half of the guard. upload-artifact silently drops what it
      # cannot match (hidden files are the classic — that is how the cargo skip markers vanished and
      # bought a silent 15min rebuild per shard, still green), and the run step in the integration
      # job only errors when ZERO kexes arrive — so losing ONE module's binary would quietly delete
      # a whole suite's coverage and still pass. Record exactly what this job produced; the
      # integration job asserts the same set came back. Derived by find, so it needs no maintenance
      # when a module or fixture is added.
      - name: Record the artifact manifest
        run: |
          set -euo pipefail
          mkdir -p build/ci
          # The grep mirrors upload-artifact's own default (include-hidden-files: false): a path with
          # a hidden segment is NOT uploaded, so listing one here would fail the integration job for a
          # file that was never shipped in the first place.
          {
            find . -path '*/build/bin/macosArm64/debugTest/test.kexe' -type f
            find socket-quic-quiche/testcerts -type f
          } | sed 's|^\./||' | { grep -vE '(^|/)\.' || true; } | LC_ALL=C sort > build/ci/macos-arm64-manifest.txt
          count=$(wc -l < build/ci/macos-arm64-manifest.txt | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "::error::linkDebugTestMacosArm64 produced no test.kexe — nothing to ship"
            exit 1
          fi
          echo "artifact must carry $count files:"
          cat build/ci/macos-arm64-manifest.txt

      # ⚠️ Two-attempt upload — see the natives upload above for the non-retryable-403 story.
      - name: Upload macosArm64 test binaries
        id: upload_test_binaries
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-test-binaries
          # Glob across modules; upload-artifact strips the common ancestor (repo root, since the root
          # module's path has no module prefix), so each file keeps its <module>/build/bin/... path and
          # restores there on download — exactly where it must sit to find <module>/testcerts/.
          # testcerts/ rides along for the reason the link step above explains: the generated
          # localhost*/pinned* fixtures exist only where a Gradle task minted them. Adding it keeps the
          # common ancestor at the repo root, so the .kexe paths are unchanged. (Committed cert.crt/
          # cert.key ride along too and land byte-identical on top of the checkout's copies.)
          path: |
            **/build/bin/macosArm64/debugTest/test.kexe
            socket-quic-quiche/testcerts/
            build/ci/macos-arm64-manifest.txt
          retention-days: 1
          if-no-files-found: error

      - name: Upload macosArm64 test binaries (retry after transient finalize failure)
        if: steps.upload_test_binaries.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-test-binaries
          path: |
            **/build/bin/macosArm64/debugTest/test.kexe
            socket-quic-quiche/testcerts/
            build/ci/macos-arm64-manifest.txt
          retention-days: 1
          if-no-files-found: error
          # The first attempt may have registered the name before failing to finalize.
          overwrite: true

  # ── Stage 2d: publish ────────────────────────────────────────────────────────────────────────
  # OFF THE TEST CRITICAL PATH. This job depends only on the natives, never on the test results —
  # which is safe because the caller's `needs: build-apple` waits for this whole workflow, tests
  # included, before `validate`/`publish-to-central` run. Previously this sat behind ~30 minutes of
  # tests in the same job for no reason other than colocation.
  publish:
    name: "Publish Apple targets to Maven Local"
    needs: natives
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/apple-quiche-env

      - name: Publish Apple targets to Maven Local
        run: >-
          ./gradlew --no-configuration-cache ${{ inputs.gradle-args }}
          publishKotlinMultiplatformPublicationToMavenLocal
          publishIosArm64PublicationToMavenLocal
          publishIosSimulatorArm64PublicationToMavenLocal
          publishIosX64PublicationToMavenLocal
          publishMacosArm64PublicationToMavenLocal
          publishMacosX64PublicationToMavenLocal
          publishTvosArm64PublicationToMavenLocal
          publishTvosSimulatorArm64PublicationToMavenLocal
          publishTvosX64PublicationToMavenLocal
          publishWatchosArm64PublicationToMavenLocal
          publishWatchosSimulatorArm64PublicationToMavenLocal
          publishWatchosX64PublicationToMavenLocal

      - name: Upload Maven local artifacts
        id: upload_maven_local
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: maven-local-apple
          path: ~/.m2/repository/com/ditchoom
          retention-days: 3

      # Consumer Smoke + validate-artifacts both download this; losing it to a finalize 403 would
      # skip them and cost the whole publish-path signal.
      - name: Upload Maven local artifacts (retry after transient finalize failure)
        if: steps.upload_maven_local.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: maven-local-apple
          path: ~/.m2/repository/com/ditchoom
          retention-days: 3
          overwrite: true

  # ── Stage 3: run the linked macosArm64 binaries ──────────────────────────────────────────────
  # Split out of the old monolith exactly as integration-linux-{x64,arm64} are: `link` builds the
  # .kexe (self-contained, libquiche.a -force_loaded), this job runs it. The Apple QUIC/H3/
  # WebTransport suites are in-process loopback — no Docker harness — and locate their TLS fixtures
  # via a cwd-relative <module>/testcerts/ fallback, so cwd=repo-root plus that directory is all they
  # need. The directory arrives in two halves: the COMMITTED cert.crt/cert.key from the checkout, and
  # the git-ignored localhost*/pinned* fixtures, which only Gradle can mint and so ride the `link`
  # artifact. No Gradle runs here, so a checkout on its own would leave the pinning suites broken.
  integration-macos-arm64:
    name: "Integration Tests (macOS ARM64)"
    needs: link
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      # Checkout supplies the committed <module>/testcerts/ the loopback suites fall back to.
      - uses: actions/checkout@v7

      # Restores each module's test.kexe to its <module>/build/bin/macosArm64/debugTest/ path
      # (the artifact preserved the repo-root-relative structure), so running from repo root
      # resolves the per-module testcerts/ fallback — and drops the Gradle-generated
      # socket-quic-quiche/testcerts/{localhost,pinned}* fixtures next to the committed ones.
      - name: Download macosArm64 test binaries
        uses: actions/download-artifact@v8
        with:
          name: macos-arm64-test-binaries

      # Fail HERE, at the boundary, rather than 20 minutes later inside a test — or not at all, if the
      # loss was a whole module's binary. The link job recorded what it produced; anything that did
      # not survive the round-trip is named individually.
      - name: Verify the artifact carried everything the link job produced
        run: |
          set -uo pipefail
          manifest=build/ci/macos-arm64-manifest.txt
          if [ ! -f "$manifest" ]; then
            echo "::error::$manifest did not arrive in macos-arm64-test-binaries — either the link job failed to record it, or upload-artifact dropped it"
            exit 1
          fi
          rc=0
          while IFS= read -r f; do
            if [ ! -e "$f" ]; then
              echo "::error::$f was produced by the link job but did not survive the artifact round-trip"
              rc=1
            fi
          done < "$manifest"
          if [ "$rc" -eq 0 ]; then
            echo "all $(wc -l < "$manifest" | tr -d ' ') files from the link job are present"
          fi
          exit $rc

      - name: Run macosArm64 tests (all modules)
        run: |
          set -uo pipefail
          # find (not a `**` globstar) so this is portable to the macOS runner's bash 3.2.
          # The download brought only macosArm64 binaries, so any test.kexe is one of ours —
          # this matches both the structure-preserved paths and a flattened single file.
          found=$(find . -name test.kexe -type f)
          if [ -z "$found" ]; then
            echo "::error::no macosArm64 test.kexe downloaded — check the linkDebugTestMacosArm64 upload in the link job"
            exit 1
          fi
          rc=0
          : > /tmp/macos-arm64.log
          while IFS= read -r bin; do
            echo "==================== $bin ===================="
            chmod +x "$bin"
            # cwd = repo root so each module's <module>/testcerts/cert.* fallback resolves.
            "$bin" 2>&1 | tee -a /tmp/macos-arm64.log || rc=1
          done <<< "$found"
          exit $rc

      # Standalone .kexe runs print results to stdout (no JUnit XML like a Gradle run), so on
      # failure capture the combined log for diagnosis.
      - name: Upload macosArm64 test log (on failure)
        if: ${{ failure() || cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-test-log
          path: /tmp/macos-arm64.log
          retention-days: 7
          if-no-files-found: ignore
