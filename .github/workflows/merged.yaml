name: "Build Test and Deploy"
on:
  pull_request_target:
    branches: [ main ]
    types:
      - closed
  workflow_dispatch:
    inputs:
      version-bump:
        description: "Version bump"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      flow:
        description: "Release flow"
        type: choice
        options:
          - release
          - draft
          - dry-run
        default: release

# `actions: write` is the documented requirement for the Actions cache write endpoint, and this
# block is exhaustive — every scope not listed here is `none`, so before this line the token
# reaching build-linux.yaml/build-apple.yaml carried only `Contents: write, Metadata: read` and
# every `actions/cache/save` on the release path was refused with
#     cache write denied: token has no writable scopes
# Granting it is necessary but may well not be sufficient: native-deps-freshness.yaml writes those
# same cache keys successfully with a strictly narrower token (`contents: read, issues: write`, no
# actions scope at all), so the refusal is at least partly about the `pull_request_target` context
# rather than the scope list. That is why the real fix is elsewhere — the cache-warm job in
# native-deps-freshness.yaml now owns writing the Linux Gradle keys, on a schedule/dispatch run
# that the cache service demonstrably accepts. This line just removes the one variable we can
# control; if the release path starts writing again too, that is a bonus (it keeps
# `gradle-linux-*` fresh after build-script edits, which the daily warm cannot).
permissions:
  contents: write
  actions: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check-release:
    name: Check if release is needed
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      flow: ${{ steps.check.outputs.flow }}
      gradle-args: ${{ steps.check.outputs.gradle-args }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Determine release flow
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Manual dispatch has no PR to inspect — take flow and version
          # bump straight from the workflow inputs. Lets us recover from a
          # failed publish (e.g. transient Central API hiccup) without
          # opening a sham PR to flip the classifier.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ inputs.version-bump }}" in
              major) echo "gradle-args=-PincrementMajor=true" >> $GITHUB_OUTPUT ;;
              minor) echo "gradle-args=-PincrementMinor=true" >> $GITHUB_OUTPUT ;;
              *)     echo "gradle-args=" >> $GITHUB_OUTPUT ;;
            esac
            echo "flow=${{ inputs.flow }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          gradle_args=""
          if ${{ contains(github.event.pull_request.labels.*.name, 'major') }}; then
            gradle_args="-PincrementMajor=true"
          elif ${{ contains(github.event.pull_request.labels.*.name, 'minor') }}; then
            gradle_args="-PincrementMinor=true"
          fi
          echo "gradle-args=${gradle_args}" >> $GITHUB_OUTPUT

          # Check for skip-release label
          if ${{ contains(github.event.pull_request.labels.*.name, 'skip-release') }}; then
            echo "flow=dry-run" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check for draft-release label
          if ${{ contains(github.event.pull_request.labels.*.name, 'draft-release') }}; then
            echo "flow=draft" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if only non-code files changed.
          # Use the paginated "list PR files" API rather than `gh pr diff`:
          # the latter hits the .diff endpoint, which GitHub caps at ~20k
          # lines / 300 files and returns HTTP 406 for larger PRs (this is
          # exactly what killed PR #48's deploy — the no-engine refactor
          # was +23,933 lines so the diff was rejected and the script
          # exited 1). The PR-files API returns objects with a `filename`
          # field and is paginated, so size-of-change doesn't matter.
          changed_files=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename')
          for file in $changed_files; do
            case "$file" in
              .github/*|*.md|.gitignore|.editorconfig|CLAUDE.md|LICENSE|*.txt)
                ;;
              *)
                echo "Code file changed: $file"
                echo "flow=release" >> $GITHUB_OUTPUT
                exit 0
                ;;
            esac
          done

          echo "Only non-code files changed, skipping"
          echo "flow=skip" >> $GITHUB_OUTPUT

  # One Maven Central version query for the whole run — the version that gets published, tagged,
  # and stamped onto the GHCR harness images all come from here. `check-release` decides the bump
  # (major/minor/patch), so this necessarily follows it. See compute-version.yaml and #329.
  version:
    needs: check-release
    if: needs.check-release.outputs.flow != 'skip'
    uses: ./.github/workflows/compute-version.yaml
    with:
      gradle-args: ${{ needs.check-release.outputs.gradle-args }}

  build-linux:
    needs: [check-release, version]
    if: needs.check-release.outputs.flow != 'skip'
    uses: ./.github/workflows/build-linux.yaml
    with:
      gradle-args: ${{ needs.check-release.outputs.gradle-args }}
      version: ${{ needs.version.outputs.version }}

  build-apple:
    needs: [check-release, version]
    if: needs.check-release.outputs.flow != 'skip'
    uses: ./.github/workflows/build-apple.yaml
    with:
      gradle-args: ${{ needs.check-release.outputs.gradle-args }}
      version: ${{ needs.version.outputs.version }}

  validate:
    needs: [check-release, version, build-linux, build-apple]
    if: needs.check-release.outputs.flow != 'skip'
    uses: ./.github/workflows/validate-artifacts.yaml
    with:
      version: ${{ needs.version.outputs.version }}

  # Per-platform QUIC harness coverage matrix. Same job as the one in
  # review.yaml — gates the release on QUIC validity in addition to the
  # platform builds passing. See review.yaml for the design rationale.
  quic-interop-summary:
    name: "QUIC Interop Summary"
    needs: [check-release, build-linux, build-apple]
    if: needs.check-release.outputs.flow != 'skip'
    runs-on: ubuntu-latest
    steps:
      - name: Download all QUIC audit artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: quic-audit-*
          path: /tmp/quic-audit
          merge-multiple: true
          # See review.yaml: `warn` (not the v8 default `error`) so a digest check on the tiny audit
          # files doesn't abort the download and red the summary on every merge.
          digest-mismatch: warn
        continue-on-error: true

      - name: Build interop matrix
        run: |
          shopt -s nullglob
          FILES=(/tmp/quic-audit/*.txt)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No QUIC audit artifacts found"
            {
              echo "## QUIC Interop Summary"
              echo ""
              echo "_No audit artifacts uploaded by any platform job._"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## QUIC Interop Summary"
            echo ""
            echo "| Platform | OK | SKIP | Status |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          FAILED=0
          # Buffer reason <details> blocks and flush AFTER the table — emitting
          # them inside the loop would split the markdown table.
          REASONS_OUT=$(mktemp)
          for f in "${FILES[@]}"; do
            platform=$(grep '^platform=' "$f" | cut -d= -f2)
            launched=$(grep '^launched=' "$f" | cut -d= -f2)
            applicable=$(grep '^applicable=' "$f" | cut -d= -f2)
            ok=$(grep '^ok=' "$f" | cut -d= -f2)
            skip=$(grep '^skip=' "$f" | cut -d= -f2)
            intentional_skip=$(grep '^intentional_skip=' "$f" | cut -d= -f2)
            reasons=$(grep '^reason=' "$f" | cut -d= -f2-)
            launched=${launched:-unknown}
            # applicable defaults true for older audit files that predate the field.
            applicable=${applicable:-true}
            ok=${ok:-0}
            skip=${skip:-0}
            intentional_skip=${intentional_skip:-0}

            if [ "$ok" -gt 0 ]; then
              status="✅ exercised"
            elif [ "$applicable" = "false" ]; then
              # The quiche QuicHarnessIntegrationTests doesn't run on this lane at all
              # (JS has no QUIC implementation; an Apple NW-only lane has no quiche target).
              # `ok=0,skip=0` is structural, not a silently all-skipped regression — that
              # platform's QUIC client (if any) is validated elsewhere. Render ℹ️, never fail.
              # NOTE: this branch must mirror review.yaml's copy of the same job — the two
              # had drifted (merged.yaml lacked it), reddening every release on the JS lane.
              status="ℹ️ platform gap (known)"
            elif [ "$skip" -gt 0 ] && [ "$intentional_skip" = "$skip" ]; then
              status="ℹ️ platform gap (known)"
            elif [ "$skip" -gt 0 ]; then
              status="❌ all skipped"
              FAILED=1
            elif [ "$launched" = "true" ]; then
              status="❌ no markers despite launch"
              FAILED=1
            else
              status="ℹ️ no data"
            fi

            echo "| $platform | $ok | $skip | $status |" >> "$GITHUB_STEP_SUMMARY"
            echo "platform=$platform launched=$launched applicable=$applicable ok=$ok skip=$skip intentional=$intentional_skip status=$status"

            if [ -n "$reasons" ] && { [ "$skip" -gt 0 ] || [ "$applicable" = "false" ]; }; then
              if [ "$applicable" = "false" ]; then
                detail="$platform — not applicable (known gap)"
              else
                detail="$platform — skip reasons ($skip skipped)"
              fi
              {
                echo ""
                echo "<details><summary>$detail</summary>"
                echo ""
                echo '```'
                echo "$reasons"
                echo '```'
                echo "</details>"
              } >> "$REASONS_OUT"
            fi
          done

          cat "$REASONS_OUT" >> "$GITHUB_STEP_SUMMARY"

          if [ "$FAILED" = "1" ]; then
            echo "::error::QUIC interop matrix failed — at least one platform's harness coverage broke"
            exit 1
          fi

  # `needs: validate` is load-bearing on the release path and must stay: validate depends on
  # build-linux + build-apple, so nothing reaches Central until every platform's tests are green.
  publish:
    needs: [check-release, version, validate]
    if: needs.check-release.outputs.flow == 'draft' || needs.check-release.outputs.flow == 'release'
    uses: ./.github/workflows/publish-to-central.yaml
    with:
      publishing-type: ${{ needs.check-release.outputs.flow == 'draft' && 'USER_MANAGED' || 'AUTOMATIC' }}
      version: ${{ needs.version.outputs.version }}
    secrets:
      GPG_KEY_CONTENTS: ${{ secrets.GPG_KEY_CONTENTS }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  # ── W7 (RFC_DETERMINISTIC_SIMULATION §8): publish the test-harness images ──
  # Multi-arch (linux/amd64 + linux/arm64) images for every harness service that has
  # a local build context — echo, rst, quic-echo, controller, udp-echo, udp-toxi —
  # pushed to GHCR as
  #   ghcr.io/<owner>/socket-test-harness-<name>:{<version>,latest}
  # so consumers can run test-harness/harness-consumer.yml with zero repo checkout
  # (the remaining services — nginx http, toxiproxy, netem — use stock images there).
  #
  # Release-flow ONLY, never PRs: gated on the same publish-success condition the git
  # tag in `finalize` uses, and versioned with the same build-linux `version` output,
  # so image tags always match the Maven Central release they shipped alongside.
  # `draft`/`dry-run` flows never push images (a dropped draft must not leave public
  # `latest` images pointing at an unreleased version).
  #
  # The quic-echo jar is NOT rebuilt here: build-linux already produced the multi-arch
  # fat jar (-PquicEchoAllArches=true → linux-x64 AND linux-arm64 quiche natives in one
  # jar, precisely so the same artifact runs under both manifests of the
  # eclipse-temurin base image) and uploaded the whole Docker context as an artifact.
  # Rebuilding would drag the entire Rust/BoringSSL toolchain into this job. The
  # controller jar IS built here — it is pure-JVM (no natives), a cheap compile.
  publish-harness-images:
    name: Publish harness images (GHCR)
    needs: [check-release, version, build-linux, publish]
    if: needs.check-release.outputs.flow == 'release' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job-level override of the workflow's `contents: write`: this job only reads the
    # repo but must push packages (GHCR).
    permissions:
      contents: read
      packages: write
    # The image tags below already come from the version job; pin the controller/udp-toxi jar build
    # to the same string so this job cannot compute a second, different version internally.
    env:
      ORG_GRADLE_PROJECT_version: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Download quic-echo Docker context
        uses: actions/download-artifact@v8
        with:
          name: quic-echo-docker-context
          path: test-harness/quic-echo/

      # No `cache: gradle` — see build-linux.yaml's `natives` job. setup-java's gradle cache stores
      # the whole ~/.gradle/caches tree under its own `setup-java-Linux-x64-gradle-*` key, i.e. a
      # duplicate of the tree the explicit `gradle-linux-*` entry already holds, and this repo is at
      # the 10GB Actions cache cap. This job builds two pure-JVM jars; it does not need to be a
      # cache writer at all.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      # :socket-testsuite:controllerJar is pure-JVM, but configuring the project pulls in
      # socket-quic-quiche's linuxArm64 target, whose :buildBoringsslArm64 cmake-configures with
      # aarch64-linux-gnu-g++. Without the cross-toolchain on PATH the job dies with
      # "CMAKE_C_COMPILER aarch64-linux-gnu-gcc ... not found in the PATH" (same fix as review.yaml /
      # android_integration.yaml / native-deps-freshness.yaml).
      # apt-safe-update first: an unused third-party source on the runner image can exit-100 the
      # whole job (see .github/actions/apt-safe-update). This is the RELEASE path.
      - uses: ./.github/actions/apt-safe-update
      - name: Install aarch64 GNU cross-compiler (for :buildBoringsslArm64) + libclang
        run: sudo apt-get install -y -o Acquire::Retries=3 gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross libclang-dev

      - name: Build harness controller + udp-toxi jars
        run: ./gradlew :socket-testsuite:controllerJar :socket-testsuite:udpToxiJar --no-configuration-cache

      # qemu gives buildx the arm64 emulation it needs for the linux/arm64 halves.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push harness images (multi-arch)
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          if [ -z "$version" ]; then
            echo "::error::the version job produced no output — refusing to tag images"
            exit 1
          fi
          # GHCR namespaces are lowercase; github.repository_owner is "DitchOoM".
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          for name in echo rst quic-echo controller udp-echo udp-toxi; do
            image="ghcr.io/${owner}/socket-test-harness-${name}"
            echo "=== ${image}:${version} + :latest (linux/amd64,linux/arm64) ==="
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --tag "${image}:${version}" \
              --tag "${image}:latest" \
              --push \
              "test-harness/${name}"
          done

  # ── Closed-PR cache housekeeping lives in .github/workflows/purge-pr-caches.yaml ─────────────
  # It was a job here. That was wrong: this workflow is serialized by `concurrency: {group: deploy,
  # cancel-in-progress: false}`, under which a newer PENDING run cancels the older pending one — so
  # in a multi-PR merge burst (exactly what pushes the repo over the 10GB cache cap) the cancelled
  # runs never reached the purge, and the dead `refs/pull/N/merge` entries survived their full
  # 7-day idle window. Cleanup must not queue behind the deploy lock, so it now has its own
  # `pull_request: closed` workflow with no concurrency group.

  finalize:
    name: Finalize Release
    needs: [check-release, version, build-linux, publish]
    if: always() && needs.check-release.outputs.flow != 'skip' && needs.check-release.outputs.flow != 'dry-run'
    runs-on: ubuntu-latest
    # No checkout, and no RELEASE_PAT. Every step below drives `gh` entirely through
    # `--repo="$GITHUB_REPOSITORY"` (or an explicit `repos/{owner}/{repo}/…` API path), so there is
    # no working tree to need and no local git context to resolve — GITHUB_REPOSITORY and
    # GITHUB_TOKEN are enough.
    #
    # This is the fix for the bug that lost the tags for v3.1.0, v3.1.1 and v4.3.2. The old
    # implementation did `git tag` + `git push`, which is checked by receive-pack: a GitHub App
    # token (which GITHUB_TOKEN is) may not introduce or update .github/workflows/* without the
    # `workflows` scope, and pushing a TAG at a commit containing workflow changes trips it:
    #   ! [remote rejected] v4.3.2 -> v4.3.2 (refusing to allow a GitHub App to create or update
    #   workflow .github/workflows/build-apple.yaml without workflows permission)
    # — each time after the artifacts were already live on Maven Central, so the release was
    # half-done and had to be backfilled by hand. Creating the ref through the REST API instead
    # is not subject to that hook: the commit is already on the remote, so no new workflow content
    # is introduced. No PAT is needed, by anyone, ever again — which also retires the
    # silent-degradation mode where an unconfigured RELEASE_PAT looked fine until release day.
    steps:
      # A draft release creates no tag until it is published, so this path never hit the tag-push
      # rejection below. `--target` is passed anyway so that when it IS published the tag lands on
      # the commit this run built, not on whatever main's head happens to be that day.
      - name: Create draft GitHub release
        if: needs.check-release.outputs.flow == 'draft' && needs.publish.result == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title || 'Manual release' }}
          PR_URL: ${{ github.event.pull_request.html_url || format('{0}/{1}', github.server_url, github.repository) }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          version="${{ needs.version.outputs.version }}"
          deployment_id="${{ needs.publish.outputs.deployment-id }}"
          staging_url="https://central.sonatype.com/publishing/deployments"

          gh release create "v${version}" \
              --draft \
              --repo="$GITHUB_REPOSITORY" \
              --target="$RELEASE_SHA" \
              --title="v${version}" \
              --notes="$(cat <<EOF
          ## [${PR_TITLE}](${PR_URL})

          **Status:** Awaiting validation in [Maven Central Staging](${staging_url})
          **Deployment ID:** \`${deployment_id}\`

          ### To complete release:
          1. Validate artifacts in Maven Central staging area
          2. Run the 'Complete or Cancel Release' workflow with action 'complete' and version '${version}'

          ### To cancel:
          1. Run the 'Complete or Cancel Release' workflow with action 'cancel' and version '${version}'
          2. This will drop the deployment and delete this draft release
          EOF
          )"

      # ⚠️ NO `git tag` + `git push` here — that is what has been silently losing release tags.
      #
      # A push is checked by receive-pack: a GitHub App token (which GITHUB_TOKEN is) may not
      # introduce or update .github/workflows/* without the `workflows` scope, and pushing a TAG
      # that points at a commit containing workflow changes trips that check:
      #   ! [remote rejected] v4.3.2 -> v4.3.2 (refusing to allow a GitHub App to create or update
      #   workflow .github/workflows/build-apple.yaml without workflows permission)
      # The publish to Maven Central had already succeeded, so v4.3.2 shipped with no tag and no
      # GitHub release — the third time (v3.1.0, v3.1.1) this exact thing happened, each fixed by
      # hand rather than in the workflow.
      #
      # `gh release create <tag> --target <sha>` creates the tag through the REST API instead. The
      # commit is already on the remote, so the ref creation introduces no workflow content and the
      # push-time check does not apply. No PAT, no fallback, no scope to forget to configure.
      #
      # WHICH COMMIT: github.sha, and it is the only correct choice here.
      #   • On `pull_request_target: closed` — this workflow's normal trigger — github.sha is the
      #     last commit on the PR's BASE branch, i.e. the squash/merge commit on main. It is also
      #     what actions/checkout resolved in build-linux, build-apple and validate, so it is
      #     literally the tree whose artifacts `publish` pushed to Central.
      #   • On workflow_dispatch it is the HEAD of the dispatched ref.
      #   NOT github.event.pull_request.head.sha: after a squash merge that commit does not exist
      #   on main at all, and tagging it would point the release at an unreachable PR head.
      #   NOT github.event.pull_request.merge_commit_sha either: absent on workflow_dispatch.
      # The containment check below turns "tagged something off main" from a silent mistake into a
      # loud failure, since the whole class of bug this step keeps hitting is silent.
      - name: Create tag and GitHub release
        if: needs.check-release.outputs.flow == 'release' && needs.publish.result == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title || 'Manual release' }}
          PR_URL: ${{ github.event.pull_request.html_url || format('{0}/{1}', github.server_url, github.repository) }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          version="${{ needs.version.outputs.version }}"
          tag="v${version}"

          # ── Idempotence is keyed on the RELEASE, not on the tag ──────────────────────────────
          # This step produces TWO artifacts (a tag and a GitHub release) and the failure mode it
          # exists to repair leaves exactly one of them behind. Keying the skip on the tag would
          # therefore make the documented recovery path a silent no-op: `gh api .../git/ref/tags/`
          # genuinely answers "yes" (unlike the old `git rev-parse`, which could only ever answer
          # "no" against this shallow tagless clone and so always fell through to the create).
          #
          # A tag-present/release-absent repo is not hypothetical — it is precisely what a
          # hand-backfilled tag leaves behind (v3.1.0, v3.1.1, v4.3.2), and what a finalize re-run
          # after a transient `gh release create` failure produces. Skipping on the tag would exit 0
          # having created nothing, in the one state a re-run is supposed to fix.
          #
          # Four states, all reachable, all handled:
          #   published release present  → clean no-op (v4.3.2 was just backfilled with both, so the
          #                                very next run meets this state for real)
          #   DRAFT release present      → hard error: a draft carries NO tag, so skipping here would
          #                                leave the version untagged — the exact bug this step fixes
          #   release absent, tag absent → normal path: create both
          #   release absent, tag present→ recovery: create the release ON the existing tag
          #
          # `gh release view` succeeds on a draft, so it alone cannot stand in for "already done":
          # a draft release has no git tag at all. Ask for isDraft explicitly rather than inferring.
          release_is_draft=$(gh release view "$tag" --repo="$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || echo absent)
          case "$release_is_draft" in
            false)
              echo "Release $tag already exists (published) — nothing to do."
              exit 0
              ;;
            true)
              echo "::error::A DRAFT release ${tag} already exists, and a draft carries no git tag — so treating it as 'already done' would leave ${tag} permanently untagged (the v3.1.0/v3.1.1/v4.3.2 failure). Publish it via the 'Complete or Cancel Release' workflow (action: complete, version: ${version}), or delete the draft, then re-run."
              exit 1
              ;;
          esac

          # Resolve through `commits/{ref}`, which PEELS an annotated tag to its commit. `git/ref/tags`
          # returns the tag OBJECT sha for annotated tags, and every tag this recovery path exists for
          # was hand-backfilled with `git tag` — so that spelling would fire the mismatch warning below
          # on its own primary use case.
          tag_commit=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq '.sha' 2>/dev/null || true)
          if [ -n "$tag_commit" ]; then
            # Recovery path. `target_commitish` is documented as "unused if the Git tag already
            # exists", so the existing tag stays authoritative and --target is deliberately omitted
            # rather than passed-and-ignored. The containment guard below is skipped with it: it
            # guards the CREATION of a ref, and no ref is being created here.
            echo "::notice::Tag ${tag} already exists (-> ${tag_commit}) but has no GitHub release — creating the release on the existing tag."
            if [ "$tag_commit" != "$RELEASE_SHA" ]; then
              echo "::warning::${tag} points at ${tag_commit}, not this run's ${RELEASE_SHA}. Keeping the existing tag."
            fi
            target_args=()
          else
            # Refuse to tag a commit that is not on the default branch. `compare` reports the head's
            # relationship to the base: `identical` (it IS main's head) or `behind` (main has moved
            # on since) are both fine; `ahead`/`diverged` mean RELEASE_SHA is not on main.
            default_branch=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')
            status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${default_branch}...${RELEASE_SHA}" --jq '.status')
            case "$status" in
              identical|behind)
                echo "Tagging ${RELEASE_SHA} (${status} vs ${default_branch})"
                ;;
              *)
                echo "::error::${RELEASE_SHA} is '${status}' relative to ${default_branch} — refusing to tag ${tag} off the default branch."
                exit 1
                ;;
            esac
            target_args=(--target="${RELEASE_SHA}")
          fi

          # Creates the tag via the API as a side effect of creating the release (normal path), or
          # attaches the release to the tag that is already there (recovery path).
          maven_url="https://central.sonatype.com/artifact/com.ditchoom/socket/${version}"
          # ${a[@]+"${a[@]}"} — expanding an EMPTY array under `set -u` is fatal on bash < 4.4.
          # ubuntu-latest ships 5.2, but the guard costs nothing and survives a runner/shell change.
          gh release create "$tag" \
              --repo="$GITHUB_REPOSITORY" \
              ${target_args[@]+"${target_args[@]}"} \
              --title="${tag}" \
              --notes="$(cat <<EOF
          ## [${PR_TITLE}](${PR_URL})

          **Maven Central:** [com.ditchoom:socket:${version}](${maven_url})
          EOF
          )"
