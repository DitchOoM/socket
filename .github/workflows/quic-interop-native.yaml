name: QUIC interop, native lanes

# Our endpoint and foreign QUIC endpoints run natively on macOS (Apple silicon) and Windows, over loopback,
# so the socket layer under test is the platform's own: the JVM's NIO on macOS and Windows. The endpoint
# runs on JDK 21 with the multi-release classes on, so quiche is the FFM backend on both, as for a consumer. The
# quic-interop-runner needs Docker and a simulated Linux network, which neither runner offers here, so
# test-harness/quic-interop/native-pair.py runs each pair and checks every download byte for byte, writing
# the runner's result shape for .github/scripts/quic-interop-gate.py to judge against the same
# expectations file (directions prefixed with the lane: macos-arm64-our-client, ...).
#
# A third lane runs our client as Kotlin/Native, on macOS arm64 and in a booted iOS simulator.
#
# Peers: quic-go, built from source and patched to take its paths and port from the environment
# (.github/scripts/build-quic-go-interop.sh). Cases: handshake, transfer, resumption, zerortt, and our
# client's active-migration transfer. Weaker than the runner: no capture (resumption and 0-RTT are judged by
# the files alone) and no network simulator.

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      apple-natives-run-id:
        description: "Run holding the quiche-apple-natives artifact."
        required: true
        type: string
      windows-natives-run-id:
        description: "Run holding the quiche-windows-natives artifact."
        required: true
        type: string
      stale:
        required: false
        default: "warn"
        type: string
      record:
        required: false
        default: "gate"
        type: string

permissions:
  contents: read
  actions: read

env:
  ORG_GRADLE_PROJECT_version: ${{ inputs.version }}
  TESTS: handshake,transfer,resumption,zerortt

jobs:
  macos-arm64:
    name: "macOS arm64 (JVM)"
    runs-on: macos-26
    timeout-minutes: 60
    env:
      LANE: macos-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/apple-quiche-env
        with:
          konan: "false"
          natives-run-id: ${{ inputs.apple-natives-run-id }}
          github-token: ${{ github.token }}
      - name: Build the endpoint jar
        run: ./gradlew :socket-quic-quiche:quicInteropJar -PappleTargets=false --no-configuration-cache
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Build quic-go's interop endpoints
        run: .github/scripts/build-quic-go-interop.sh "$RUNNER_TEMP/peers"
      - name: Run the pairs
        run: .github/scripts/quic-interop-native-run.sh
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: interop-results-native-macos-arm64
          path: interop-results
          retention-days: 14

  # Our client as Kotlin/Native: on macOS arm64, and inside a booted iOS simulator, the only place the
  # Apple client's Network.framework datapath meets a foreign QUIC stack. The client is the K/N test binary
  # (AppleQuicInteropClient, run through test-harness/quic-interop/kn-client.sh); there is no K/N server.
  macos-arm64-kn:
    name: "macOS arm64 + iOS simulator (Kotlin/Native)"
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/apple-quiche-env
        with:
          natives-run-id: ${{ inputs.apple-natives-run-id }}
          github-token: ${{ github.token }}
      # Linked before the simulator boots, so the link does not share the runner with the booting device.
      - name: Link the test binaries
        run: ./gradlew :socket-quic-quiche:linkDebugTestMacosArm64 :socket-quic-quiche:linkDebugTestIosSimulatorArm64 --no-configuration-cache
      - name: Boot an iOS simulator
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid // empty')
          if [ -z "$UDID" ]; then
            echo "::error::no available iPhone simulator to boot"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl boot "$UDID" || true # already booted is fine
          xcrun simctl bootstatus "$UDID" -b
          echo "IOS_SIMULATOR_BOOTED_UDID=$UDID" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Build quic-go's interop endpoints
        run: .github/scripts/build-quic-go-interop.sh "$RUNNER_TEMP/peers"
      - name: Run the pairs
        run: .github/scripts/quic-interop-native-kn-run.sh
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: interop-results-native-kn
          path: interop-results
          retention-days: 14

  windows-x64:
    name: "Windows x64 (JVM)"
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      LANE: windows-x64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: actions/download-artifact@v8
        with:
          name: quiche-windows-natives
          path: socket-quic-quiche/libs/quiche/windows-x64/lib
          run-id: ${{ inputs.windows-natives-run-id }}
          github-token: ${{ github.token }}
      - name: Build the endpoint jar
        run: ./gradlew :socket-quic-quiche:quicInteropJar --no-configuration-cache
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Build quic-go's interop endpoints
        run: .github/scripts/build-quic-go-interop.sh "$RUNNER_TEMP/peers"
      - name: Run the pairs
        run: .github/scripts/quic-interop-native-run.sh
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: interop-results-native-windows-x64
          path: interop-results
          retention-days: 14

  gate:
    name: "native gate"
    needs: [macos-arm64, macos-arm64-kn, windows-x64]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: interop-results-native-*
          path: interop-results
          merge-multiple: true
      - name: Judge every cell against the expectations
        run: |
          set -uo pipefail
          exp=test-harness/quic-interop/expectations.json
          [ -f "$exp" ] || echo '{}' > "$exp"
          if [ "${{ inputs.record }}" = record ]; then
            python3 .github/scripts/quic-interop-gate.py judge "$exp" interop-results --record=/tmp/expectations-native.json | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 .github/scripts/quic-interop-gate.py judge "$exp" interop-results --stale=${{ inputs.stale }} | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.record == 'record' }}
        with:
          name: quic-interop-expectations-native
          path: /tmp/expectations-native.json
