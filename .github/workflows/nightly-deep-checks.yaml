name: Nightly deep checks

# Long runs of the checks whose short PR-time versions can only catch what a few minutes of search can:
#
#   Lincheck deep   the whole `:socket-quic-quiche:lincheckTest` task with every scenario and
#                   invocation budget multiplied (LINCHECK_SCALE).
#   Fuzz deep       every fuzz target the PR lanes run (Jazzer on the JVM, cargo-fuzz under ASAN on
#                   native, cargo-fuzz with BoringSSL under ASAN too), each for tens of minutes,
#                   resuming from the corpus the previous night left.
#   Soak deep       the native QuicConcurrencySoakTests binary, whole, over and over until a time
#                   budget is spent or one run fails (Linux x64 and macOS arm64).
#
# flake-sweep.yaml measures a failure RATE for suites known to flake; this looks for failures nobody has
# seen yet, so it stops at the first one and keeps the evidence. It is a separate workflow because its
# jobs run for hours on three runner kinds and a flake sweep is one job shape repeated.
#
# Reporting: the `report` job writes one table to the run summary every night. A green night stops
# there. A night with any check failed, timed out or not run files (or updates) one tracking issue and,
# when that issue already exists, comments on it so the night is notified.
#
# Nothing here publishes, deploys or writes a cache that the PR lanes read: Gradle, Konan, Cargo and
# native-library caches are restored only, and the corpus caches below carry a key prefix of their own.

on:
  schedule:
    # 10:17 UTC: off the top of the hour, when GitHub delays scheduled runs, and after flake-sweep
    # (06:41) and native-deps-freshness (09:17), which share the runner pool and the Linux native caches.
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      lincheck_scale:
        description: "Multiplier on every Lincheck scenario count and invocation count (work grows with its square; at most 12)"
        required: true
        default: "10"
      fuzz_minutes:
        description: "Minutes each fuzz target runs (at most 80)"
        required: true
        default: "40"
      soak_minutes:
        description: "Minutes each soak loop runs, after the binary is linked (at most 100)"
        required: true
        default: "45"

permissions:
  contents: read
  actions: read # borrow the newest natives artifacts; list this run's jobs and artifacts

concurrency:
  group: nightly-deep-checks
  cancel-in-progress: false

env:
  # build.gradle.kts refuses a CI build with no version. Nothing here is published.
  ORG_GRADLE_PROJECT_version: "0.0.0-deepchecks"
  # The budget the PR lanes run their QUIC tests under (see build-linux.yaml, build-apple.yaml).
  QUIC_TEST_TIME_SCALE: "3"

jobs:
  # The quiche natives are a per-run artifact of build-linux.yaml and build-apple.yaml's `natives` jobs,
  # kept one day. Borrow the newest unexpired ones, as flake-hunt.yaml does. When one is missing the jobs
  # that need it are skipped, and `report` counts a skipped check as a check that was not made.
  find-natives:
    name: Find natives
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      linux: ${{ steps.find.outputs.linux }}
      apple: ${{ steps.find.outputs.apple }}
    steps:
      # Job timeouts are fixed numbers (an expression cannot add), sized for these ceilings.
      - name: Check the duration inputs
        env:
          FUZZ_MINUTES: ${{ inputs.fuzz_minutes || '40' }}
          SOAK_MINUTES: ${{ inputs.soak_minutes || '45' }}
          LINCHECK_SCALE: ${{ inputs.lincheck_scale || '10' }}
        run: |
          set -euo pipefail
          for v in FUZZ_MINUTES SOAK_MINUTES LINCHECK_SCALE; do
            case "${!v}" in '' | *[!0-9]*) echo "::error::$v must be a whole number, got '${!v}'"; exit 1 ;; esac
          done
          [ "$FUZZ_MINUTES" -le 80 ] || { echo "::error::fuzz_minutes must be at most 80 (job timeout is 120)"; exit 1; }
          [ "$SOAK_MINUTES" -le 100 ] || { echo "::error::soak_minutes must be at most 100 (job timeout is 180)"; exit 1; }
          [ "$LINCHECK_SCALE" -le 12 ] || { echo "::error::lincheck_scale must be at most 12 (job timeout is 150 minutes; 12 is 144x the PR budget)"; exit 1; }

      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          newest() { # <artifact name> -> run id of the newest unexpired one, or nothing
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=$1&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty'
          }
          LINUX=$(newest quiche-linux-natives-full)
          APPLE=$(newest quiche-apple-natives)
          echo "linux=${LINUX}" >> "$GITHUB_OUTPUT"
          echo "apple=${APPLE}" >> "$GITHUB_OUTPUT"
          [ -n "$LINUX" ] || echo "::warning::No unexpired quiche-linux-natives-full artifact: the Linux fuzz and soak checks will not run tonight."
          [ -n "$APPLE" ] || echo "::warning::No unexpired quiche-apple-natives artifact: the macOS soak check will not run tonight."
          echo "linux natives from run: ${LINUX:-none}; apple natives from run: ${APPLE:-none}"

  # ── Lincheck ────────────────────────────────────────────────────────────────────────────────────
  # PR runs take about half a minute for the two scaled models (Lincheck's own work is iterations x
  # invocations, so a LINCHECK_SCALE of S is S^2 times that). The task checks plain Kotlin state and
  # needs no quiche natives, so it restores only the Gradle caches. --no-daemon so the test worker
  # inherits this step's LINCHECK_SCALE; --rerun because the variable is not a Gradle task input.
  lincheck:
    name: Lincheck deep
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      LINCHECK_SCALE: ${{ inputs.lincheck_scale || '10' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      - name: Restore Gradle build outputs
        uses: actions/cache/restore@v6
        with:
          path: ~/.gradle/caches
          key: gradle-linux-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-linux-

      - name: Restore Gradle wrapper distribution
        uses: actions/cache/restore@v6
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-linux-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Model check at LINCHECK_SCALE=${{ env.LINCHECK_SCALE }}
        run: |
          # -PlinuxTargets=false: the models are JVM tests. With the Linux native targets configured,
          # the task graph reaches the root project's liburing cinterop and :buildLiburingArm64, which
          # needs the aarch64 cross-compiler this job does not install — the first scheduled run
          # (43002973289) ended there, "Cross-compiler not found for ARM64", before any model ran.
          .github/scripts/gradle-retry.sh :socket-quic-quiche:lincheckTest \
            -PlinuxTargets=false --rerun --no-daemon --no-configuration-cache

      # Lincheck fails open when its instrumentation cannot hook a class, so a green task is not yet
      # evidence that anything was explored. Require the models to have run and to have seen the scale.
      - name: Prove the scaled budgets were used
        run: |
          set -euo pipefail
          DIR=socket-quic-quiche/build/test-results/lincheckTest
          TESTS=$(cat "$DIR"/*.xml | grep -o '<testsuite [^>]*' | grep -o ' tests="[0-9]*"' | tr -dc '0-9\n' | awk '{ n += $1 } END { print n + 0 }')
          echo "lincheck tests executed: ${TESTS}"
          [ "${TESTS:-0}" -gt 0 ] || { echo "::error::lincheckTest executed no tests"; exit 1; }
          grep -l "\[lincheck\] LINCHECK_SCALE=${LINCHECK_SCALE}\$" "$DIR"/*.xml > /dev/null \
            || { echo "::error::the test JVM did not report LINCHECK_SCALE=${LINCHECK_SCALE}"; exit 1; }
          {
            echo "## Lincheck deep"
            echo
            echo "${TESTS} model checks at LINCHECK_SCALE=${LINCHECK_SCALE}."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Lincheck results
        if: ${{ failure() || cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: deep-lincheck
          path: |
            socket-quic-quiche/build/reports/tests/lincheckTest/
            socket-quic-quiche/build/test-results/lincheckTest/
          retention-days: 14
          if-no-files-found: ignore

  # ── Fuzz: JVM (Jazzer) ──────────────────────────────────────────────────────────────────────────
  fuzz-jvm:
    name: "Fuzz deep JVM (${{ matrix.lane }})"
    needs: find-natives
    if: ${{ needs.find-natives.outputs.linux != '' }}
    runs-on: ubuntu-24.04
    # Fixed, because expressions cannot add: the bounds check in `find-natives` keeps fuzz_minutes under
    # 80, which leaves 40 minutes for toolchain restore and Gradle configuration.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: quiche-header
            task: ":socket-quic-quiche:quicHeaderFuzz"
            crash-dir: "socket-quic-quiche/build/fuzz/header-info"
            jni: "true"
          - lane: http3-codec
            task: ":socket-http3:http3CodecFuzz"
            crash-dir: "socket-http3/build/fuzz/http3-codec"
            jni: "false"
          - lane: http3-roundtrip
            task: ":socket-http3:http3RoundTripFuzz"
            crash-dir: "socket-http3/build/fuzz/http3-roundtrip"
            jni: "false"
          - lane: wt-capsule
            task: ":socket-http3:wtCapsuleFuzz"
            crash-dir: "socket-http3/build/fuzz/wt-capsule"
            jni: "false"
    env:
      ORG_GRADLE_PROJECT_quicCrashDiag: "1"
      FUZZ_MINUTES: ${{ inputs.fuzz_minutes || '40' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-quiche-env
        with:
          natives-run-id: ${{ needs.find-natives.outputs.linux }}
          github-token: ${{ github.token }}

      # The corpus the previous night ended with. Its key prefix is this workflow's own; the PR lanes'
      # `fuzz-corpus-jvm-*` keys are neither read nor written here. The save is a separate step so a
      # night that found a crash still keeps what the fuzzer learned.
      - name: Restore the deep corpus
        uses: actions/cache/restore@v6
        with:
          path: ${{ matrix.crash-dir }}/corpus
          key: deep-fuzz-corpus-jvm-${{ matrix.lane }}-${{ github.run_id }}
          restore-keys: |
            deep-fuzz-corpus-jvm-${{ matrix.lane }}-

      - name: Fuzz ${{ matrix.lane }} (Jazzer, ${{ env.FUZZ_MINUTES }} min)
        timeout-minutes: 100
        run: |
          if [ "${{ matrix.jni }}" = "true" ]; then
            # The quiche-header lane drives quiche over JNI: arm core capture, as the PR lane does.
            ulimit -c unlimited
            sudo mkdir -p /tmp/cores && sudo chmod 1777 /tmp/cores
            echo '/tmp/cores/core.%e.%p' | sudo tee /proc/sys/kernel/core_pattern >/dev/null
            .github/scripts/gradle-retry.sh ${{ matrix.task }} -PquicFuzzSeconds="$((FUZZ_MINUTES * 60))" --no-daemon \
              --no-configuration-cache
          else
            .github/scripts/gradle-retry.sh ${{ matrix.task }} -PquicFuzzSeconds="$((FUZZ_MINUTES * 60))" \
              --no-configuration-cache
          fi

      - name: Save the deep corpus
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ matrix.crash-dir }}/corpus
          key: deep-fuzz-corpus-jvm-${{ matrix.lane }}-${{ github.run_id }}

      - name: Upload fuzz crash inputs
        if: ${{ failure() || cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: deep-fuzz-crashes-jvm-${{ matrix.lane }}
          path: |
            ${{ matrix.crash-dir }}/crash-*
            ${{ matrix.crash-dir }}/oom-*
            ${{ matrix.crash-dir }}/timeout-*
            **/hs_err_pid*.log
            **/replay_pid*.log
            /tmp/cores/core.*
          retention-days: 14
          if-no-files-found: ignore

  # ── Fuzz: native under ASAN (cargo-fuzz) ────────────────────────────────────────────────────────
  # setup-linux-fuzz installs nightly Rust and cargo-fuzz and rebuilds quiche with SanitizerCoverage and
  # AddressSanitizer, so these legs need no natives artifact.
  fuzz-native:
    name: "Fuzz deep native ASAN (${{ matrix.lane }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: header-slice
            task: ":socket-quic-quiche:quicHeaderFuzzNative"
            corpus-dir: "socket-quic-quiche/build/fuzz-native/header-info-corpus"
            bssl-asan: "false"
          - lane: conn-recv
            task: ":socket-quic-quiche:quicConnRecvFuzzNative"
            corpus-dir: "socket-quic-quiche/build/fuzz-native/conn-recv-corpus"
            bssl-asan: "false"
          # conn-recv again, with BoringSSL itself ASAN-built (needs clang): the C half of the
          # handshake and packet-protection path under the same input stream.
          - lane: conn-recv-boringssl
            task: ":socket-quic-quiche:quicConnRecvFuzzNative"
            corpus-dir: "socket-quic-quiche/build/fuzz-native/conn-recv-corpus"
            bssl-asan: "true"
    env:
      FUZZ_MINUTES: ${{ inputs.fuzz_minutes || '40' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-linux-fuzz
        with:
          cargo-fuzz: "true"

      - name: Install clang (for BoringSSL ASAN)
        if: matrix.bssl-asan == 'true'
        uses: ./.github/actions/apt-install-cached
        with:
          purpose: "BoringSSL ASAN: matching clang runtime"
          timeout: "4m"
          packages: "clang"

      - name: Restore the deep corpus
        uses: actions/cache/restore@v6
        with:
          path: ${{ matrix.corpus-dir }}
          key: deep-fuzz-corpus-native-${{ matrix.lane }}-${{ github.run_id }}
          restore-keys: |
            deep-fuzz-corpus-native-${{ matrix.lane }}-

      # The ASAN report goes to stderr; tee it so triage does not depend on the job log.
      - name: Fuzz ${{ matrix.lane }} (cargo-fuzz ASAN, ${{ env.FUZZ_MINUTES }} min)
        timeout-minutes: 100
        run: |
          set -o pipefail
          mkdir -p /tmp/fuzz-logs
          FLAGS=""
          if [ "${{ matrix.bssl-asan }}" = "true" ]; then FLAGS="-PquicFuzzBoringSslAsan"; fi
          # shellcheck disable=SC2086 # FLAGS is empty or one flag
          .github/scripts/gradle-retry.sh ${{ matrix.task }} $FLAGS -PquicFuzzSeconds="$((FUZZ_MINUTES * 60))" \
            --no-configuration-cache \
            2>&1 | tee "/tmp/fuzz-logs/${{ matrix.lane }}-asan.log"

      - name: Save the deep corpus
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ matrix.corpus-dir }}
          key: deep-fuzz-corpus-native-${{ matrix.lane }}-${{ github.run_id }}

      - name: Upload fuzz crash inputs and ASAN report
        if: ${{ failure() || cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: deep-fuzz-crashes-native-${{ matrix.lane }}
          path: |
            socket-quic-quiche/fuzz/native/artifacts/**
            /tmp/fuzz-logs/${{ matrix.lane }}-asan.log
          retention-days: 14
          if-no-files-found: ignore

  # ── Soak ────────────────────────────────────────────────────────────────────────────────────────
  # The binary is the one the PR lanes link; one run of its soak suite takes about a second, so a
  # budget of tens of minutes is thousands of whole-binary runs. soak-loop.sh stops at the first run
  # that fails or hangs and keeps its full output: the per-client phase report the suite prints when it
  # times out, and any `[stall]` / `[nw-udp]` line from a cancel-path wait pending past 5 s.
  soak-linux-x64:
    name: "Soak deep (Linux x64)"
    needs: find-natives
    if: ${{ needs.find-natives.outputs.linux != '' }}
    runs-on: ubuntu-24.04
    # Fixed, because expressions cannot add: the bounds check in `find-natives` keeps soak_minutes under
    # 100, which leaves 80 minutes for the link (about 15 on a cold Konan cache) and slack.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-quiche-env
        with:
          natives-run-id: ${{ needs.find-natives.outputs.linux }}
          github-token: ${{ github.token }}

      - name: Link the quiche native test binary
        run: >-
          .github/scripts/gradle-retry.sh
          :socket-quic-quiche:linkDebugTestLinuxX64
          :socket-quic-quiche:verifyGeneratedTestCerts
          --no-configuration-cache

      - name: Loop the soak suite
        run: |
          .github/scripts/soak-loop.sh socket-quic-quiche/build/bin/linuxX64/debugTest/test.kexe \
            '*LinuxQuicConcurrencySoakTests*' "$(( ${{ inputs.soak_minutes || '45' }} * 60 ))" 180 /tmp/soak

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          { echo "## Soak deep (Linux x64)"; echo; cat /tmp/soak/result.txt; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the failing run's output
        if: ${{ failure() || cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: deep-soak-linux-x64
          path: /tmp/soak
          retention-days: 14
          if-no-files-found: ignore

  soak-macos-arm64:
    name: "Soak deep (macOS arm64)"
    needs: find-natives
    if: ${{ needs.find-natives.outputs.apple != '' }}
    runs-on: macos-26
    timeout-minutes: 180
    env:
      HARNESS_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/apple-quiche-env
        with:
          natives-run-id: ${{ needs.find-natives.outputs.apple }}
          github-token: ${{ github.token }}

      - name: Link the quiche native test binary
        run: >-
          .github/scripts/gradle-retry.sh
          :socket-quic-quiche:linkDebugTestMacosArm64
          :socket-quic-quiche:verifyGeneratedTestCerts
          --no-configuration-cache

      - name: Loop the soak suite
        run: |
          .github/scripts/soak-loop.sh socket-quic-quiche/build/bin/macosArm64/debugTest/test.kexe \
            '*AppleQuicConcurrencySoakTests*' "$(( ${{ inputs.soak_minutes || '45' }} * 60 ))" 180 /tmp/soak

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          { echo "## Soak deep (macOS arm64)"; echo; cat /tmp/soak/result.txt; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the failing run's output
        if: ${{ failure() || cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: deep-soak-macos-arm64
          path: /tmp/soak
          retention-days: 14
          if-no-files-found: ignore

  # ── Report ──────────────────────────────────────────────────────────────────────────────────────
  report:
    name: Report
    needs: [find-natives, lincheck, fuzz-jvm, fuzz-native, soak-linux-x64, soak-macos-arm64]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write # the tracking issue
    steps:
      - uses: actions/checkout@v7

      - name: Tabulate, and file the night's failures
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[]' | jq -s '.' > /tmp/jobs.json
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[]' | jq -s '.' > /tmp/artifacts.json
          # Only a failed check is passed on: a successful `find-natives` is bookkeeping, not a check.
          jq '[.[] | select(.name != "Find natives")]' /tmp/jobs.json > /tmp/checks.json

          GITHUB_OUTPUT=/tmp/report-out .github/scripts/deep-checks-report.sh /tmp/checks.json /tmp/artifacts.json Report > /tmp/report.md
          FAILED=$(sed -n 's/^failed=//p' /tmp/report-out)

          TODAY=$(date -u +%Y-%m-%d)
          { echo "## Nightly deep checks — ${TODAY}"; echo; cat /tmp/report.md; } >> "$GITHUB_STEP_SUMMARY"

          # A green night is quiet, and so is a manual run: only the schedule files issues.
          if [ "$FAILED" -eq 0 ] || [ "$EVENT" != "schedule" ]; then exit 0; fi

          # One issue holds the history, newest night first, the last 30 nights kept. A night after the
          # first also comments, because an edit notifies nobody.
          TITLE="Nightly deep checks: failing"
          NUM=$(gh issue list --state open --search "\"${TITLE}\" in:title" --json number,title \
                  --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -1)
          SECTION="### ${TODAY} — [run](${RUN_URL})"$'\n\n'"$(cat /tmp/report.md)"
          MARK='<!-- deep-checks-history -->'
          if [ -z "$NUM" ]; then
            printf '%s\n\n%s\n\n%s\n' \
              "Maintained by \`.github/workflows/nightly-deep-checks.yaml\`. Opened when a night's deep checks did not all pass; each failing night is added below." \
              "$MARK" "$SECTION" > /tmp/body.md
            gh issue create --title "$TITLE" --body-file /tmp/body.md
          else
            OLD=$(gh issue view "$NUM" --json body --jq .body)
            HEAD="${OLD%%"${MARK}"*}"
            HISTORY="${OLD#*"${MARK}"}"
            KEPT=$(printf '%s' "$HISTORY" | awk -v max=29 '/^### /{n++} n>=1 && n<=max')
            printf '%s%s\n\n%s\n\n%s\n' "$HEAD" "$MARK" "$SECTION" "$KEPT" > /tmp/body.md
            gh issue edit "$NUM" --body-file /tmp/body.md
            printf 'Deep checks failed again on %s: [run](%s)\n\n%s\n' "$TODAY" "$RUN_URL" "$(cat /tmp/report.md)" > /tmp/comment.md
            gh issue comment "$NUM" --body-file /tmp/comment.md
          fi
