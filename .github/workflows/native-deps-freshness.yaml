name: "Native Deps Freshness + Cache Warm"

# ---------------------------------------------------------------------------
# Two DAILY responsibilities, both about the from-source native deps that the
# rest of the automation does NOT cover:
#
#   1. Upstream freshness check (job: freshness)
#      Compare the pinned `quiche` (cloudflare/quiche) and `liburing`
#      (axboe/liburing) versions in gradle/libs.versions.toml against the
#      latest upstream releases. If either is behind, open — or UPDATE — a
#      single stable tracking issue. It never auto-bumps; it just surfaces the
#      signal. Idempotent: it finds the existing open issue by a fixed title +
#      the `dependencies` label and edits it, so it will not spam a new issue
#      every day. When everything is current it closes any stale tracking issue.
#
#   2. Native cache-warm (job: cache-warm)
#      Build the from-source native artifacts (BoringSSL, quiche, liburing) for
#      the Linux triples and SAVE them into the exact same actions/cache entries
#      (identical `path:` + `key:`) that the PR build (build-linux.yaml) later
#      restores. That turns the first PR of the day into a warm-cache hit
#      instead of a ~10-15 min cold from-source rebuild.
#
# This COMPLEMENTS weekly-dependency-update.yaml (#114), which owns the Gradle/
# Maven side: the coupled Kotlin/KSP/AGP/wrappers toolchain + the Gradle wrapper,
# AND the actual coordinated *bump* + validated PR for quiche/liburing. This
# workflow is the lightweight daily radar (surface-only, no PR) plus the cache
# priming — deliberately NOT a second bump path, so the two never race to open
# competing PRs against the same version catalog.
# ---------------------------------------------------------------------------

on:
  schedule:
    # 09:17 UTC every day. Off-peak by design:
    #   - Not on the top of the hour (GitHub's cron queues are most congested
    #     at :00, and Actions explicitly warns high-load slots get delayed).
    #   - 09:17 UTC == ~01:17 US-Pacific / ~04:17 US-Eastern — the Americas are
    #     asleep, so hosted-runner contention is low.
    #   - Clear of weekly-dependency-update.yaml's Sunday 03:15 UTC slot, so the
    #     two never contend for the shared native caches / runner pool on Sundays.
    - cron: "17 9 * * *"
  workflow_dispatch: {}

# Minimal footprint: read the repo to parse the pinned versions + build natives;
# write issues to raise/close the freshness tracker. No contents:write (never
# commits) and no pull-requests scope (never opens a PR — that's #114's job).
permissions:
  contents: read
  issues: write

concurrency:
  group: native-deps-freshness
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------------
  # 1. Upstream freshness — surface (don't bump) newer quiche / liburing.
  # -------------------------------------------------------------------------
  freshness:
    name: "Upstream freshness (quiche + liburing)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # gh CLI is preinstalled on ubuntu-latest runners; it reads GH_TOKEN for
      # auth. GITHUB_TOKEN carries the issues:write granted above.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Stable identity of the tracking issue — the ONLY thing that makes this
      # idempotent. Do not change the title without migrating the open issue.
      ISSUE_TITLE: "Native dep freshness: upstream updates available"
      ISSUE_LABEL: "dependencies"
    steps:
      - uses: actions/checkout@v7

      - name: Check upstream vs pinned and raise/update tracking issue
        run: |
          set -euo pipefail
          CATALOG="gradle/libs.versions.toml"

          # --- Parse the currently pinned versions out of the version catalog.
          # Match `quiche = "X.Y.Z"` / `liburing = "X.Y"` exactly (anchored key,
          # so `quicheSha256`/`liburingSha256` can't be mismatched).
          pinned_quiche=$(grep -E '^quiche[[:space:]]*=' "$CATALOG"   | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          pinned_liburing=$(grep -E '^liburing[[:space:]]*=' "$CATALOG" | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Pinned:   quiche=$pinned_quiche  liburing=$pinned_liburing"

          # --- Latest upstream. quiche release tags are bare (e.g. 0.29.2).
          latest_quiche=$(gh api repos/cloudflare/quiche/releases/latest --jq '.tag_name' 2>/dev/null || echo "")
          # liburing release tags are prefixed `liburing-X.Y` — strip the prefix
          # so it compares against the bare `2.15` in the catalog.
          latest_liburing_tag=$(gh api repos/axboe/liburing/releases/latest --jq '.tag_name' 2>/dev/null || echo "")
          latest_liburing=${latest_liburing_tag#liburing-}
          echo "Upstream: quiche=$latest_quiche  liburing=$latest_liburing"

          # newer <current> <candidate> -> true (exit 0) iff candidate is a
          # strictly-higher version than current, using version-aware sort.
          newer() {
            [ -n "$2" ] && [ "$1" != "$2" ] && \
              [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" = "$2" ]
          }

          findings=""
          if newer "$pinned_quiche" "$latest_quiche"; then
            findings="${findings}- \`quiche\`: pinned **${pinned_quiche}** → upstream **${latest_quiche}** (https://github.com/cloudflare/quiche/releases/tag/${latest_quiche})"$'\n'
          fi
          if newer "$pinned_liburing" "$latest_liburing"; then
            findings="${findings}- \`liburing\`: pinned **${pinned_liburing}** → upstream **${latest_liburing}** (https://github.com/axboe/liburing/releases/tag/${latest_liburing_tag})"$'\n'
          fi

          # Ensure the label exists so `--label` never fails the run (idempotent).
          gh label create "$ISSUE_LABEL" --color 0366d6 \
            --description "Dependency updates" 2>/dev/null || true

          # Find an existing OPEN tracking issue by exact title (stable identity).
          existing=$(gh issue list --state open --label "$ISSUE_LABEL" \
            --search "in:title \"$ISSUE_TITLE\"" \
            --json number,title \
            --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number // empty")

          if [ -z "$findings" ]; then
            echo "Both native deps are current."
            if [ -n "$existing" ]; then
              # Everything caught up since the last raise — close the tracker so
              # it doesn't linger as a false-positive.
              gh issue close "$existing" \
                --comment "All pinned native deps (quiche, liburing) are now current with upstream. Auto-closing the freshness tracker; it will reopen if a newer release appears." \
                --reason completed
              echo "Closed stale tracking issue #$existing."
            fi
            exit 0
          fi

          # Assemble the (stable-shaped) issue body.
          body=$(cat <<EOF
          Automated daily upstream freshness check (native-deps-freshness.yaml).

          The following from-source native dependencies pinned in \`gradle/libs.versions.toml\` are behind their latest upstream release:

          ${findings}
          These are surfaced, not auto-bumped. The coordinated bump + validated PR is handled by \`weekly-dependency-update.yaml\` (#114) — remember \`liburing\` is SHA256-verified so its \`liburingSha256\` must be recomputed on bump.

          _Last checked: $(date -u '+%Y-%m-%d %H:%M UTC'). This issue is updated in place daily while updates remain available, and auto-closes once both deps are current._
          EOF
          )

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$body"
            echo "Updated tracking issue #$existing."
          else
            gh issue create --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" --body "$body"
            echo "Opened new tracking issue."
          fi

  # -------------------------------------------------------------------------
  # 2. Native cache-warm — build BoringSSL / quiche / liburing into the SAME
  #    actions/cache entries build-linux.yaml restores, so PRs get a warm hit.
  #    Uses actions/cache (not restore-only) so a fresh build is SAVED at
  #    post-job. Keys/paths below are byte-for-byte identical to build-linux.yaml
  #    (all hashFiles('gradle/libs.versions.toml')-keyed) — if they drift, the
  #    warmed entry stops hitting on PR runs.
  # -------------------------------------------------------------------------
  cache-warm:
    name: "Warm native build caches (Linux x64 + arm64)"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # No `cache: gradle` — see build-linux.yaml. setup-java's gradle cache points at the same
      # ~/.gradle/caches directory the explicit `gradle-linux-*` entry holds, so enabling it stored
      # that tree twice under two keys, and this repo is at the 10GB Actions cache cap. (The Apple
      # half of this workflow already had the same note.)
      #
      # Removing it is only half the change, though: this job runs ./gradlew twice below, so with
      # no cache at all it cold-downloads the ~150MB Gradle distribution and re-resolves every
      # plugin on each scheduled run.
      #
      # ⚠️ These two were restore-ONLY, on the stated assumption that build-linux.yaml's `natives`
      # job writes them ("read the entry build-linux's `natives` job writes, add no bytes of our
      # own"). That writer has never once written them. Its save steps are gated
      # `github.ref == 'refs/heads/main'`, which on a `pull_request` run (review.yaml) is false, so
      # the only caller that reaches them is merged.yaml — and there the cache service refuses the
      # `pull_request_target` token outright:
      #     Failed to save: Unable to reserve cache with key gradle-linux-843f8943…
      #       More details: cache write denied: token has no writable scopes
      # `continue-on-error: true` on that step reports the failed save as conclusion=success, so it
      # never surfaced. Measured 2026-08-13: ZERO `gradle-linux-*` / `gradle-wrapper-linux-*`
      # entries existed in a store holding 82 caches / 5.35GB — not eviction, they were never
      # created. Every one of the 14 jobs the #337 fan-out starts within the same second therefore
      # cold-downloaded the Gradle distribution and re-resolved the plugin graph concurrently from
      # one runner egress IP, which is what produced the "unrelated" network failures on PR #350:
      #   QUIC malloc-check   SocketException: Unexpected end of file from server
      #                       (org.gradle.wrapper.Install.forceFetch, gradle-9.5.1-bin.zip)
      #   Fuzz quiche-header  Plugin [id: 'com.vanniktech.maven.publish', version: '0.36.0'] was
      #                       not found in any of the following sources
      #
      # So this job WRITES them, exactly as its Apple twin below already does for the
      # `gradle-macos-*` pair — and that asymmetry is precisely why Apple never had this problem.
      # A scheduled/dispatch run on main is a context the cache service accepts (verified: the
      # 2026-08-12 09:39 run saved gradle-macos-* and gradle-wrapper-macos-* successfully with an
      # even narrower token than merged.yaml's). Keys stay byte-identical to build-linux.yaml's, or
      # the warmed entry stops hitting on PR runs.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Cache Gradle build outputs
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: gradle-linux-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-linux-

      # The one that actually stops the stampede. `gradle-linux-*` above is keyed on every
      # *.gradle.kts, so a build-script edit rotates it and the daily warm cannot keep up (the
      # `gradle-linux-` prefix fallback still lands close). This key is keyed ONLY on
      # gradle-wrapper.properties, which changes a few times a year — so once warmed it hits for
      # every job on every PR, and the ~150MB distribution download that broke PR #350 stops being
      # something 14 concurrent jobs each do for themselves.
      - name: Cache Gradle wrapper distribution
        uses: actions/cache@v6
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-linux-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      # ⚠️ `konan-linux-*` is starved the same way and is deliberately NOT warmed here. It is not
      # main-gated in build-linux.yaml — plain actions/cache@v6, so PR runs write it, but only into
      # their own `refs/pull/N/merge` scope: unreadable by any other PR, unreadable by main, and
      # deleted by purge-pr-caches.yaml when the PR closes. Main's only writer is merged.yaml,
      # denied as above, so the store holds zero `konan-linux-*` entries and every Linux job
      # re-downloads the Kotlin/Native toolchain.
      # Adding a `Cache Konan` step to THIS job would make it worse, not better: the two ./gradlew
      # invocations below build only Rust/C targets (liburing, quiche) and never compile
      # Kotlin/Native, so ~/.konan would be empty or partial at post-job. Cache entries are
      # immutable per key, and build-linux.yaml's konan step is the full actions/cache@v6 — an
      # exact primary-key hit makes it skip its own save, so one empty warm would pin the empty
      # entry until gradle/libs.versions.toml next changes. Fixing it properly means giving this
      # job a real K/N compile to populate the toolchain first; tracked separately.

      # ---- Cache entries mirrored EXACTLY from build-linux.yaml ----
      - name: Cache BoringSSL x64
        uses: actions/cache@v6
        with:
          path: libs/boringssl/linux-x64
          key: boringssl-linux-x64-v4-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Cache BoringSSL ARM64
        uses: actions/cache@v6
        with:
          path: libs/boringssl/linux-arm64
          key: boringssl-linux-arm64-v4-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Cache liburing x64
        uses: actions/cache@v6
        with:
          path: libs/liburing/linux-x64
          key: liburing-linux-x64-v1-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Cache liburing ARM64
        uses: actions/cache@v6
        with:
          path: libs/liburing/linux-arm64
          key: liburing-linux-arm64-v1-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Cache quiche Linux x64
        uses: actions/cache@v6
        with:
          path: socket-quic-quiche/libs/quiche/linux-x64
          key: quiche-linux-x64-v8-${{ hashFiles('gradle/libs.versions.toml', 'socket-quic-quiche/build.gradle.kts', 'socket-quic-quiche/src/jni/quiche_jni.c') }}

      - name: Cache quiche Linux ARM64
        uses: actions/cache@v6
        with:
          path: socket-quic-quiche/libs/quiche/linux-arm64
          key: quiche-linux-arm64-v8-${{ hashFiles('gradle/libs.versions.toml', 'socket-quic-quiche/build.gradle.kts', 'socket-quic-quiche/src/jni/quiche_jni.c') }}

      # Intermediate cargo target/ tree + cloned quiche source — the same entry
      # build-linux.yaml keeps so a quiche rebuild is incremental, not from zero.
      - name: Cache quiche cargo target/ (all triples)
        uses: actions/cache@v6
        with:
          path: socket-quic-quiche/build/quiche
          key: quiche-cargo-target-v3-${{ hashFiles('gradle/libs.versions.toml', 'socket-quic-quiche/build.gradle.kts', 'socket-quic-quiche/src/jni/quiche_jni.c') }}
          restore-keys: quiche-cargo-target-v3-

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      # ---- Toolchain the native builds need (mirrors build-linux.yaml) ----
      # See .github/actions/apt-safe-update — kept in lockstep with build-linux.yaml, which needs it
      # for the same reason: an unused third-party source can otherwise exit-100 the whole job.
      - uses: ./.github/actions/apt-safe-update

      # ⚠️ THE SINGLE WRITER of the .deb cache — `save: true` appears here and nowhere else.
      #
      # This job is the only one that qualifies. Cache scope follows the ref, so a PR run writes
      # into `refs/pull/N/merge` where no other PR can read it (#352), and merged.yaml runs on
      # `pull_request_target`, which cannot write caches at all (#351). This workflow runs on a
      # schedule against `main`, so what it writes is the one scope every PR run can restore from.
      #
      # It also downloads the FULL manifest rather than just the two lines it used to install: the
      # cache has to serve the other seven call sites, and this job needed neither libclang-dev nor
      # the mingw pair. Warming only its own subset is what would leave every PR lane going back to
      # the mirror for exactly the packages that stall.
      #
      # Ordering note: this deliberately runs BEFORE the freshness checks below rather than after.
      # If a native build breaks, the .deb cache is still refreshed — the packages have nothing to
      # do with why that build failed, and letting a red freshness run also expire the apt cache
      # would couple two unrelated failures.
      - name: Install cross-compilation toolchains
        uses: ./.github/actions/apt-install-cached
        with:
          purpose: "nightly warmer (writes the cache every other lane restores)"
          save: "true"
          # Generous: this job is not on anyone's critical path, and a slow mirror here should be
          # survived rather than fled — failing means every PR lane tomorrow pays full price.
          timeout: "20m"
          packages: >-
            build-essential perl pkg-config cmake nasm
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust cross-compile targets
        run: rustup target add aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu

      # ---- Build the natives (same Gradle tasks build-linux.yaml runs) ----
      # continue-on-error so a broken native build never blocks the daily
      # freshness signal above, and so a partial warm still gets SAVED. Any
      # entry that hits on restore already skips its build (Gradle up-to-date).
      # BoringSSL is no longer built by socket (consumes the canonical :boringssl-canonical owner klib
      # + provision bundle), so there is no socket-built BoringSSL cache to warm here.
      - name: Warm liburing cache (x64 + arm64)
        continue-on-error: true
        run: ./gradlew :buildLiburingX64 :buildLiburingArm64 --no-configuration-cache

      - name: Warm quiche cache (shared x64/arm64 — each emits .so + K/Native .a)
        continue-on-error: true
        run: >-
          ./gradlew
          :socket-quic-quiche:buildQuicheSharedLinuxX64
          :socket-quic-quiche:buildQuicheSharedLinuxArm64
          --no-configuration-cache

      - name: Report warmed artifacts
        if: always()
        run: |
          echo "## Native cache-warm summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find libs/boringssl libs/liburing socket-quic-quiche/libs/quiche \
            -type f \( -name '*.a' -o -name '*.so' \) 2>/dev/null \
            | sort >> "$GITHUB_STEP_SUMMARY" || echo "(no artifacts produced)" >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  # 3. Apple native cache-warm.
  #
  #    Same job as `cache-warm` above, for the five Apple targets — and the
  #    reason it exists is measured, not theoretical. This workflow warmed only
  #    the Linux triples, so `refs/heads/main` carried NO `quiche-apple-v3-*`
  #    entry at all. GitHub scopes cache writes to the ref that made them: a PR
  #    can read its base branch's caches, but one PR cannot read another's. With
  #    main cold, EVERY Apple PR run paid a full from-source cargo + BoringSSL
  #    build for five targets.
  #
  #    Measured on PR #337 (run 31500984797 vs 31505526881), same commit content:
  #      cold (no cache on main) -> `Build quiche Apple native libs` = 514s,
  #                                 whole natives job 9m48s
  #      warm (entry on the ref) -> natives job 1m32s
  #    i.e. this job is worth ~8.5 minutes on the critical path of every single
  #    Apple PR run, for one scheduled macOS job a day.
  #
  #    Keys/paths below are byte-for-byte identical to build-apple.yaml's
  #    `natives` job — if they drift, the warmed entry silently stops hitting and
  #    the only symptom is that PRs get slow again. Uses actions/cache (not
  #    restore-only) so the fresh build is SAVED at post-job.
  #
  #    ⚠️ NO restore-keys on the quiche cache, matching build-apple.yaml: a prefix
  #    fallback can resurrect a sibling built from a DIFFERENT quiche source patch,
  #    which is the #260/#263 bug where a pre-caller-clock dylib satisfied the
  #    marker and the JNI shim failed to link.
  # -------------------------------------------------------------------------
  cache-warm-apple:
    name: "Warm native build caches (Apple)"
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # No `cache: gradle` — see build-apple.yaml. setup-java's gradle cache points at the same
      # ~/.gradle/caches the explicit step below saves, so enabling both stores it twice, and this
      # repo is at the 10GB Actions cache cap.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      # ---- Cache entries mirrored EXACTLY from build-apple.yaml's `natives` job ----
      - name: Cache Konan
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-macos-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-macos-

      - name: Cache Gradle build outputs
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: gradle-macos-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-macos-

      - name: Cache Gradle wrapper distribution
        uses: actions/cache@v6
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-macos-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cache quiche Apple native libs
        uses: actions/cache@v6
        with:
          path: |
            socket-quic-quiche/libs/quiche/macos-arm64/lib
            socket-quic-quiche/libs/quiche/macos-x64/lib
            socket-quic-quiche/libs/quiche/ios-arm64/lib
            socket-quic-quiche/libs/quiche/ios-simulator-arm64/lib
            socket-quic-quiche/libs/quiche/ios-x64/lib
          key: quiche-apple-v3-${{ hashFiles('gradle/libs.versions.toml', 'socket-quic-quiche/build.gradle.kts', 'socket-quic-quiche/src/jni/quiche_jni.c') }}

      # continue-on-error, like the Linux warm steps: this job is best-effort priming, never a
      # freshness gate. A partial warm still gets SAVED at post-job, and any entry that already hit
      # on restore skips its build via the marker/up-to-date check.
      - name: Warm quiche Apple cache (5 targets — macOS x2 + iOS device/sim-arm64/sim-x64)
        continue-on-error: true
        run: >-
          ./gradlew
          :socket-quic-quiche:buildQuicheAppleStaticLibs
          :socket-quic-quiche:prepareQuicheNativeLib
          --no-configuration-cache

      - name: Report warmed Apple artifacts
        if: always()
        run: |
          echo "## Apple native cache-warm summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find socket-quic-quiche/libs/quiche -type f \( -name '*.a' -o -name '*.dylib' \) 2>/dev/null \
            | sort >> "$GITHUB_STEP_SUMMARY" || echo "(no artifacts produced)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
