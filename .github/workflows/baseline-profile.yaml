name: Baseline profile

# Regenerates the baseline profiles the Android AARs ship (src/androidMain/baselineProfiles/ in :socket,
# :socket-quic, :socket-quic-default and :socket-quic-quiche), on a Gradle-managed emulator, and measures
# what the profile buys on first requests (FirstRequestBenchmark: CompilationMode.None vs the profile).
# Manual: run it after a change that moves the connect/read/write hot paths, then commit the profiles
# from the artifact. The numbers are an emulator's, a signal and not a result.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ORG_GRADLE_PROJECT_version: "0.0.0-baseline-profile"
  ORG_GRADLE_PROJECT_linuxTargets: "false"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install libclang
        uses: ./.github/actions/apt-install-cached
        with:
          purpose: "baseline profile: libclang for boring-sys bindgen"
          packages: libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          rustup target add x86_64-linux-android aarch64-linux-android armv7-linux-androideabi
          cargo install cargo-ndk

      - name: Generate and distribute the profiles
        run: |
          ./gradlew :benchmark-android-app:generateReleaseBaselineProfile :benchmark-android-app:distributeBaselineProfile \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect --no-configuration-cache

      - name: Measure first requests with and without the profile
        run: |
          ./gradlew :benchmark-baselineprofile:pixel6Api34BenchmarkReleaseAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=com.ditchoom.socket.benchmark.baselineprofile.FirstRequestBenchmark \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect --no-configuration-cache

      - name: Upload profiles and results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: baseline-profile
          path: |
            benchmarks/android-app/src/release/generated/baselineProfiles/**
            src/androidMain/baselineProfiles/**
            socket-quic/src/androidMain/baselineProfiles/**
            socket-quic-default/src/androidMain/baselineProfiles/**
            socket-quic-quiche/src/androidMain/baselineProfiles/**
            benchmarks/baselineprofile/build/outputs/**
          retention-days: 30
