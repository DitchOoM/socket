name: QUIC interop gate

# This library's QUIC client and server against every implementation the quic-interop-runner offers
# (test-harness/quic-interop/peers.json), one job per peer and direction, judged against
# test-harness/quic-interop/expectations.json by .github/scripts/quic-interop-gate.py.
#
# Directions: our-client (our client, their server), our-server (their client, our server),
# our-client-migrating (our client's transfer with six active migrations, QuicInteropEndpoint.kt
# ClientMode.ActiveMigration; the runner has no test in which the client moves its own path) and
# our-server-raised-streams (multiplexing against our server advertising 128 bidirectional streams instead of
# 100, InteropStreamLimit.Raised).
#
# Every cell job also writes <direction>__<peer>.evidence.json (quic-interop-evidence.py: facts from our
# endpoint's qlog and the runner's output), which the gate checks each known failure's signature against.
# A test that failed twice carries the retry's own record under "retry", and the gate requires each failed
# attempt to show the signature.
#
# A cell expected to pass that fails twice (one retry) fails the gate, so does a peer that produced no
# result and a cell with no expectation. A known failure that starts passing is STALE and fails the gate, so
# the file never goes out of date unnoticed. Called by review.yaml on every pull request and by
# quic-interop.yaml (nightly on main, and on demand, also to record a new expectations file).

on:
  workflow_call:
    inputs:
      await-natives:
        description: "Wait for this run's natives artifacts instead of expecting them to exist (a caller that runs beside the natives jobs, not after them)."
        required: false
        default: false
        type: boolean
      version:
        description: "The version to build the endpoint jar with."
        required: true
        type: string
      natives-run-id:
        description: "Run to take the quiche-linux-natives-full artifact from; empty means this run."
        required: false
        default: ""
        type: string
      stale:
        description: "warn or fail: what a stale expectation does to the gate."
        required: false
        default: "fail"
        type: string
      record:
        description: "record writes today's results as a new expectations file (an artifact) and never fails; gate judges."
        required: false
        default: "gate"
        type: string
      peers:
        description: "Comma-separated peers to run (names from peers.json); empty runs every peer. A partial run is never judged."
        required: false
        default: ""
        type: string
      tests:
        description: "Comma-separated runner tests; empty runs peers.json's list. Only a full run (every peer, every test) is judged."
        required: false
        default: ""
        type: string
      repeat:
        description: "How many times each cell runs its tests, each run kept in its own log directory."
        required: false
        default: "1"
        type: string

permissions:
  contents: read
  actions: read

env:
  ORG_GRADLE_PROJECT_version: ${{ inputs.version }}
  IMAGE: ditchoom-socket-interop:ci

jobs:
  plan:
    name: "plan"
    runs-on: ubuntu-24.04
    outputs:
      cells: ${{ steps.cells.outputs.cells }}
    steps:
      - uses: actions/checkout@v7
      - id: cells
        env:
          ONLY: ${{ inputs.peers }}
        run: |
          set -euo pipefail
          cells=$(jq -c --arg only "$ONLY" '[.peers | to_entries[]
                           | select(.key as $k | $only == "" or ($only | split(",") | index([$k])) != null)
                           | (if (.value | index("server")) then {peer: .key, direction: "our-client"} else empty end),
                             (if (.value | index("client")) then {peer: .key, direction: "our-server"} else empty end)]' \
                    test-harness/quic-interop/peers.json)
          echo "cells=$cells" >> "$GITHUB_OUTPUT"
          echo "$cells" | jq -r '.[] | "\(.direction) \(.peer)"'

  image:
    name: "endpoint image"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-quiche-env
        with:
          await-natives-producer: ${{ inputs.await-natives && 'quiche natives (Linux/Android/Windows)' || '' }}
          natives-run-id: ${{ inputs.natives-run-id }}
          github-token: ${{ github.token }}
      - name: Build the endpoint jar and image
        run: |
          set -euo pipefail
          ./gradlew :socket-quic-quiche:quicInteropJar -PlinuxTargets=false --no-configuration-cache
          docker build -t "$IMAGE" test-harness/quic-interop
          docker save "$IMAGE" | zstd -T0 -3 -o /tmp/quic-interop-image.tar.zst
      - uses: actions/upload-artifact@v7
        with:
          name: quic-interop-image
          path: /tmp/quic-interop-image.tar.zst
          retention-days: 3

  # The PPA's tshark, fetched once per run for every cell. See fetch-ppa-tshark.sh for why this uses
  # Launchpad's API and file server rather than the PPA's apt archive (2026-11-23: the archive answered 503
  # for every cell of run 45187417720 while the file server kept serving the same .debs).
  tshark:
    name: "tshark (wireshark-dev PPA)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the PPA's tshark packages
        run: .github/scripts/fetch-ppa-tshark.sh /tmp/tshark-debs
      - uses: actions/upload-artifact@v7
        with:
          name: quic-interop-tshark-debs
          path: /tmp/tshark-debs
          retention-days: 3

  cell:
    name: "${{ matrix.direction }} · ${{ matrix.peer }}"
    needs: [plan, image, tshark]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cells) }}
    env:
      PEER: ${{ matrix.peer }}
      DIRECTION: ${{ matrix.direction }}
      TESTS: ${{ inputs.tests }}
      REPEAT: ${{ inputs.repeat }}
    steps:
      - uses: actions/checkout@v7

      # The runner's docker-compose.yml names each sim interface, which Docker Engine rejects before v28.1.
      - uses: docker/setup-docker-action@v5
        with:
          version: version=v28.3.0

      - uses: actions/download-artifact@v8
        with:
          name: quic-interop-image
          path: /tmp

      - name: Load the endpoint image and prepare the simulator
        run: |
          set -euo pipefail
          zstd -dc /tmp/quic-interop-image.tar.zst | docker load
          sudo modprobe ip6table_filter

      - uses: actions/download-artifact@v8
        with:
          name: quic-interop-tshark-debs
          path: /tmp/tshark-debs

      # tshark decodes the captures the runner judges rebinding and handshakes from. See quic-interop.yaml's
      # history for why the issued connection id length must stay below 20.
      # The PPA's own packages come from the tshark job's artifact, so no cell contacts Launchpad. Only their
      # Ubuntu dependencies come from the archive, and the update and install are retried with backoff.
      - name: Install the runner and tshark
        run: |
          set -euo pipefail
          retry() {
            local attempt
            for attempt in 1 2 3 4 5 6; do
              "$@" && return 0
              echo "attempt $attempt of '$*' failed; retrying in $((attempt * 15)) s"
              sleep $((attempt * 15))
            done
            "$@"
          }
          sleep $((RANDOM % 30))
          retry sudo apt-get update
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          # Installing the .debs by path pins the PPA's build. Ubuntu's own tshark (4.2) has a dissector that
          # cannot follow a rebound path: every our-server rebind cell then fails "did not contain a
          # PATH_CHALLENGE" (run 44069038229). The version check below keeps that from passing silently.
          retry sudo DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/tshark-debs/*.deb
          installed=$(dpkg-query -W -f='${Version}' tshark)
          case "$installed" in
            "$(cat /tmp/tshark-debs/VERSION)") echo "tshark $installed from the wireshark-dev PPA" ;;
            *) echo "::error title=tshark is not the PPA's::installed $installed; the rebind cells need the PPA's dissector"; exit 1 ;;
          esac
          git clone --depth 1 https://github.com/quic-interop/quic-interop-runner.git /tmp/runner
          pip install -r /tmp/runner/requirements.txt
          # Without this the runner dies about once in ten runs on a tshark that exited normally.
          python3 "$GITHUB_WORKSPACE/.github/scripts/patch-pyshark-reap.py"
          cd /tmp/runner
          FILE=implementations_quic.json
          [ -f "$FILE" ] || FILE=implementations.json
          jq --arg img "$IMAGE" '. + {"ditchoom": {"image": $img, "url": "https://github.com/DitchOoM/socket", "role": "both"}}' \
            "$FILE" > /tmp/impl.json && mv /tmp/impl.json "$FILE"

      # run.py exits non-zero when a test fails; that is a result, judged by the gate job. A cell expected to
      # pass that failed runs once more, and the gate accepts it if the retry passes (reported as such).
      - name: Run
        working-directory: /tmp/runner
        run: |
          set -uo pipefail
          results="$GITHUB_WORKSPACE/interop-results"
          mkdir -p "$results" /tmp/interop
          exp="$GITHUB_WORKSPACE/test-harness/quic-interop/expectations.json"
          [ -f "$exp" ] || echo '{}' > "$exp"
          gate="$GITHUB_WORKSPACE/.github/scripts/quic-interop-gate.py"
          tests=${TESTS:-$(jq -r .tests "$GITHUB_WORKSPACE/test-harness/quic-interop/peers.json")}
          # The runner's whole output is kept beside its results. A run that wrote no results is the runner
          # failing, not a test: what it was doing and what the machine looked like are recorded for it.
          runner_crash() { # <logs> <json> <exit status> <runner log>
            local logs=$1 json=$2 rc=$3 log=$4 report="${2%.json}.runner-crash.txt"
            {
              echo "runner exit status: $rc (no results in $json)"
              echo "python: $(python3 --version 2>&1)"
              echo "pyshark: $(pip show pyshark 2>/dev/null | grep -m1 '^Version' || echo unknown)"
              echo "tshark: $(tshark --version 2>&1 | head -1)"
              echo "== memory"; free -m
              echo "== disk"; df -h /tmp
              echo "== kernel: out-of-memory and killed processes"
              sudo dmesg -T 2>/dev/null | grep -i -E 'oom|killed process|out of memory|segfault' | tail -40 || true
              echo "== captures (bytes, newest test last)"
              find "$logs" -name '*.pcap*' -printf '%TT %s %p\n' 2>/dev/null | sort | tail -20
              echo "== tshark processes still running"
              pgrep -a tshark || echo none
              echo "== the runner's last 120 lines"
              tail -120 "$log"
            } > "$report" 2>&1
            echo "::error::the interop runner wrote no results for $(basename "$json") (exit $rc); see $(basename "$report") in the results artifact"
            sed -n '1,40p' "$report"
          }
          run_pair() { # <tests> <logs> <json> [runner role flags...]
            local t=$1 logs=$2 json=$3 log="${3%.json}.runner.log" rc
            shift 3
            # run.py exits non-zero when a test fails, and this step runs under `bash -e`.
            rc=0
            python3 run.py "$@" -t "$t" -l "$logs" -j "$json" -d 2>&1 | tee "$log" || rc=$?
            if [ ! -s "$json" ]; then
              runner_crash "$logs" "$json" "$rc" "$log"
            elif ! why=$(python3 "$gate" ran "$json"); then
              # The runner skips every test of a peer it found "not compliant", an image it could not pull
              # included, and exits 0: a run of only skipped tests is the cell not running, which fails it here.
              echo "::error title=interop cell did not run::$(basename "$json"): $why"
              not_run+=("$(basename "$json")")
            fi
          }
          not_run=()
          # The runner pulls through docker compose with no retry, so one DNS timeout on the runner VM reads as a
          # peer that is not compliant. Every image a cell needs is pulled first, each with its own retries.
          impl=implementations_quic.json
          [ -f "$impl" ] || impl=implementations.json
          peer_image=$(jq -er --arg p "$PEER" '.[$p].image' "$impl")
          for img in "$peer_image" $(grep -oE '^\s*image: *[^$[:space:]]+' docker-compose.yml | awk '{print $2}' | sort -u); do
            for attempt in 1 2 3 4; do
              docker pull --quiet "$img" && break
              [ "$attempt" = 4 ] && { echo "::error title=peer image did not pull::$img, after $attempt attempts"; exit 1; }
              sleep $((attempt * 15))
            done
          done
          case "$DIRECTION" in
            our-client) roles=(-c ditchoom -s "$PEER") ;;
            our-server) roles=(-s ditchoom -c "$PEER") ;;
            *) echo "::error::unknown direction $DIRECTION"; exit 1 ;;
          esac
          run_pair "$tests" /tmp/interop/logs "$results/${DIRECTION}__${PEER}.json" "${roles[@]}"
          for n in $(seq 2 "${REPEAT:-1}"); do
            run_pair "$tests" "/tmp/interop/logs-repeat-$n" "$results/${DIRECTION}__${PEER}.repeat-$n" "${roles[@]}"
          done
          if [ -n "$TESTS" ]; then
            :
          elif [ -s "$results/${DIRECTION}__${PEER}.json" ]; then
            again=$(python3 "$gate" retry "$exp" "$DIRECTION" "$PEER" "$results/${DIRECTION}__${PEER}.json")
            if [ -n "$again" ]; then
              echo "retrying: $again"
              run_pair "$again" /tmp/interop/logs-retry "$results/${DIRECTION}__${PEER}.retry" "${roles[@]}"
            fi
          fi
          evidence="$GITHUB_WORKSPACE/.github/scripts/quic-interop-evidence.py"
          python3 -I "$evidence" /tmp/interop/logs "$DIRECTION" "$PEER" "$results/${DIRECTION}__${PEER}.evidence.json" /tmp/interop/logs-retry
          if [ "$DIRECTION" = our-server ] && [ -z "$TESTS" ]; then
            # The runner's compose file hands the server container SERVER_PARAMS from this environment.
            export SERVER_PARAMS=streams=raised
            raised="our-server-raised-streams"
            run_pair multiplexing /tmp/interop/logs-raised-streams "$results/${raised}__${PEER}.json" "${roles[@]}"
            if [ -s "$results/${raised}__${PEER}.json" ]; then
              again=$(python3 "$gate" retry "$exp" "$raised" "$PEER" "$results/${raised}__${PEER}.json")
              if [ -n "$again" ]; then
                run_pair "$again" /tmp/interop/logs-raised-streams-retry "$results/${raised}__${PEER}.retry" "${roles[@]}"
              fi
            fi
            unset SERVER_PARAMS
            python3 -I "$evidence" /tmp/interop/logs-raised-streams "$raised" "$PEER" "$results/${raised}__${PEER}.evidence.json" /tmp/interop/logs-raised-streams-retry
          fi
          if [ "$DIRECTION" = our-client ] && [ -z "$TESTS" ]; then
            # The runner's compose file hands the client container CLIENT_PARAMS from this environment.
            export CLIENT_PARAMS=migrate=active
            run_pair transfer /tmp/interop/logs-migrating "$results/our-client-migrating__${PEER}.json" "${roles[@]}"
            unset CLIENT_PARAMS
            python3 -I "$evidence" /tmp/interop/logs-migrating our-client-migrating "$PEER" "$results/our-client-migrating__${PEER}.evidence.json"
            find /tmp/interop/logs-migrating -name output.txt -exec grep -h -o 'MIGRATION-SUMMARY.*' {} + 2>/dev/null \
              | head -1 > "$results/our-client-migrating__${PEER}.summary" || true
            {
              echo "### Active migration against $PEER"
              echo '```'
              find /tmp/interop/logs-migrating -name output.txt -exec grep -h -o 'MIGRATION.*' {} + 2>/dev/null || echo "(no moves printed)"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # The runner's own verdict lines for every test that did not succeed, small enough to keep with the
          # results (the full logs, captures included, are a separate artifact of a few hundred MB).
          find /tmp/interop -name output.txt | sort | while read -r out; do
            if grep -q -E 'Test failed|Expected|Didn.t|not compliant|exited with code [1-9]|failed:|Exception' "$out"; then
              echo "== ${out#/tmp/interop/}"
              grep -E 'Test failed|Expected|Didn.t|not compliant|exited with code [1-9]|failed:|Exception|took longer|Got:|Wrong|Missing|check' "$out" | sed 's/\x1b\[[0-9;]*m//g' | tail -15
            fi
          done > "$results/${DIRECTION}__${PEER}.reasons.txt" || true
          ls -la "$results"
          [ "${#not_run[@]}" -eq 0 ] || { echo "::error::no test ran in: ${not_run[*]}"; exit 1; }

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: interop-results-${{ matrix.direction }}-${{ matrix.peer }}
          path: interop-results
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: interop-logs-${{ matrix.direction }}-${{ matrix.peer }}
          path: /tmp/interop
          if-no-files-found: warn
          retention-days: 7

  gate:
    name: "gate"
    needs: cell
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: interop-results-*
          path: interop-results
          merge-multiple: true
      - name: Judge every cell against the expectations
        if: ${{ inputs.peers == '' && inputs.tests == '' }}
        run: |
          set -uo pipefail
          exp=test-harness/quic-interop/expectations.json
          [ -f "$exp" ] || echo '{}' > "$exp"
          if [ "${{ inputs.record }}" = record ]; then
            python3 .github/scripts/quic-interop-gate.py judge "$exp" interop-results --record=/tmp/expectations.json | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 .github/scripts/quic-interop-gate.py judge "$exp" interop-results --stale=${{ inputs.stale }} | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.record == 'record' }}
        with:
          name: quic-interop-expectations
          path: /tmp/expectations.json
