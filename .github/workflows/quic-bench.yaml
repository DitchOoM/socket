name: QUIC benchmark

# Nightly QUIC performance numbers, so a regression is seen the night it lands instead of in a user's
# app. QuicBenchmark (socket-quic-quiche jvmTest) runs an in-process loopback server and client through
# four workloads: bulk throughput, 64-stream throughput, request/response latency (p50/p99) and
# handshake rate. It runs twice: on clean loopback, and under `tc netem` (delay + loss) so loss
# recovery and congestion control are in the measurement too.
#
# Each run is compared with the last successful run on main. A metric more than THRESHOLD_PCT worse is
# a warning, never a failure: hosted runners are noisy neighbours, and one bad night is a reason to
# look, not proof. A sustained drop across nights is the signal.
#
# On a pull request the `ab` job runs instead: the JMH suite in benchmarks/jvm (QUIC long-lived-stream
# round trip at 64 B and 1 KiB, stream-per-request, bulk throughput, TCP round trip, QPACK and varint
# codecs) on the PR's BASE and HEAD, in the same job on the same runner, for both quiche backends (FFM,
# the JDK 21 default, and JNI). Comparing two runs on one machine removes the machine-to-machine noise
# that makes a hosted runner useless for absolute thresholds; it prints the delta to the job summary and
# never fails on it. It lives here rather than in its own workflow because it needs exactly what the
# nightly needs (the borrowed quiche natives, linux-quiche-env) and the two are one subject: QUIC
# performance, one file.

on:
  pull_request:
    types: [opened, synchronize]
    # Only what can move a number: the transport and codec modules, the benchmarks, the build.
    paths:
      - 'src/**'
      - 'socket-quic/**'
      - 'socket-quic-quiche/src/**'
      - 'socket-quic-quiche/build.gradle.kts'
      - 'socket-quic-default/**'
      - 'socket-http3/src/**'
      - 'socket-udp/src/**'
      - 'benchmarks/jvm/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/quic-bench.yaml'
      - '.github/scripts/bench-delta.py'
  schedule:
    # 08:07 UTC, clear of flake-sweep (06:41), quic-interop (07:23) and native-deps-freshness (09:17).
    - cron: "7 8 * * *"
  workflow_dispatch:
    inputs:
      scale:
        description: "Workload scale (1 = full: 256 MB bulk, 64 x 4 MB streams, 2000 round trips, 200 handshakes)"
        required: false
        default: "1"

permissions:
  contents: read
  actions: read # borrows natives and reads the previous run's results

# The nightly runs one at a time (each compares with the last); a PR's A/B is superseded by its next push.
concurrency:
  group: quic-bench-${{ github.event.pull_request.number || 'nightly' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ORG_GRADLE_PROJECT_version: "0.0.0-bench"
  THRESHOLD_PCT: "15"
  NETEM: "delay 10ms 2ms loss 0.5%"

jobs:
  bench:
    name: "QUIC benchmark"
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Find a quiche natives artifact to borrow
        id: natives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=quiche-linux-natives-full&per_page=100" \
                  --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          if [ -z "$RID" ]; then
            echo "::error::No unexpired quiche-linux-natives-full artifact exists. Run build-linux once, then retry."
            exit 1
          fi
          echo "run-id=$RID" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/linux-quiche-env
        with:
          natives-run-id: ${{ steps.natives.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Build the benchmark jar
        run: ./gradlew :socket-quic-quiche:quicEchoJar -PlinuxTargets=false --no-configuration-cache

      - name: Run on clean loopback
        env:
          QUIC_BENCH_SCALE: ${{ inputs.scale || '1' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/bench
          echo "nproc=$(nproc) load=$(uptime | sed 's/.*average[s]*://')"
          java --enable-native-access=ALL-UNNAMED --add-opens java.base/java.nio=ALL-UNNAMED \
            -cp test-harness/quic-echo/quic-echo.jar com.ditchoom.socket.quic.QuicBenchmarkKt \
            test-harness/quic-echo/testcerts/cert.crt test-harness/quic-echo/testcerts/cert.key \
            /tmp/bench/loopback.json loopback

      # A tenth of the clean workload: every round trip now costs ~20 ms, so the full one would not
      # finish inside the job.
      - name: Run under netem
        env:
          SCALE: ${{ inputs.scale || '1' }}
        run: |
          set -euo pipefail
          export QUIC_BENCH_SCALE=$(python3 -c "print(float('$SCALE') * 0.1)")
          sudo tc qdisc add dev lo root netem $NETEM
          trap 'sudo tc qdisc del dev lo root 2>/dev/null || true' EXIT
          java --enable-native-access=ALL-UNNAMED --add-opens java.base/java.nio=ALL-UNNAMED \
            -cp test-harness/quic-echo/quic-echo.jar com.ditchoom.socket.quic.QuicBenchmarkKt \
            test-harness/quic-echo/testcerts/cert.crt test-harness/quic-echo/testcerts/cert.key \
            /tmp/bench/netem.json netem

      - name: Fetch the last main run's results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p /tmp/baseline
          RID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow quic-bench.yaml --branch main --status success \
                  --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$RID" ]; then
            gh run download "$RID" --repo "$GITHUB_REPOSITORY" -n quic-bench -D /tmp/baseline \
              && echo "baseline: run $RID" || echo "baseline run $RID has no quic-bench artifact"
          else
            echo "no previous successful run on main; this run becomes the first baseline"
          fi

      - name: Compare and summarise
        run: |
          python3 - <<'EOF'
          import json, os
          threshold = float(os.environ["THRESHOLD_PCT"])
          # Higher is better for rates, lower for latencies.
          higher_better = lambda k: not k.endswith("_us")
          lines = ["## QUIC benchmark", ""]
          for label in ("loopback", "netem"):
              cur = json.load(open(f"/tmp/bench/{label}.json"))["results"]
              base_path = f"/tmp/baseline/{label}.json"
              base = json.load(open(base_path))["results"] if os.path.exists(base_path) else {}
              lines += [f"### {label}" + (f" (netem: {os.environ['NETEM']})" if label == "netem" else ""), "",
                        "| Metric | Tonight | Last main | Change |", "|---|---|---|---|"]
              for k, v in cur.items():
                  b = base.get(k)
                  if b:
                      pct = (v - b) / b * 100
                      worse = -pct if higher_better(k) else pct
                      flag = " ⚠️" if worse > threshold else ""
                      if worse > threshold:
                          print(f"::warning title=QUIC benchmark regression::{label} {k}: {b} -> {v} ({pct:+.1f}%)")
                      lines.append(f"| {k} | {v} | {b} | {pct:+.1f}%{flag} |")
                  else:
                      lines.append(f"| {k} | {v} | – | – |")
              lines.append("")
          lines.append(f"⚠️ = more than {threshold:.0f}% worse than the last main run. Warnings only; hosted runners are noisy.")
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write("\n".join(lines) + "\n")
          EOF

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: quic-bench
          path: /tmp/bench
          retention-days: 90

  ab:
    name: "JVM benchmarks: base vs head"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BENCH_FLAG_PCT: "10"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find a quiche natives artifact to borrow
        id: natives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=quiche-linux-natives-full&per_page=100" \
                  --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          if [ -z "$RID" ]; then
            echo "::error::No unexpired quiche-linux-natives-full artifact exists. Run build-linux once, then retry."
            exit 1
          fi
          echo "run-id=$RID" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/linux-quiche-env
        with:
          natives-run-id: ${{ steps.natives.outputs.run-id }}
          github-token: ${{ github.token }}

      # The base tree gets the same quiche natives as the head, so a delta is the Kotlin and JNI-shim
      # code the PR changed, never two different libquiche builds. A PR that changes the quiche patches
      # changes the marker digest, and that tree rebuilds quiche for itself, as any job would.
      - name: Check out the base commit beside the head
        id: base
        run: |
          set -euo pipefail
          git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
          if [ ! -f "$RUNNER_TEMP/base/benchmarks/jvm/build.gradle.kts" ]; then
            echo "has-bench=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The base commit has no benchmarks/jvm; this run reports head numbers only."
            exit 0
          fi
          echo "has-bench=true" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/base/socket-quic-quiche/libs"
          cp -a socket-quic-quiche/libs/quiche "$RUNNER_TEMP/base/socket-quic-quiche/libs/"
          find "$RUNNER_TEMP/base/socket-quic-quiche/libs/quiche" -name '.*built-*' -exec touch {} +

      # Base, head, base, head: interleaved per backend so a neighbour that slows the runner for a few
      # minutes lands on both sides of a comparison rather than on one.
      - name: Run the benchmarks
        run: |
          set -euo pipefail
          mkdir -p /tmp/ab
          echo "nproc=$(nproc) load=$(uptime | sed 's/.*average[s]*://')"
          run() { # <tree> <side> <backend>
            ( cd "$1" && ./gradlew :benchmark-jvm:ciBenchmark -PlinuxTargets=false -PquicheJvmBackend="$3" --no-configuration-cache )
            cp "$(ls -td "$1"/benchmarks/jvm/build/reports/benchmarks/ci/*/ | head -1)main.json" "/tmp/ab/$2-$3.json"
          }
          for backend in ffm jni; do
            if [ "${{ steps.base.outputs.has-bench }}" = true ]; then run "$RUNNER_TEMP/base" base "$backend"; fi
            run "$GITHUB_WORKSPACE" head "$backend"
          done

      - name: Summarise the delta
        run: |
          set -euo pipefail
          {
            echo "## JVM benchmarks: base ${BASE_SHA:0:8} vs head ${GITHUB_SHA:0:8}"
            echo
            for backend in ffm jni; do
              base=/tmp/ab/base-$backend.json
              [ -f "$base" ] || base=-
              python3 .github/scripts/bench-delta.py "quiche backend: $backend" "$base" "/tmp/ab/head-$backend.json" "$BENCH_FLAG_PCT"
              echo
            done
            echo "### FFM vs JNI on the head"
            echo
            python3 .github/scripts/bench-delta.py "base = JNI, head = FFM" /tmp/ab/head-jni.json /tmp/ab/head-ffm.json "$BENCH_FLAG_PCT"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: jvm-bench-ab
          path: /tmp/ab
          retention-days: 30
